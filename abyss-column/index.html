<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>深渊纵列 · 海洋博物馆 / Abyss Column</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Nunito+Sans:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#d3e9f2;
  --ink-2:#8fb0c2;
  --ink-3:#5b7787;
  --line:rgba(140,205,232,.20);
  --line-2:rgba(140,205,232,.10);
  --glass:rgba(9,22,34,.42);
  --accent:#8beeff;
  --warm:#ffc7e0;
  --serif:"Fraunces",Georgia,"Songti SC",serif;
  --sans:"Nunito Sans","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#01050a;color:var(--ink);
  font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;user-select:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;display:block;z-index:0;touch-action:none}
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(to right,rgba(2,8,14,.55),transparent 16%,transparent 84%,rgba(2,8,14,.6)),
    linear-gradient(to bottom,rgba(2,10,18,.35),transparent 22%,transparent 80%,rgba(0,2,5,.72)),
    radial-gradient(120% 80% at 50% 0%,rgba(120,220,255,.07),transparent 60%);
}
.hud{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity .5s ease}
.hud.hidden{opacity:0}
.hud.hidden .cards,.hud.hidden .controls,.hud.hidden .status,.hud.hidden .docent{pointer-events:none}
.hud.hidden~.tags{opacity:0}

/* ---------- 标题 ---------- */
.brand{position:fixed;left:104px;top:22px;pointer-events:none;z-index:6}
.brand:before{content:"";position:absolute;z-index:-1;left:-42px;right:-30px;top:-26px;bottom:-16px;
  background:radial-gradient(120% 130% at 12% 0%,rgba(1,10,18,.62),rgba(1,10,18,.20) 55%,transparent 78%);
  pointer-events:none}
.brand .kicker{display:inline-flex;align-items:center;gap:6px;margin:0 0 7px;
  font-size:9.5px;letter-spacing:.30em;color:rgba(176,225,244,.86);text-transform:none;
  text-shadow:0 1px 12px rgba(0,14,24,.95)}
.brand .kicker s{text-decoration:none;display:block;width:16px;height:1px;background:rgba(150,225,250,.6)}
.brand h1{margin:0;font-family:var(--serif);font-weight:300;font-size:26px;letter-spacing:.10em;
  color:#f0fbff;text-shadow:0 2px 16px rgba(0,14,24,.92),0 0 30px rgba(90,200,240,.32)}
.brand .en{margin:6px 0 0;font-size:9px;letter-spacing:.34em;color:rgba(150,190,210,.86);text-transform:uppercase;
  text-shadow:0 1px 10px rgba(0,14,24,.9)}
.brand .rule{margin-top:9px;width:52px;height:1px;background:linear-gradient(to right,rgba(120,228,255,.7),transparent)}

/* ---------- 左侧深度尺 ---------- */
.ruler{position:fixed;left:0;top:0;bottom:0;width:96px;z-index:5;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 93%,transparent 100%)}
.ruler-body{position:absolute;inset:0;will-change:transform}
.ruler-spine{position:absolute;left:52px;top:-10%;width:1px;height:120%;
  background:linear-gradient(to bottom,rgba(150,225,250,.40),rgba(150,225,250,.16) 45%,rgba(150,225,250,.03))}
.mark{position:absolute;left:0;width:96px;height:1px;display:flex;align-items:center;justify-content:flex-end}
.mark i{display:block;height:1px;background:rgba(160,225,245,.42);margin-right:24px}
.mark.minor i{width:6px;background:rgba(160,225,245,.22)}
.mark.sub i{width:11px;background:rgba(160,225,245,.30)}
.mark.major i{width:20px;background:rgba(190,240,255,.62)}
.mark b{position:absolute;right:52px;top:50%;transform:translateY(-50%);
  font-family:var(--serif);font-weight:400;font-size:11px;letter-spacing:.06em;color:rgba(210,240,252,.92);
  text-shadow:0 0 10px rgba(0,20,35,.9)}
.mark.major b{font-size:12.5px;color:rgba(226,246,255,.95)}
.mark em{position:absolute;right:52px;top:50%;transform:translateY(-50%);
  font-style:normal;font-size:7.5px;letter-spacing:.22em;color:var(--ink-3);margin-right:34px}
.zone{position:absolute;left:52px;width:1px;background:linear-gradient(to bottom,rgba(120,228,255,.34),rgba(120,228,255,.02))}
.zone span{position:absolute;left:11px;top:8px;font-size:9.5px;letter-spacing:.38em;color:rgba(180,225,242,.72);
  writing-mode:vertical-rl;text-orientation:upright;text-shadow:0 0 10px rgba(0,20,35,.9)}
.zone b{position:absolute;left:6px;top:2px;width:9px;height:1px;background:rgba(150,225,250,.5)}

/* ---------- 右侧生物卡片 ---------- */
.cards{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;
  display:flex;flex-direction:column;gap:8px;width:252px;pointer-events:auto;
  max-height:calc(100vh - 96px);overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;padding-right:5px}
.cards::-webkit-scrollbar{display:none}
.card{position:relative;display:flex;align-items:center;gap:11px;padding:7px 11px 7px 8px;border-radius:15px;
  background:linear-gradient(150deg,rgba(20,44,62,.60),rgba(6,16,26,.48));
  border:1px solid var(--line-2);
  backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
  box-shadow:0 8px 26px rgba(0,0,0,.40),inset 0 1px 0 rgba(190,235,255,.10);
  cursor:grab;transition:transform .35s cubic-bezier(.2,.8,.25,1),border-color .3s,box-shadow .3s,background .3s}
.card:hover{transform:translateX(-5px);border-color:rgba(121,228,255,.40);
  box-shadow:0 10px 32px rgba(0,0,0,.5),0 0 0 1px rgba(121,228,255,.14),inset 0 1px 0 rgba(200,240,255,.18)}
.card:active{cursor:grabbing}
.card .thumb{position:relative;flex:0 0 74px;width:74px;height:54px;border-radius:11px;overflow:hidden;
  background:radial-gradient(76% 76% at 50% 40%,rgba(46,116,152,.72),rgba(8,20,32,.90));
  border:1px solid rgba(140,205,232,.12)}
.card .thumb canvas{display:block;width:100%;height:100%;filter:brightness(1.16) saturate(1.12)}
.card .thumb:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to top,rgba(3,9,15,.55),transparent 60%)}
.card .meta{min-width:0;flex:1}
.card .cn{font-family:var(--serif);font-size:16px;letter-spacing:.05em;color:#e9f8fd;line-height:1.15}
.card .la{font-size:8.2px;letter-spacing:.10em;color:var(--ink-3);text-transform:uppercase;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dep{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:9.6px;
  letter-spacing:.04em;color:rgba(158,205,225,.72);white-space:nowrap}
.card .dep .siz{display:inline-block;padding:1px 6px;border-radius:8px;font-weight:600;font-size:10px;
  letter-spacing:.02em;color:#0a2230;background:linear-gradient(180deg,#a9ecff,#63cdef)}
.card .dep i{flex:1;height:1px;background:linear-gradient(to right,rgba(121,228,255,.35),rgba(121,228,255,.02))}
.card .bar{position:absolute;left:0;top:12px;bottom:12px;width:1.5px;border-radius:2px;
  background:linear-gradient(to bottom,rgba(121,228,255,.9),rgba(121,228,255,.15))}
.card.flash{border-color:rgba(121,228,255,.75);box-shadow:0 0 0 1px rgba(121,228,255,.4),0 0 34px rgba(80,210,255,.35)}
.card{transition:transform .35s cubic-bezier(.2,.8,.25,1),border-color .3s,box-shadow .3s,background .3s,opacity .45s ease}
.card.off{opacity:.30;filter:saturate(.35)}
.card.off:hover{transform:none}

/* ---------- 讲解卡（走近展品） ---------- */
.docent{position:fixed;left:104px;bottom:170px;z-index:8;width:326px;
  max-height:calc(100vh - 300px);overflow-y:auto;scrollbar-width:none;
  padding:16px 17px 14px;border-radius:20px;
  background:linear-gradient(160deg,rgba(16,40,58,.86),rgba(4,13,21,.82));
  border:1px solid rgba(140,205,232,.20);
  backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(200,240,255,.14);
  opacity:0;transform:translateY(14px) scale(.985);pointer-events:none;
  transition:opacity .38s ease,transform .42s cubic-bezier(.2,.8,.25,1)}
.docent.on{opacity:1;transform:none;pointer-events:auto}
.docent::-webkit-scrollbar{display:none}
.d-top{display:flex;align-items:flex-start;gap:10px}
.d-top h2{margin:0;font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.06em;color:#eefaff;line-height:1.1}
.d-la{margin:4px 0 0;font-size:8.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.d-x{margin-left:auto;flex:0 0 26px;width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(140,205,232,.20);background:rgba(255,255,255,.04);color:rgba(200,230,245,.7);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:all .25s ease;font-family:var(--sans)}
.d-x:hover{background:rgba(121,228,255,.16);color:#eafaff;border-color:rgba(121,228,255,.45)}
.d-stats{display:flex;gap:9px;margin:13px 0 12px}
.d-stats>div{flex:1;padding:8px 10px;border-radius:12px;background:rgba(8,26,40,.55);
  border:1px solid rgba(140,205,232,.10)}
.d-stats span{display:block;font-size:9px;letter-spacing:.16em;color:rgba(140,180,200,.75)}
.d-stats>div.wide{flex:1.22}
.d-stats .wide b{font-size:13px;letter-spacing:0}
.d-stats b{display:block;margin-top:3px;font-family:var(--serif);font-weight:400;font-size:16px;
  letter-spacing:.03em;color:#dff4fd;white-space:nowrap}
.d-stats b i{font-style:normal;font-size:10px;color:var(--ink-2);margin-left:3px}
/* 深度是「900–4000」这种长数字，挤不下时宁可小一号也别折行 */
.d-stats>div:nth-child(2) b{font-size:14px}
.d-cmp{padding:11px 12px 12px;border-radius:13px;background:rgba(4,14,22,.5);
  border:1px solid rgba(140,205,232,.10)}
.d-cmp-t{font-size:9px;letter-spacing:.20em;color:rgba(140,180,200,.72);margin-bottom:9px}
.d-bar{display:flex;align-items:center;gap:8px;margin-top:6px}
.d-bar:first-of-type{margin-top:0}
.d-bar>span{flex:0 0 62px;font-size:9.5px;letter-spacing:.03em;color:rgba(170,208,226,.85);text-align:right}
.d-track{position:relative;flex:1;height:11px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden}
.d-track>div{position:absolute;left:0;top:0;bottom:0;border-radius:6px;
  background:linear-gradient(90deg,rgba(121,228,255,.85),rgba(121,228,255,.35));
  box-shadow:0 0 12px rgba(90,215,250,.35)}
.d-bar.hum .d-track>div{background:linear-gradient(90deg,rgba(255,199,224,.85),rgba(255,199,224,.30));
  box-shadow:0 0 12px rgba(255,199,224,.30)}
.d-bar>em{flex:0 0 46px;font-style:normal;font-size:9.5px;color:rgba(150,195,215,.8)}
.d-fact{margin:11px 0 0;font-size:11.5px;line-height:1.75;letter-spacing:.02em;color:rgba(198,228,240,.92)}
.d-note{margin:9px 0 0;font-size:8.5px;line-height:1.6;letter-spacing:.04em;color:rgba(120,160,180,.62)}

/* ---------- 体型对照图（展厅墙面） ---------- */
.chart-bg{position:fixed;inset:0;z-index:11;background:rgba(1,6,11,.62);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .35s}
.chart-bg.on{opacity:1;pointer-events:auto}
.chart{position:fixed;z-index:12;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);
  width:min(680px,94vw);max-height:91vh;overflow-y:auto;padding:24px 28px 20px;border-radius:22px;
  background:linear-gradient(160deg,rgba(15,38,56,.95),rgba(4,12,20,.94));
  border:1px solid rgba(140,205,232,.20);
  box-shadow:0 26px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(200,240,255,.14);
  opacity:0;pointer-events:none;transition:opacity .38s ease,transform .42s cubic-bezier(.2,.8,.25,1);
  scrollbar-width:none}
.chart::-webkit-scrollbar{display:none}
.chart.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.c-head{display:flex;align-items:center;gap:10px}
.chart h3{margin:0;font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.08em;color:#eefaff}
.chart h3 em{font-style:normal;font-size:9.5px;letter-spacing:.22em;color:var(--ink-3);margin-left:9px}
.chart .c-sub{margin:7px 0 12px;font-size:11px;line-height:1.65;letter-spacing:.02em;color:rgba(158,198,218,.82)}
/* 21 种加成年人要在一屏里排完，行距收紧；最后一行不能被面板底边切掉 */
.sc-row{display:flex;align-items:center;gap:11px;margin-bottom:3px}
.sc-row .sc-n{flex:0 0 100px;text-align:right;font-size:12px;letter-spacing:.02em;line-height:1.15;
  color:rgba(206,234,245,.94)}
.sc-row .sc-n s{display:block;text-decoration:none;font-size:7.5px;letter-spacing:.03em;line-height:1.15;
  color:rgba(120,160,180,.62);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-row .sc-track{position:relative;flex:1;height:17px;border-radius:10px;background:rgba(255,255,255,.04);
  overflow:hidden;background-image:repeating-linear-gradient(to right,
    rgba(140,205,232,.12) 0 1px,transparent 1px 20%)}
.sc-row .sc-track>div{position:absolute;left:0;top:2px;bottom:2px;border-radius:9px;min-width:3px;
  transition:width .6s cubic-bezier(.2,.8,.25,1)}
.sc-row .sc-v{flex:0 0 56px;font-family:var(--serif);font-size:12.5px;letter-spacing:.02em;color:rgba(220,246,255,.94)}
.sc-row.hum .sc-n{color:#ffc7e0}
.sc-row.hum .sc-track>div{background:linear-gradient(90deg,rgba(255,199,224,.9),rgba(255,199,224,.35))}
.chart .c-foot{margin:11px 0 0;font-size:10px;line-height:1.65;letter-spacing:.02em;color:rgba(130,170,190,.7);
  padding-top:10px;border-top:1px solid rgba(140,205,232,.10)}
/* 内容比面板高时，底部留一道渐隐，暗示还能往下滚 */
.chart::after{content:"";position:sticky;bottom:-22px;display:block;height:34px;
  margin:0 -28px -22px;pointer-events:none;
  background:linear-gradient(to top,rgba(6,17,27,.96),rgba(6,17,27,0))}

/* ---------- 水下标牌 ---------- */
.tags{position:fixed;inset:0;pointer-events:none;z-index:7;transition:opacity .4s ease}
.tag{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-100%) scale(.9);
  padding:4px 10px;border-radius:10px;white-space:nowrap;
  font-size:11px;letter-spacing:.06em;color:#e8f8ff;
  background:rgba(6,22,34,.72);border:1px solid rgba(121,228,255,.34);
  box-shadow:0 4px 18px rgba(0,0,0,.45);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.25,1)}
.tag.on{opacity:1;transform:translate(-50%,-100%) scale(1)}
.tag b{font-family:var(--serif);font-weight:400;font-size:12px;letter-spacing:.04em}
.tag i{font-style:normal;font-size:10px;color:#8beeff;margin-left:6px}

/* ---------- 控制栏 ---------- */
.controls{position:fixed;left:104px;bottom:54px;z-index:6;display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;pointer-events:auto;max-width:calc(100% - 390px)}
.btn{font-family:var(--sans);font-size:11px;letter-spacing:.09em;color:rgba(210,238,248,.86);
  padding:9px 12px;min-height:36px;border-radius:20px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;
  background:rgba(8,20,32,.52);border:1px solid var(--line-2);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:all .28s ease}
.btn:hover{color:#eafaff;border-color:rgba(121,228,255,.40);background:rgba(14,34,50,.66)}
.btn.on{color:#041219;background:linear-gradient(180deg,#9debff,#5fd0f0);border-color:rgba(180,245,255,.8);
  box-shadow:0 0 22px rgba(90,215,250,.42);font-weight:600;
  transition:background .28s ease,border-color .28s ease,box-shadow .28s ease}
.btn.key{border-color:rgba(255,199,224,.30);color:rgba(255,222,236,.9)}
.btn.key:hover{background:rgba(255,199,224,.14);border-color:rgba(255,199,224,.55)}
.slid{display:flex;align-items:center;gap:9px;padding:7px 14px;min-height:36px;border-radius:20px;
  background:rgba(8,20,32,.52);border:1px solid var(--line-2);backdrop-filter:blur(12px)}
.slid label{font-size:10.5px;letter-spacing:.14em;color:var(--ink-2)}
.slid input{-webkit-appearance:none;appearance:none;width:78px;height:3px;border-radius:2px;outline:none;
  background:linear-gradient(to right,rgba(121,228,255,.85),rgba(121,228,255,.16))}
.slid input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#d6f7ff;box-shadow:0 0 12px rgba(110,225,255,.9);cursor:pointer}
.slid input::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#d6f7ff;
  box-shadow:0 0 12px rgba(110,225,255,.9);cursor:pointer}

/* ---------- 深度导览 / 潜航 ---------- */
.dive{position:fixed;left:104px;top:122px;z-index:7;width:350px;pointer-events:auto;
  padding:13px 15px 12px;border-radius:18px;
  background:linear-gradient(160deg,rgba(13,34,50,.74),rgba(4,12,20,.64));
  border:1px solid rgba(140,205,232,.16);
  backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 16px 44px rgba(0,0,0,.46),inset 0 1px 0 rgba(200,240,255,.10);
  transition:border-color .4s ease,box-shadow .4s ease}
.dive.on{border-color:rgba(121,228,255,.34);
  box-shadow:0 16px 44px rgba(0,0,0,.5),0 0 0 1px rgba(121,228,255,.10),inset 0 1px 0 rgba(200,240,255,.16)}
.dive-head{display:flex;align-items:center;gap:11px}
.dive-tog{flex:0 0 auto;font-size:11px;padding:8px 13px;min-height:32px}
.dive-read{display:flex;align-items:baseline;gap:3px;min-width:0;flex:1}
.dive-read b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.02em;color:#f0fbff;line-height:1;
  font-variant-numeric:tabular-nums}
.dive-read i{font-style:normal;font-size:9.5px;color:var(--ink-2)}
.dive-read em{font-style:normal;margin-left:9px;font-size:9.5px;letter-spacing:.12em;
  color:rgba(150,205,225,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dive-slide{position:relative;margin-top:12px}
.dive-slide input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:3px;border-radius:2px;
  outline:none;background:linear-gradient(to right,rgba(150,240,255,.9),rgba(90,150,210,.55) 55%,rgba(40,70,110,.5))}
.dive-slide input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:#e6fbff;box-shadow:0 0 14px rgba(110,225,255,.95);cursor:pointer;border:0}
.dive-slide input::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:#e6fbff;
  box-shadow:0 0 14px rgba(110,225,255,.95);cursor:pointer}
.dive-ticks{position:relative;height:17px;margin-top:1px}
.dive-ticks b{position:absolute;top:0;width:1px;height:5px;background:rgba(150,225,250,.38);cursor:pointer}
.dive-ticks b:before{content:"";position:absolute;left:-5px;top:-4px;width:11px;height:14px}
.dive-ticks b s{position:absolute;left:50%;transform:translateX(-50%);top:6px;text-decoration:none;
  font-size:8px;letter-spacing:.01em;color:rgba(140,185,205,.72);white-space:nowrap;font-family:var(--serif)}
/* 两端的刻度文字往里收，不然会被面板圆角切掉半个字 */
.dive-ticks b:first-child s{left:0;transform:none}
.dive-ticks b:last-child s{left:auto;right:0;transform:none}
.dive-ticks b.hot s{color:rgba(200,240,255,.95)}
.dive-tip{margin:8px 0 0;font-size:10.5px;line-height:1.6;letter-spacing:.02em;color:rgba(178,214,230,.84);
  min-height:2.1em}

/* 本层环境仪表 */
.dive-env{display:flex;gap:11px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(140,205,232,.13)}
.dive-env>div{flex:1;min-width:0}
.dive-env>div:nth-child(1){--c:#ffcfa2}
.dive-env>div:nth-child(2){--c:#ffe7a3}
.dive-env>div:nth-child(3){--c:#9fd2ff}
.dive-env i{display:block;font-style:normal;font-size:8.5px;letter-spacing:.18em;margin-bottom:3px;
  color:rgba(150,195,220,.55)}
.dive-env .val{display:flex;align-items:baseline;gap:2px;white-space:nowrap}
.dive-env .val b{font-family:var(--serif);font-weight:400;font-size:14.5px;line-height:1;color:#e2f6ff;
  font-variant-numeric:tabular-nums}
.dive-env .val em{font-style:normal;font-size:8.5px;color:rgba(150,195,220,.62)}
/* 没在潜航时仪表只是占位，别让「— °C」看起来像读数 */
.dive-env.off .val em{display:none}
.dive-env .bar{height:2px;margin-top:5px;border-radius:1px;background:rgba(140,205,232,.13);overflow:hidden}
.dive-env .bar u{display:block;height:100%;width:0;border-radius:1px;background:var(--c);opacity:.8;
  transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- 状态栏 ---------- */
.status{position:fixed;left:0;right:0;bottom:0;z-index:6;height:44px;display:flex;align-items:center;
  justify-content:center;gap:14px;font-size:10.5px;letter-spacing:.10em;color:var(--ink-3);
  background:linear-gradient(to top,rgba(1,5,9,.72),transparent);pointer-events:none;padding:0 16px}
.status b{font-family:var(--serif);font-weight:400;font-size:12.5px;letter-spacing:.06em;color:rgba(214,242,252,.92)}
.status .dot{width:3px;height:3px;border-radius:50%;background:rgba(121,228,255,.55)}
.status .hint{color:rgba(120,160,180,.55);letter-spacing:.10em}
.status .hint b{font-size:10px;letter-spacing:.10em;color:rgba(160,205,225,.7)}
#depthRead em{font-style:normal;font-size:9.5px;letter-spacing:.04em;color:rgba(120,170,195,.65);margin-left:5px}

/* 加载失败的兜底提示 */
.bootwarn{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
  padding:26px;text-align:center;
  background:radial-gradient(circle at 50% 42%,rgba(10,26,38,.97),rgba(2,7,12,.99) 70%)}
.bootwarn.on{display:flex}
.bootwarn>div{max-width:430px}
.bootwarn b{display:block;font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:.06em;
  color:#dff4ff;margin-bottom:12px}
.bootwarn p{margin:0;font-size:12px;line-height:1.95;letter-spacing:.04em;color:rgba(172,206,230,.7)}

/* 拖动幽灵 */
.ghost{position:fixed;z-index:20;pointer-events:none;transform:translate(-50%,-50%);
  padding:5px 11px;border-radius:16px;font-size:10px;letter-spacing:.14em;
  background:rgba(8,26,40,.72);border:1px solid rgba(121,228,255,.5);color:#d9f6ff;
  box-shadow:0 0 26px rgba(90,215,250,.35);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .18s}
.ghost.on{opacity:1}
.dropline{position:fixed;left:0;right:0;height:1px;z-index:19;pointer-events:none;opacity:0;
  background:linear-gradient(to right,transparent,rgba(121,228,255,.75),transparent);
  box-shadow:0 0 16px rgba(90,215,250,.6);transition:opacity .18s}
.dropline.on{opacity:1}

/* ---------- 响应式 ---------- */
@media (max-width:760px){
  .brand{left:auto;right:14px;top:14px;text-align:right}
  .brand:before{left:-30px;right:-14px;top:-14px;bottom:-10px;
    background:radial-gradient(130% 140% at 88% 0%,rgba(1,10,18,.72),rgba(1,10,18,.24) 58%,transparent 80%)}
  .brand .kicker{font-size:8px;letter-spacing:.2em;margin-bottom:4px}

  .mark{width:58px;justify-content:flex-start}

  .mark b{right:auto;left:26px;text-align:left;font-size:9.5px;letter-spacing:0}
  .mark.major b{font-size:11px}
  .mark em{display:none}
  .zone{left:20px}
  .zone span{left:7px;font-size:8px;letter-spacing:.26em;color:rgba(170,215,235,.6)}
  .dive{left:auto;right:8px;top:98px;width:calc(100% - 78px);padding:10px 12px 10px}
  .dive-read b{font-size:18px}
  .dive-read em{font-size:8.5px;letter-spacing:.06em;margin-left:6px}
  .dive-tog{font-size:10px;padding:7px 10px;min-height:30px}
  .dive-env{gap:8px;margin-top:8px;padding-top:8px}
  .dive-env .val b{font-size:13px}
  .dive-env i{font-size:7.5px;letter-spacing:.14em}
  .dive-tip{font-size:9.5px;line-height:1.5;margin-top:6px;display:none}
  /* 竖屏手机上玻璃板几乎横跨整个屏幕，动物往下挪一点才看得到 */
  .dive-ticks b s{font-size:7px}
  .cards{top:auto;bottom:96px;left:8px;right:8px;width:auto;transform:none;
    flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:8px;padding:2px 4px 6px;

}
@media (max-width:760px) and (orientation:landscape){
  .cards{bottom:56px}

<script>
(function(){
'use strict';

/* 三个 CDN 都没拿到 Three.js 时别留一片黑，直接告诉人该怎么办 */
if (!window.THREE){
  var bw = document.getElementById('bootWarn');
  if (bw) bw.classList.add('on');
  return;
}

/* ============================================================
   0. 常量与深度映射
   ============================================================ */
var TAU = Math.PI * 2;
var Y_TOP = 22, Y_BOT = -22, WORLD_H = 44, DEPTH_MAX = 4000;
var MAX_CREATURES = 48;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }
function smoothstep(e0,e1,x){ var t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

// 非线性深度 -> 归一化屏幕纵坐标（0 顶部 / 1 底部）
var ZONES_MAP = [
  { d0:0,    d1:200,  n0:0.00, n1:0.19 },
  { d0:200,  d1:1000, n0:0.19, n1:0.50 },
  { d0:1000, d1:4000, n0:0.50, n1:1.00 }
];
function depthToNorm(d){
  d = clamp(d, 0, DEPTH_MAX);
  for (var i=0;i<ZONES_MAP.length;i++){
    var z = ZONES_MAP[i];
    if (d <= z.d1){ var t=(d-z.d0)/(z.d1-z.d0); return z.n0+(z.n1-z.n0)*t; }
  }
  return 1;
}
function normToDepth(n){
  n = clamp(n, 0, 1);
  for (var i=0;i<ZONES_MAP.length;i++){
    var z = ZONES_MAP[i];
    if (n <= z.n1){ var t=(n-z.n0)/(z.n1-z.n0); return z.d0+(z.d1-z.d0)*t; }
  }
  return DEPTH_MAX;
}
function depthToY(d){ return Y_TOP - depthToNorm(d)*WORLD_H; }
function yToDepth(y){ return normToDepth((Y_TOP-y)/WORLD_H); }

/* ============================================================
   1. GLSL
   ============================================================ */
var GLSL_NOISE = [
'float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }',
'float noise2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
'  return mix(mix(hash21(i),hash21(i+vec2(1.0,0.0)),f.x), mix(hash21(i+vec2(0.0,1.0)),hash21(i+vec2(1.0,1.0)),f.x), f.y); }',
'float fbm2(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<4;i++){ v+=a*noise2(p); p=p*2.02+vec2(1.7,9.2); a*=0.5; } return v; }'
].join('\n');

/* ---- 背景海水 ---- */
var BG_VERT = [
'varying vec2 vUv;',
'void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }'
].join('\n');

var BG_FRAG = [
'precision highp float;',
'varying vec2 vUv;',
'uniform float uTime, uBob, uStill, uClear, uAspect, uBgZoom;',
GLSL_NOISE,
'vec3 bandColor(float t){',
'  vec3 c = vec3(0.52,0.79,0.74);',
'  c = mix(c, vec3(0.17,0.60,0.70), smoothstep(0.02,0.13,t));',
'  c = mix(c, vec3(0.05,0.31,0.53), smoothstep(0.11,0.30,t));',
'  c = mix(c, vec3(0.018,0.145,0.315), smoothstep(0.28,0.55,t));',
'  c = mix(c, vec3(0.007,0.048,0.105), smoothstep(0.52,0.80,t));',
'  c = mix(c, vec3(0.0012,0.008,0.017), smoothstep(0.78,0.98,t));',
'  return c;',
'}',
'void main(){',
'  vec2 uv = vUv;',
'  float asp = max(uAspect, 0.35);',
'  float t = clamp(0.5 + (0.5 - uv.y)/max(0.35, uBgZoom) + uBob, 0.0, 1.6);',
'  vec3 col = bandColor(t);',
'  float mv = 1.0 - uStill*0.85;',
'  float tm = uTime*mv;',
'  float n1 = fbm2(vec2(uv.x*2.3*asp + tm*0.014, t*6.5 - tm*0.020));',
'  float n2 = fbm2(vec2(uv.x*5.2*asp - tm*0.024, t*12.0 + tm*0.010));',
'  float bands = (n1-0.5)*0.95 + (n2-0.5)*0.55;',
'  col += bands * 0.058 * vec3(0.34,0.76,1.0) * (1.0 - t*0.72) * (1.0 + uClear*0.6);',
'  float body = fbm2(vec2(uv.x*2.9*asp + tm*0.010, t*3.6));',
'  col *= 1.0 - 0.26*smoothstep(0.52,1.0,t)*body;',
'  float topMask = smoothstep(0.17, 0.0, t);',
'  vec2 wc = vec2(0.5, 0.015 + sin(tm*0.22)*0.012);',
'  vec2 wp = (uv - wc) * vec2(asp,1.0);',
'  float wd = length(wp)/0.33;',
'  float win = smoothstep(1.10,0.80,wd) * topMask;',
'  float ca = fbm2(wp*8.5 + vec2(tm*0.05,-tm*0.09));',
'  float ca2 = fbm2(wp*17.0 - vec2(tm*0.08,tm*0.05));',
'  float cells = smoothstep(0.44,0.80,ca*0.65+ca2*0.45);',
'  vec3 winCol = mix(vec3(0.42,0.80,0.90), vec3(1.0,0.98,0.86), cells);',
'  col = mix(col, winCol, win*0.86);',
'  col += vec3(1.0,0.95,0.80) * win * cells * 0.42;',
'  col += vec3(0.70,0.95,1.0) * smoothstep(1.02,0.94,wd) * smoothstep(0.94,1.0,wd) * topMask * 0.25;',
'  float spark = fbm2(vec2(uv.x*46.0*asp + tm*0.55, t*70.0));',
'  col += vec3(1.0,0.96,0.84) * smoothstep(0.86,1.0,spark) * topMask * 0.5 * mv;',
'  float gl2 = exp(-pow((t-0.0)*9.0,2.0)) * (0.6+0.4*sin(uv.x*3.1415*asp*2.0+tm*0.25));',
'  col += vec3(0.55,0.86,0.92)*gl2*0.20*topMask;',
'  vec2 vv = (uv-0.5)*vec2(mix(1.5,1.05,asp),1.0);',
'  float vig = smoothstep(1.28,0.30,length(vv)*1.6);',
'  col *= mix(0.55,1.0,vig);',
'  col = pow(max(col,vec3(0.0)), vec3(0.94));',
'  gl_FragColor = vec4(col,1.0);',
'}'
].join('\n');

/* ---- 体积光柱 ---- */
var SHAFT_VERT = [
'varying vec2 vUv; varying float vWY;',
'void main(){ vUv = uv; vec4 wp = modelMatrix*vec4(position,1.0); vWY = wp.y;',
'  gl_Position = projectionMatrix*viewMatrix*wp; }'
].join('\n');

var SHAFT_FRAG = [
'precision highp float;',
'varying vec2 vUv; varying float vWY;',
'uniform float uTime, uSeed, uOpacity, uStill;',
GLSL_NOISE,
'void main(){',
'  float x = vUv.x, y = vUv.y;',
'  float edge = smoothstep(0.0,0.50,x)*smoothstep(1.0,0.50,x);',
'  edge = pow(edge,2.4);',
'  float depthFade = smoothstep(-23.0, 19.0, vWY);',
'  float wob = sin(y*5.0 + uTime*1.3 + uSeed*7.0)*0.5+0.5;',
'  float wob2 = sin(x*9.0 - uTime*0.9 + uSeed*3.0)*0.5+0.5;',
'  float flick = mix(0.55,1.0,wob*0.6+wob2*0.4);',
'  float band = smoothstep(0.25,1.0, fbm2(vec2(x*4.0+uSeed*10.0, y*2.0 - uTime*0.12*(1.0-uStill*0.8))));',
'  float a = edge * pow(y,1.25) * depthFade * flick * mix(0.55,1.0,band) * uOpacity * (1.0-smoothstep(0.92,1.0,y)*0.45);',
'  vec3 col = mix(vec3(0.5,0.84,0.96), vec3(1.0,0.94,0.80), y*0.75);',
'  gl_FragColor = vec4(col, a*0.62);',
'}'
].join('\n');

/* ---- 温度跃层折射带 ---- */
var TEMP_VERT = [
'varying vec2 vUv;',
'void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
].join('\n');
var TEMP_FRAG = [
'precision highp float;',
'varying vec2 vUv;',
'uniform float uTime, uStill;',
GLSL_NOISE,
'void main(){',
'  float y = vUv.y;',
'  float n = fbm2(vec2(vUv.x*6.0 + uTime*0.05, y*10.0 - uTime*0.10*(1.0-uStill*0.8)));',
'  float n2 = fbm2(vec2(vUv.x*14.0 - uTime*0.09, y*22.0));',
'  float band = smoothstep(0.35,0.95,n*0.7+n2*0.5);',
'  float vf = sin(y*3.14159);',

/* ---- 生物：鳐类身体 ---- */
/* ---------- 几何工具 ---------- */
function hash2(a, b){
  var h = Math.sin(a*127.1 + b*311.7) * 43758.5453;
  return h - Math.floor(h);
}
var GEO_CACHE = {};
function cacheGeo(key, fn){
  if (!GEO_CACHE[key]){
    GEO_CACHE[key] = fn();
    GEO_CACHE[key].userData.cached = true;
  }
  return GEO_CACHE[key];
}

/* 释放未被缓存复用的几何 / 材质（换模型时避免显存泄漏） */
function disposeNode(o){
  if (!o) return;
  o.traverse(function(n){
    if (n.geometry && !(n.geometry.userData && n.geometry.userData.cached)) n.geometry.dispose();
    if (n.material) n.material.dispose();
  });
}

/* ---------- 鳐类平滑网格（封闭曲面） ---------- */
function buildRaySmooth(spec){
  var HW = spec.span*0.5, HL = spec.len*0.5;
  var P = spec.prof;
  function halfW(v){
    if (v >= P[0][0]) return P[0][1];
    for (var i=0;i<P.length-1;i++){
      if (v <= P[i][0] && v >= P[i+1][0]){
        var t = (v - P[i][0]) / (P[i+1][0] - P[i][0]);
        return P[i][1] + (P[i+1][1] - P[i][1]) * t;
      }
    }
    return P[P.length-1][1];
  }

  var pos=[], au=[], av=[], aty=[], asd=[], idx=[];
  var nV = 0;

  /* 主体：球体拓扑压扁成鳐盘（封闭曲面，背腹由法线自然区分） */
  var sph = new THREE.SphereGeometry(1, 34, 22);
  var sp = sph.attributes.position.array;
  for (var i=0;i<sp.length;i+=3){
    var px = sp[i], py = sp[i+1], pz = sp[i+2];
    var v = pz;
    var r = Math.sqrt(Math.max(1e-6, 1 - v*v));
    var u = px / r;
    var nz = py / r;
    var uu = Math.min(1, Math.abs(u));
    var vv = v*1.05;
    var hw = Math.max(0.02, halfW(vv));
    var thick = 0.150 * (1 - 0.68*uu*uu) * (1 - 0.28*Math.max(0, vv));
    /* 翼尖轻微上反（海鳐真实形态），侧视时也不会变成一条薄片 */
    var dihed = 0.18*uu*uu*HW;
    var Z = nz * thick * Math.sqrt(Math.max(0, 1 - uu*uu*0.952)) + dihed;
    pos.push(u * hw * HW, vv * HL, Z);
    au.push(uu); av.push(vv); aty.push(0); asd.push(nz > 0 ? 0 : 1);
  }
  var si = sph.index.array;
  for (i=0;i<si.length;i++) idx.push(si[i]);
  nV = sp.length/3;
  sph.dispose();

  /* 附加片：头鳍 / 尾 */
  function addSheet(wseg, hseg, mapper, ty){
    var pg = new THREE.PlaneGeometry(1, 1, wseg, hseg);
    var arr = pg.attributes.position.array;
    var b0 = nV;
    for (var k=0;k<arr.length;k+=3){
      var m = mapper(arr[k] + 0.5, arr[k+1] + 0.5);
      pos.push(m[0], m[1], m[2]);
      au.push(m[3]); av.push(m[4]); aty.push(ty); asd.push(0);
    }
    var ia = pg.index.array;
    for (var q=0;q<ia.length;q++) idx.push(b0 + ia[q]);
    nV += arr.length/3;
    pg.dispose();
  }

  if (spec.pattern === 0 || spec.pattern === 1){
    var hw0 = halfW(1.0);
    for (var sg=-1; sg<=1; sg+=2){
      (function(sgn){
        addSheet(4, 3, function(fx, fy){
          return [
            sgn*(hw0*HW*(0.26 + fx*0.50)),
            (0.92 + fy*0.38)*HL,
            0.06 - fx*0.04,
            0.42 + fx*0.30,
            1.0 + fy*0.22
          ];
        }, 1);
      })(sg);
    }
  }

  var tailLen = spec.pattern === 1 ? 4.6 : (spec.pattern === 2 ? 2.3 : 1.6);
  var tailW = spec.pattern === 1 ? 1.0 : 0.85;
  addSheet(2, 22, function(fx, fy){
    var wdt = (0.125 - 0.098*fy) * tailW;
    return [ (fx-0.5)*2*wdt, -HL - fy*tailLen, 0, fx, -1 - fy ];
  }, 2);

  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aU', new THREE.Float32BufferAttribute(au,1));
  g.setAttribute('aV', new THREE.Float32BufferAttribute(av,1));
  g.setAttribute('aTy', new THREE.Float32BufferAttribute(aty,1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(asd,1));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ---------- 水母平滑网格 ---------- */
function buildJellySmooth(spec){
  var R = spec.bell, H = spec.bell*(spec.pattern === 3 ? 0.84 : 1.14);
  var pos=[], au=[], av=[], aty=[], asd=[], idx=[];
  var nV = 0;
  var NA = 40, NV = 14;
  var thetaMax = 1.96;
  /* 伞体 */
  for (var i=0;i<=NV;i++){
    var tv = i/NV;
    var th = tv*thetaMax;
    var r = Math.sin(th)*R;
    var y = Math.cos(th)*H;
    if (tv > 0.86){
      var k = (tv-0.86)/0.14;
      r *= 1.0 - k*0.12;
      y -= k*H*0.12;
    }
    for (var j=0;j<=NA;j++){
      var a = (j/NA)*TAU;
      pos.push(Math.cos(a)*r, y, Math.sin(a)*r);
      au.push(j/NA); av.push(tv); aty.push(0); asd.push(0);
    }
  }
  for (i=0;i<NV;i++){
    for (j=0;j<NA;j++){
      var a0 = i*(NA+1) + j;
      idx.push(a0, a0+(NA+1), a0+1, a0+1, a0+(NA+1), a0+(NA+1)+1);
    }
  }
  nV += (NV+1)*(NA+1);

  /* 触手：每条两片交叉窄带 */
  var tCount = spec.pattern === 3 ? 16 : 12;
  var tLen = spec.pattern === 3 ? H*1.55 : H*2.05;
  var ry = Math.cos(thetaMax)*H;
  var rr = Math.sin(thetaMax)*R;
  for (var t=0;t<tCount;t++){
    var ta = (t/tCount)*TAU + hash2(t*1.7, 3.1)*0.20;
    var cx = Math.cos(ta)*rr, cz = Math.sin(ta)*rr;
    var wid = spec.pattern === 3 ? 0.050*R : 0.036*R;
    for (var cr=0; cr<2; cr++){
      var dx = cr===0 ? -Math.sin(ta) : Math.cos(ta);
      var dz = cr===0 ?  Math.cos(ta) : Math.sin(ta);
      var base2 = nV, SEGS = 12;
      for (var q=0;q<=SEGS;q++){
        var qq = q/SEGS;
        var ww = wid*(1 - qq*0.62);
        var yy = ry - qq*tLen;
        pos.push(cx-dx*ww, yy, cz-dz*ww); au.push(t/tCount); av.push(qq); aty.push(1); asd.push(0);
        pos.push(cx+dx*ww, yy, cz+dz*ww); au.push(t/tCount); av.push(qq); aty.push(1); asd.push(0);
      }
      for (q=0;q<SEGS;q++){
        var a2 = base2 + q*2;
        idx.push(a2, a2+1, a2+2, a2+1, a2+3, a2+2);
      }
      nV += (SEGS+1)*2;
    }
  }

  /* 口腕（海刺） */
  if (spec.pattern !== 3){
    for (var ar=0; ar<5; ar++){
      var aa = (ar/5)*TAU + 0.4;
      var base3 = nV, SEG = 10;
      for (var q2=0;q2<=SEG;q2++){
        var qq2 = q2/SEG;
        var rr2 = R*(0.20 + qq2*0.30);
        var ww2 = R*0.115*(1 - qq2*0.30);
        var yy2 = -H*0.06 - qq2*H*1.15;
        var cxx = Math.cos(aa)*rr2, czz = Math.sin(aa)*rr2;
        var dx2 = -Math.sin(aa), dz2 = Math.cos(aa);
        pos.push(cxx-dx2*ww2, yy2, czz-dz2*ww2); au.push(ar/5); av.push(qq2); aty.push(2); asd.push(0);
        pos.push(cxx+dx2*ww2, yy2, czz+dz2*ww2); au.push(ar/5); av.push(qq2); aty.push(2); asd.push(0);
      }
      for (var q3=0;q3<SEG;q3++){
        var a3 = base3 + q3*2;
        idx.push(a3, a3+1, a3+2, a3+1, a3+3, a3+2);
      }
      nV += (SEG+1)*2;
    }
  }

  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aU', new THREE.Float32BufferAttribute(au,1));
  g.setAttribute('aV', new THREE.Float32BufferAttribute(av,1));
  g.setAttribute('aTy', new THREE.Float32BufferAttribute(aty,1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(asd,1));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ---------- 鱼类平滑网格（躯干环带 + 鳍片） ---------- */
function buildFishSmooth(spec){
  var L = spec.len, P = spec.body, F = spec.fins || {};
  var pos=[], au=[], av=[], aty=[], asd=[], idx=[];
  var nV = 0, i, j;

  function profAt(t){
    t = clamp(t, 0, 1);
    for (var q=0;q<P.length-1;q++){
      if (t >= P[q][0] && t <= P[q+1][0]){
        var k = (t - P[q][0]) / Math.max(1e-6, P[q+1][0]-P[q][0]);
        return [ lerp(P[q][1],P[q+1][1],k), lerp(P[q][2],P[q+1][2],k), lerp(P[q][3],P[q+1][3],k) ];
      }
    }
    var e = P[P.length-1];
    return [e[1], e[2], e[3]];
  }
  function zAt(t){ return -L*0.5 + t*L*0.90; }

  /* 躯干：沿体轴的环带（吻端略呈尖点，尾柄收细） */
  var NS = 30, NR = 16;
  for (i=0;i<=NS;i++){
    var t = i/NS, pr = profAt(t);
    var hh = pr[0]*L, hw = pr[1]*L, cy = pr[2]*L, z = zAt(t);
    for (j=0;j<=NR;j++){
      var a = (j/NR)*TAU;
      pos.push(Math.sin(a)*hw, cy + Math.cos(a)*hh, z);
      au.push(j/NR); av.push(t); aty.push(0); asd.push(0);
    }
  }
  for (i=0;i<NS;i++){
    for (j=0;j<NR;j++){
      var b0 = i*(NR+1)+j, b1 = b0+(NR+1);
      idx.push(b0, b1, b0+1, b0+1, b1, b1+1);
    }
  }
  nV += (NS+1)*(NR+1);

  function addPatch(nu, nv, fn, ty, sd){
    var base = nV, ii, jj;
    for (ii=0;ii<=nu;ii++){
      for (jj=0;jj<=nv;jj++){
        var m = fn(ii/nu, jj/nv);
        pos.push(m[0], m[1], m[2]);
        au.push(m[3]); av.push(m[4]); aty.push(ty); asd.push(sd || 0);
      }
    }
    for (ii=0;ii<nu;ii++){
      for (jj=0;jj<nv;jj++){
        var a0 = base + ii*(nv+1) + jj, a1 = a0 + (nv+1);
        idx.push(a0, a1, a0+1, a0+1, a1, a1+1);
      }
    }
    nV += (nu+1)*(nv+1);
  }

  /* 尾鳍：鲨类为竖立的叉形尾，海豚为水平尾叶 */
  var cd = F.caudal;
  if (cd){
    var zr = zAt(1.0) - L*0.004;
    var dep = (cd.depth||0.13)*L, nt = cd.notch==null ? 0.55 : cd.notch;
    if (cd.kind === 'h'){
      var spd2 = (cd.spread||0.20)*L;
      addPatch(7, 8, function(s, q){
        var fx2 = q*2-1;
        var lobe = Math.pow(Math.abs(fx2), 0.75);
        var zTrail = zr + dep*(0.28 + 0.72*(1 - nt*(1-lobe)));
        var zz = lerp(zr + dep*0.05, zTrail, s);
        var yy = profAt(1)[2]*L + Math.abs(fx2)*L*0.012 + s*L*0.004;
        return [ fx2*spd2, yy, zz, s, 1.0 + s*0.16 ];
      }, 1);
    } else {
      var upE = (cd.up||0.20)*L, dnE = (cd.dn||0.14)*L;
      addPatch(7, 8, function(s, q){
        var lobe = Math.pow(Math.abs(q-0.5)/0.5, 0.72);
        var zTrail = zr + dep*(0.22 + 0.78*(1 - nt*(1-lobe)));
        var zz = lerp(zr + dep*0.04, zTrail, s);
        var yy = -dnE*(0.30+0.70*s) + (upE*(0.30+0.70*s) + dnE*(0.30+0.70*s))*q;
        return [ 0, yy, zz, s, 1.0 + s*0.17 ];
      }, 1);
    }
  }

  /* 背鳍 / 臀鳍：竖立薄片，tip 后掠 */
  function addFinV(f, sign){
    if (!f) return;
    var hmax = (f.h||0.1)*L, pk = f.peak==null ? 0.35 : f.peak, sw = (f.sweep||0)*L;
    addPatch(4, 8, function(s, q){
      var t = lerp(f.t0, f.t1, q);
      var pr = profAt(t);
      var baseY = pr[2]*L + sign*pr[0]*L*0.90;
      var hp = q < pk ? Math.pow(q/pk, 0.72) : Math.pow((1-q)/(1-pk), 1.30);
      var hh = hmax * Math.max(0, hp);
      return [ 0, baseY + sign*hh*s, zAt(t) + sw*s, s, t ];
    }, 2);
  }
  addFinV(F.dorsal, 1);
  addFinV(F.dorsal2, 1);
  addFinV(F.anal, -1);

  /* 胸鳍：两侧外展 */
  var pc = F.pec;
  if (pc){
    for (var sg=-1; sg<=1; sg+=2){
      (function(sgn){
        addPatch(3, 4, function(s, q){
          var t = pc.t + q*0.05;
          var pr = profAt(t);
          var xx = sgn*(pr[1]*L*0.78 + s*(pc.len||0.14)*L*(0.60 + 0.40*Math.sin(q*Math.PI)));
          var yy = pr[2]*L - s*(pc.drop||0.04)*L - q*0.012*L;
          var zz = zAt(t) + s*(pc.sweep||0.08)*L + q*L*0.055;
          return [ xx, yy, zz, s, pc.t ];
        }, 3, sgn);
      })(sg);
    }
  }

  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aU', new THREE.Float32BufferAttribute(au,1));
  g.setAttribute('aV', new THREE.Float32BufferAttribute(av,1));
  g.setAttribute('aTy', new THREE.Float32BufferAttribute(aty,1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(asd,1));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ---------- 海马：整条鱼里唯一「站着」的 ---------- */
function buildSeahorseSmooth(spec){
  var H = spec.len;
  /* 沿背脊的一串控制点：y 高度、z 前后（负 = 前方）、r 半径，全部按体高归一。
     从吻端一路排到卷起来的尾尖 —— 海马的尾巴没有鳍，是一根会抓东西的「手」。 */
  var SP = [
    [0.780,-0.300,0.014], [0.800,-0.255,0.020], [0.822,-0.208,0.026],
    [0.856,-0.160,0.042], [0.892,-0.112,0.062], [0.926,-0.062,0.074],
    [0.952,-0.012,0.072], [0.948, 0.040,0.060], [0.910, 0.076,0.044],
    [0.856, 0.092,0.034], [0.790, 0.092,0.038], [0.706, 0.086,0.048],
    [0.612, 0.076,0.055], [0.508, 0.064,0.058], [0.400, 0.052,0.056],
    [0.296, 0.040,0.048], [0.200, 0.026,0.036], [0.116, 0.006,0.026],
    [0.052,-0.026,0.019], [0.008,-0.072,0.015], [-0.014,-0.124,0.012],
    [0.020,-0.168,0.010], [0.078,-0.184,0.009], [0.128,-0.158,0.008],
    [0.144,-0.114,0.007]
  ];
  var pos=[], au=[], av=[], aty=[], asd=[], idx=[], nV = 0;
  var N = SP.length, NR = 14, i, j;

  for (i=0;i<N;i++){
    var p0 = SP[Math.max(0,i-1)], p1 = SP[Math.min(N-1,i+1)];
    var tyv = p1[0]-p0[0], tzv = p1[1]-p0[1];
    var tl = Math.sqrt(tyv*tyv + tzv*tzv) || 1; tyv/=tl; tzv/=tl;
    var nyv = -tzv, nzv = tyv;                 /* 截面内的法线 */
    var y0 = SP[i][0]*H, z0 = SP[i][1]*H, r0 = SP[i][2]*H;
    for (j=0;j<=NR;j++){
      var a = (j/NR)*TAU, ca = Math.cos(a), sa = Math.sin(a);
      var ip = ca*r0*1.04;                     /* 前后方向略胖，左右很扁 —— 海马是侧扁的 */
      pos.push(sa*r0*0.58, y0 + nyv*ip, z0 + nzv*ip);
      au.push(j/NR); av.push(i/(N-1)); aty.push(0); asd.push(0);
    }
  }
  for (i=0;i<N-1;i++){
    for (j=0;j<NR;j++){
      var b0 = i*(NR+1)+j, b1 = b0+(NR+1);
      idx.push(b0, b1, b0+1, b0+1, b1, b1+1);
    }
  }
  nV += N*(NR+1);

  function patch(nu, nv, fn, ty, sd){
    var base = nV, ii, jj;
    for (ii=0;ii<=nu;ii++){
      for (jj=0;jj<=nv;jj++){
        var m = fn(ii/nu, jj/nv);
        pos.push(m[0], m[1], m[2]);
        au.push(m[3]); av.push(m[4]); aty.push(ty); asd.push(sd || 0);
      }
    }
    for (ii=0;ii<nu;ii++){
      for (jj=0;jj<nv;jj++){
        var a0 = base + ii*(nv+1) + jj, a1 = a0 + (nv+1);
        idx.push(a0, a1, a0+1, a0+1, a1, a1+1);
      }
    }
    nV += (nu+1)*(nv+1);
  }

  /* 背鳍：背上一小片一直抖的扇子（海马前进主要靠它） */
  patch(3, 6, function(s, q){
    var yy = (0.360 + q*0.280)*H;
    var zz = (0.104 + s*0.098*Math.sin((0.10 + q*0.88)*Math.PI))*H;
    return [ 0, yy, zz, s, q ];
  }, 2, 0);
  /* 头顶的冠：小小一片，像戴了顶王冠 */
  patch(2, 4, function(s, q){
    var yy = (0.952 + s*0.060*Math.sin((0.10 + q*0.86)*Math.PI))*H;
    var zz = (-0.070 + q*0.090)*H;
    return [ 0, yy, zz, s, q ];
  }, 2, 0);
  /* 胸鳍：脖子后面一对小耳朵 */
  for (var sg=-1; sg<=1; sg+=2){
    (function(sgn){
      patch(2, 4, function(s, q){
        return [ sgn*(0.024 + s*0.056)*H,
                 (0.735 + q*0.090)*H,
                 (-0.030 + q*0.048 - s*0.032)*H,
                 s, q ];
      }, 3, sgn);
    })(sg);
  }

  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aU', new THREE.Float32BufferAttribute(au,1));
  g.setAttribute('aV', new THREE.Float32BufferAttribute(av,1));
  g.setAttribute('aTy', new THREE.Float32BufferAttribute(aty,1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(asd,1));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ---------- 珊瑚 / 海藻：固着在礁石上的两种「植物」 ----------
   珊瑚是分枝的管状骨骼，海藻是一丛会随水摆的叶片。
   两者的高度都按 0–1 写，再乘 spec.hgt，和鱼的 L 一个道理。 */
function buildPlantSmooth(spec){
  var H = spec.hgt || 1;
  var pos=[], au=[], av=[], aty=[], asd=[], idx=[], nV = 0;
  var NR = 8, i, j;

  function tube(pts, rads, ty){
    var base = nV, M = pts.length, k, m;
    for (k=0;k<M;k++){
      var p0 = pts[Math.max(0,k-1)], p1 = pts[Math.min(M-1,k+1)];
      var tx = p1[0]-p0[0], tyv = p1[1]-p0[1], tz = p1[2]-p0[2];
      var tl = Math.sqrt(tx*tx+tyv*tyv+tz*tz) || 1; tx/=tl; tyv/=tl; tz/=tl;
      var ux = 0, uy = 1, uz = 0;
      if (Math.abs(tyv) > 0.90){ ux = 1; uy = 0; }
      var bx = uy*tz - uz*tyv, by = uz*tx - ux*tz, bz = ux*tyv - uy*tx;
      var bl = Math.sqrt(bx*bx+by*by+bz*bz) || 1; bx/=bl; by/=bl; bz/=bl;
      var cx = tyv*bz - tz*by, cy = tz*bx - tx*bz, cz = tx*by - tyv*bx;
      for (m=0;m<=NR;m++){
        var a = (m/NR)*TAU;
        var c1 = Math.cos(a)*rads[k], s1 = Math.sin(a)*rads[k];
        pos.push(pts[k][0] + bx*c1 + cx*s1,
                 pts[k][1] + by*c1 + cy*s1,
                 pts[k][2] + bz*c1 + cz*s1);
        au.push(m/NR); av.push(k/(M-1)); aty.push(ty); asd.push(0);
      }
    }
    for (k=0;k<M-1;k++){
      for (m=0;m<NR;m++){
        var a0 = base + k*(NR+1)+m, a1 = a0+(NR+1);
        idx.push(a0, a1, a0+1, a0+1, a1, a1+1);
      }
    }
    nV += M*(NR+1);
  }

  if (spec.plant === 'coral'){
    var grow = function(ox, oy, oz, dx, dy, dz, len, r0, r1, depth){
      var segs = 4, pts = [], rads = [], k;
      var px = ox, py = oy, pz = oz, dxx = dx, dyy = dy, dzz = dz;
      for (k=0;k<=segs;k++){
        pts.push([px, py, pz]);
        rads.push(lerp(r0, r1, Math.pow(k/segs, 0.72)));
        px += dxx*len/segs; py += dyy*len/segs; pz += dzz*len/segs;
        dxx += (Math.random()-0.5)*0.22;
        dzz += (Math.random()-0.5)*0.22;
        dyy = Math.min(1.0, dyy + 0.07);
        var dl = Math.sqrt(dxx*dxx + dyy*dyy + dzz*dzz) || 1;
        dxx/=dl; dyy/=dl; dzz/=dl;
      }
      tube(pts, rads, 0);
      if (depth <= 0) return;
      var nb = depth > 1 ? 4 : 3;
      for (var c=0;c<nb;c++){
        var ang = (c/nb)*TAU + Math.random()*1.5;
        var spread = 0.42 + Math.random()*0.42;
        var nx2 = dxx + Math.cos(ang)*spread;
        var nz2 = dzz + Math.sin(ang)*spread;
        var nl = Math.sqrt(nx2*nx2 + dyy*dyy + nz2*nz2) || 1;
        grow(px, py, pz, nx2/nl, dyy/nl, nz2/nl, len*0.68, r1, r1*0.50, depth-1);
      }
    };
    grow(0, 0, 0, 0, 1, 0, 0.42*H, 0.086*H, 0.055*H, 2);
  } else {
    /* 巨藻：一丛各自朝不同方向立起来的叶片 */
    var blades = 9;
    for (var b=0;b<blades;b++){
      var ang0 = (b/blades)*TAU + Math.random()*0.5;
      var lean = 0.05 + Math.random()*0.11;
      var bh = H*(0.62 + Math.random()*0.38);
      var NV2 = 15, NU2 = 2, base2 = nV, ii, jj;
      for (ii=0;ii<=NV2;ii++){
        var t = ii/NV2;
        var yy = t*bh;
        var cxx = Math.cos(ang0)*lean*t*bh + Math.sin(t*3.0 + b*1.7)*0.050*bh;
        var czz = Math.sin(ang0)*lean*t*bh + Math.cos(t*2.4 + b*1.1)*0.038*bh;
        /* 叶片两头收尖、中间最宽；末端必须真的收到 0，不然顶端是一刀切平的 */
        var wv = Math.max(0, Math.sin(Math.min(1, t*1.02)*Math.PI));
        var w = (0.003 + 0.019*Math.pow(wv, 0.55)) * bh;
        var twist = ang0 + Math.PI*0.5 + Math.sin(t*2.2 + b)*0.55;
        var sx = Math.cos(twist), sz = Math.sin(twist);
        for (jj=0;jj<=NU2;jj++){
          var s = jj/NU2 - 0.5;
          pos.push(cxx + sx*w*s, yy, czz + sz*w*s);
          au.push(jj/NU2); av.push(t); aty.push(1); asd.push(0);
        }
      }
      for (ii=0;ii<NV2;ii++){
        for (jj=0;jj<NU2;jj++){
          var a0 = base2 + ii*(NU2+1)+jj, a1 = a0+(NU2+1);
          idx.push(a0, a1, a0+1, a0+1, a1, a1+1);
        }
      }
      nV += (NV2+1)*(NU2+1);
    }
  }

  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('aU', new THREE.Float32BufferAttribute(au,1));
  g.setAttribute('aV', new THREE.Float32BufferAttribute(av,1));
  g.setAttribute('aTy', new THREE.Float32BufferAttribute(aty,1));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(asd,1));
  g.setIndex(idx);
  g.computeVertexNormals();
  g.computeBoundingSphere();
  return g;
}

/* ---------- 浅水的珊瑚礁台：一道长满珊瑚的礁顶剪影 ---------- */
var REEF_Y = 19.30;
function reefTopY(x){
  return REEF_Y
       + Math.sin(x*0.26 + 1.1)*0.42 + Math.sin(x*0.11 + 2.3)*0.24
       + Math.sin(x*0.63 + 0.7)*0.09
       + Math.sin(x*1.65 + 0.9)*0.10 + Math.sin(x*3.10 + 2.2)*0.045;
}
function buildReef(){
  var N = 150, half = 34, z = -11, ROWS = 5;
  var pos=[], col=[], idx=[];
  var cTop = new THREE.Color(0x43766d), cMid = new THREE.Color(0x22464b), cBot = new THREE.Color(0x1a4358);
  for (var i=0;i<=N;i++){
    var x = -half + (i/N)*half*2;
    var top = reefTopY(x);
    /* 礁石不是一块悬在水里的板：脚下这道斜坡一直往下接到暗处。
       底边刻意取水色，边缘才化在海里，不会看成一道生硬的剪影 */
    var bot = REEF_Y - 10.5
            - 2.2*Math.sin(x*0.091 + 1.3)
            - 1.0*Math.cos(x*0.33 + 0.4);
    /* 岩面上的明暗：隆起处受光，凹处积影 */
    var n1 = Math.sin(x*1.9+0.5)*0.5 + Math.sin(x*4.3+2.1)*0.32 + Math.sin(x*0.7+1.2)*0.5;
    for (var r=0;r<=ROWS;r++){
      var f = r/ROWS;
      var yy = lerp(top, bot, f*f*0.90 + f*0.10);
      var c = f < 0.42 ? cTop.clone().lerp(cMid, f/0.42) : cMid.clone().lerp(cBot, (f-0.42)/0.58);
      /* 礁顶受光最亮，往下越来越暗；再叠几条竖向的岩纹，免得礁壁糊成一块死黑 */
      var k = f < 0.34 ? (0.80 + 0.30*n1)
                       : Math.max(0.16, 0.94 - (f - 0.34)*1.20);
      k *= 1 - 0.11*Math.sin(x*5.2 + f*7.0) + 0.05*Math.sin(x*8.4 - f*3.1);
      pos.push(x, yy, z);
      col.push(c.r*k, c.g*k, c.b*k);
    }
  }
  for (i=0;i<N;i++){
    for (var r2=0;r2<ROWS;r2++){
      var a = i*(ROWS+1)+r2, b = a+(ROWS+1);
      idx.push(a, b, a+1,  a+1, b, b+1);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  var m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  m.frustumCulled = false;
  var grp = new THREE.Group();
  grp.add(m);
  return grp;
}


/* ---------- 平滑地形 / 烟囱 / 鲸落 ---------- */
/* 海底的几层山脊和鲸落骨架都是纯色顶点材质，没有雾可吃。
   潜航到深处时把它们整体压暗，否则海底会比鱼还亮。 */
var abyssMats = [];
function makeSmoothRidge(opts){
  var half = opts.half, base = opts.base, amp = opts.amp, seed = opts.seed;
  var N = 150, bottom = base - 16;
  var pos=[], col=[], idx=[];
  var cTop = new THREE.Color(opts.topC).multiplyScalar(0.62);
  var cMid = new THREE.Color(opts.c).multiplyScalar(0.80);
  var cBot = new THREE.Color(opts.c2).multiplyScalar(0.80);
  for (var i=0;i<=N;i++){
    var x = -half + (i/N)*half*2;
    var n = Math.sin(i*0.13+seed)*0.5 + Math.sin(i*0.41+seed*2.7)*0.28 + Math.sin(i*0.062+seed*1.3)*0.85;
    var ny = Math.sin(i*1.27+seed*3.1)*0.06;
    var top = base + n*amp + ny;
    pos.push(x, top, 0);              col.push(cTop.r, cTop.g, cTop.b);
    pos.push(x, (top+bottom)*0.55, 0); col.push(cMid.r, cMid.g, cMid.b);
    pos.push(x, bottom, 0);            col.push(cBot.r, cBot.g, cBot.b);
  }
  for (i=0;i<N;i++){
    var a = i*3, b = a+3;
    idx.push(a, b, a+1,  a+1, b, b+1);
    idx.push(a+1, b+1, a+2,  a+2, b+1, b+2);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  var _rm = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  abyssMats.push(_rm);
  var m = new THREE.Mesh(g, _rm);
  m.frustumCulled = false;
  var grp = new THREE.Group();
  grp.add(m);
  return grp;
}

function makeSmoothChimney(x, y, h, w, z){
  var grp = new THREE.Group();
  var geo = new THREE.CylinderGeometry(w*0.30, w*0.95, h, 10, 1, true);
  var m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color: 0x061420, side: THREE.DoubleSide, transparent: true, opacity: 0.96
  }));
  m.position.set(x, y + h*0.5, z);
  grp.add(m);
  var lip = new THREE.Mesh(new THREE.SphereGeometry(w*0.34, 12, 8), new THREE.MeshBasicMaterial({
    color: 0x2e7f9e, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  lip.position.set(x, y + h + w*0.12, z);
  lip.scale.y = 0.55;
  grp.add(lip);
  return grp;
}

function makeSmoothWhale(){
  var grp = new THREE.Group();
  var mat = new THREE.MeshBasicMaterial({ color: 0x1b4a60, transparent: true, opacity: 0.95 });
  abyssMats.push(mat);
  var pts = [];
  for (var i=0;i<=12;i++){
    var t = i/12;
    pts.push(new THREE.Vector3(-4.0 + t*7.6, Math.sin(t*3.0)*0.30, 0));
  }
  var curve = new THREE.CatmullRomCurve3(pts);
  var spine = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.13, 6, false), mat);
  grp.add(spine);
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 10), mat);
  head.position.set(-4.2, 0.05, 0);
  head.scale.set(1.25, 0.72, 0.9);
  grp.add(head);
  for (var r=0;r<8;r++){
    var rt = 0.16 + r*0.095;
    var p = curve.getPoint(clamp(rt, 0, 1));
    var rad = 0.80 + Math.sin(r*0.9)*0.24;
    for (var sg=-1; sg<=1; sg+=2){
      var rp = [];
      for (var k=0;k<=7;k++){
        var ang = (k/7)*Math.PI*0.58;
        rp.push(new THREE.Vector3(p.x, p.y - Math.cos(ang)*rad*0.85 + rad*0.85, sg*Math.sin(ang)*rad*0.82));
      }
      var rc = new THREE.CatmullRomCurve3(rp);
      var rib = new THREE.Mesh(new THREE.TubeGeometry(rc, 12, 0.055, 5, false), mat);
      grp.add(rib);
    }
  }
  grp.position.set(6.5, -20.4, -11);
  grp.rotation.z = 0.18;
  return grp;
}

function makeFishSmoothGeo(){
  var s = new THREE.Shape();
  s.moveTo(0, 0.52);
  s.bezierCurveTo(0.13, 0.30, 0.15, -0.06, 0.055, -0.30);
  s.lineTo(0.165, -0.66);
  s.lineTo(0.0, -0.44);
  s.lineTo(-0.165, -0.66);
  s.lineTo(-0.055, -0.30);
  s.bezierCurveTo(-0.15, -0.06, -0.13, 0.30, 0, 0.52);
  var g = new THREE.ShapeGeometry(s, 8);
  g.computeBoundingSphere();
  return g;
}

var RING_VERT = [
'varying vec2 vUv;',
'void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
].join('\n');
var RING_FRAG = [
'precision highp float;',
'varying vec2 vUv;',
'uniform float uAge, uDur;',
'void main(){',
'  vec2 d = vUv-0.5;',
'  float r = length(d)*2.0;',
'  float t = clamp(uAge/uDur,0.0,1.0);',
'  float ringR = t*0.92;',
'  float w = 0.055*(1.0-t*0.55);',
'  float a = smoothstep(w, 0.0, abs(r-ringR)) * pow(1.0-t, 1.5);',
'  a += smoothstep(1.0,0.5,r)*pow(1.0-t,3.0)*0.10;',
'  a *= smoothstep(1.02,0.97,r);',
'  if(a<0.004) discard;',
'  gl_FragColor = vec4(vec3(0.55,0.92,1.0), a*0.85);',
'}'
].join('\n');

/* ---- 旋涡 ---- */
var VORTEX_VERT = [
'varying vec2 vUv;',
'void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }'
].join('\n');
var VORTEX_FRAG = [
'precision highp float;',
'varying vec2 vUv;',
'uniform float uTime, uOn;',
'void main(){',
'  vec2 d = vUv-0.5;',
'  float r = length(d)*2.0;',
'  float ang = atan(d.y,d.x);',
'  float spiral = sin(ang*3.0 - r*9.0 + uTime*1.6)*0.5+0.5;',
'  float ring = smoothstep(1.0,0.86,r)*smoothstep(0.35,0.62,r);',
'  float a = (ring*0.55 + spiral*ring*0.55) * uOn * 0.55;',
'  a += exp(-pow((r-1.0)/0.045,2.0))*uOn*0.30;',
'  a *= smoothstep(1.02,0.97,r);',
'  if(a<0.004) discard;',
'  gl_FragColor = vec4(vec3(0.62,0.94,1.0), a);',
'}'
].join('\n');

function makeBurst(color, count, size, spread, rise, dur){
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count*3);
  var dir = new Float32Array(count*3);
  var rnd = new Float32Array(count);
  for (var i=0;i<count;i++){
    var u = Math.random()*TAU, v = Math.acos(rand(-1,1));
    var r = Math.pow(Math.random(),0.6);
    dir[i*3] = Math.sin(v)*Math.cos(u)*r;
    dir[i*3+1] = Math.cos(v)*r*0.7;
    dir[i*3+2] = Math.sin(v)*Math.sin(u)*r*0.35;
    rnd[i] = Math.random();
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aDir', new THREE.BufferAttribute(dir,3));
  geo.setAttribute('aRnd', new THREE.BufferAttribute(rnd,1));
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uOrigin: { value: new THREE.Vector3() },
      uAge: { value: 99 }, uDur: { value: dur },
      uSpread: { value: spread }, uRise: { value: rise },
      uSize: { value: size }, uDpr: U.uDpr,
      uColor: { value: new THREE.Color(color) }
    },
    vertexShader: BURST_VERT, fragmentShader: BURST_FRAG,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  });
  var p = new THREE.Points(geo, mat);
  p.frustumCulled = false;
  p.renderOrder = 8;
  p.userData = { age: 99, dur: dur };
  scene.add(p);
  return p;
}

};
var SPEC_BY_ID = {};
for (var si=0; si<SPECIES.length; si++) SPEC_BY_ID[SPECIES[si].id] = SPECIES[si];

/* ------------------------------------------------------------
   体型统一换算（展厅比例）
   真实尺寸（米）→ 场景尺寸（世界单位）
   d = K · m^0.62 —— 等比压缩：大动物之间比例基本保持，
   极小的水母 / 小魟不会被压成一两个像素，孩子仍看得清。
   注意：这是「展厅缩放」，真实比例见讲解卡与体型对照表。
   ------------------------------------------------------------ */
var SIZE_K = 1.78, SIZE_EXP = 0.62;
var HUMAN_H = 1.75;                       // 成人身高参考（米）
/* 小于这个尺寸的动物按真实比例画出来只有几个像素（蝰鱼 0.3 m、鮟鱇 0.18 m），
   展厅里会把它们放大到至少 MIN_DISP，并在讲解卡里注明放大倍数 */
var MIN_DISP = 1.55;
function exhibitSize(m){
  return SIZE_K * Math.pow(Math.max(0.05, m), SIZE_EXP);
}
(function applySizes(){
  for (var i=0;i<SPECIES.length;i++){
    var sp = SPECIES[i];
    var d = exhibitSize(sp.real.v), k;
    /* 有些小东西（斑马鱼）按最小可见尺寸放会跟珊瑚一样大，允许它再小一点 */
    var floor = sp.dispFloor || MIN_DISP;
    sp.gain = d < floor ? floor/d : 1;
    d = Math.max(d, floor);
    if (sp.kind === 'ray'){
      k = d/sp.span;  sp.span = d;  sp.len *= k;
      sp.flapAmp *= k;                 /* 扇动幅度按展幅缩放，否则大鱼翅膀只会颤一下 */
    } else if (sp.kind === 'fish'){
      k = d/sp.len;   sp.len = d;
    } else if (sp.kind === 'plant'){
      /* 珊瑚 / 海藻：hgt 是整株的高度，geometry 按 0–1 的高度写，直接乘上去。
         巨藻按真实比例会到 3.5 个单位高，从礁顶一立就捅出水面了，礁区里封顶 2.6 */
      if (sp.plant === 'kelp') d = Math.min(d, 2.6);
      k = d/(sp.hgt || 1);  sp.hgt = d;
    } else {
      k = (d*0.5)/sp.bell;  sp.bell = d*0.5;
    }
    sp.k = k;
    sp.disp = d;
  }
  /* 卡片列按栖息深度由浅到深排列，和左侧深度轴一一对应 */
  SPECIES.sort(function(a,b){ return a.depth - b.depth; });
})();
/* 用「几个大人」描述尺寸，给孩子一个直观参照 */
function humanCompare(m){
  var n = m/HUMAN_H;
  if (n < 0.45) return '还没一把伞大';
  if (n < 0.95) return '大约到大人肚子';
  if (n < 1.35) return '和大人差不多高';
  if (n < 2.2)  return '约 ' + n.toFixed(1) + ' 个大人首尾相接';
  return '约 ' + Math.round(n) + ' 个大人首尾相接';
}


/* 一点柔光贴图：鮟鱇的诱饵灯、深海的发光点都用它 */
var _glowTex = null;
function glowTexture(){
  if (_glowTex) return _glowTex;
  var cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  var g = cv.getContext('2d');
  var rg = g.createRadialGradient(32,32,0, 32,32,32);
  rg.addColorStop(0.00, 'rgba(214,250,255,1)');
  rg.addColorStop(0.18, 'rgba(150,232,255,0.62)');
  rg.addColorStop(0.46, 'rgba(80,190,255,0.20)');
  rg.addColorStop(1.00, 'rgba(40,130,220,0)');
  g.fillStyle = rg;
  g.fillRect(0,0,64,64);
  _glowTex = new THREE.CanvasTexture(cv);
  return _glowTex;
}

      uAmpExp: { value: sw.ampExp != null ? sw.ampExp : 1.90 },
      uVert: { value: sw.vert ? 1 : 0 },

      uFinWave: { value: (sw.finWave != null ? sw.finWave : 0.20) * (spec.len || 1) * 0.06 },

    depthWrite: (isRay || isFish || (isPlant && spec.plant === 'coral')),
    side: THREE.DoubleSide
  });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 3;
  group.add(mesh);
  group.userData.mats = [mat];
  group.userData.mesh = mesh;
  /* 会发光的钓竿（深海鮟鱇）：单独的不受光材质，杆 + 灯球 + 光晕 */
  if (spec.lure){
    var lu = spec.lure, LL = spec.len;
    var rodG = new THREE.Group();
    rodG.position.set(0, lu.y*LL, lu.z*LL);
    rodG.rotation.x = lu.lean;
    var rodGeo = cacheGeo(spec.id+'_lure_rod', function(){
      return new THREE.CylinderGeometry(0.010*LL, 0.017*LL, lu.len*LL, 5, 1, true);
    });
    var rodMat = new THREE.MeshBasicMaterial({ color:0x86dff4, transparent:true, opacity:0.50 });
    var rod = new THREE.Mesh(rodGeo, rodMat);
    rod.position.y = lu.len*LL*0.5;
    rodG.add(rod);
    var escaGeo = cacheGeo(spec.id+'_lure_esca', function(){
      return new THREE.SphereGeometry(lu.r*LL, 10, 8);
    });
    var escaMat = new THREE.MeshBasicMaterial({ color:0xd6f9ff, transparent:true, opacity:0.92 });
    var esca = new THREE.Mesh(escaGeo, escaMat);
    esca.position.y = lu.len*LL;
    rodG.add(esca);
    /* 光晕用面向镜头的 Sprite：不论鱼游到多远，灯都是一颗看得见的小灯 */
    var haloMat = new THREE.SpriteMaterial({
      map: glowTexture(), color: 0xbfefff, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false, fog: false
    });
    var halo = new THREE.Sprite(haloMat);
    halo.position.y = lu.len*LL;
    halo.scale.setScalar(Math.max(LL*1.55, 1.30));
    rodG.add(halo);
    group.add(rodG);
    group.userData.lure = halo;
    group.userData.lureBase = halo.scale.x;
    group.userData.mats.push(rodMat, escaMat, haloMat);
  }
  if (isRay) group.rotation.x = -Math.PI*0.5 + 0.72;
  return group;
}

/* ---------- 生物运行时 ---------- */
/* 各物种的巡游节奏（倍率）：1 ≈ 每秒半个身位左右 */
var TEMPO = {
  manta:1.0, eagle:1.05, bluespot:0.95,
  dolphin:1.10, shark:1.15, whaleshark:0.72,
  sailfish:1.85, angelfish:0.95, puffer:0.55, moray:1.15, tuna:1.85,
  oarfish:0.62, viperfish:0.95, angler:0.45, pelican:0.70,
  zebrafish:1.15, seahorse:0.30, coral:0, kelp:0
};
var creatures = [];

function spawnCreature(spec, depth, opts){
  opts = opts || {};
  if (creatures.length >= MAX_CREATURES) return null;
  var model = buildCreatureModel(spec, 1, false);
  /* 珊瑚海藻的高度由礁顶说了算：按水层夹一下就会被推离礁石，所以不夹 */
  var d = spec.kind === 'plant' ? depth : clamp(depth, spec.band[0], spec.band[1]);
  var startX = opts.x != null ? opts.x : rand(-8,8);
  var startZ = opts.z != null ? opts.z : rand(-7, 5);
  var startY = depthToY(d);
  var isRay = spec.kind === 'ray';
  var isFish = spec.kind === 'fish';
  var isPlant = spec.kind === 'plant';
  /* 游速按体长的 0.45 次方走（体型越大绝对值越快、但每秒身位越少），
     再乘一个物种节奏系数：金枪鱼 / 旗鱼快，河鲀 / 鲸鲨慢。 */
  var spd = isPlant ? 0
    : ((isRay || isFish)
      ? 1.12 * Math.pow(Math.max(0.5, isRay ? spec.span : spec.len), 0.45) * (TEMPO[spec.id] || 1)
      : rand(0.50, 0.80));
  spd *= rand(0.94, 1.06);
  var c = {
    spec: spec,
    group: model,
    mats: model.userData.mats,
    depth: d,
    depthT: d,
    x: startX, y: startY, z: startZ,
    pos: new THREE.Vector3(startX, startY, startZ),
    vel: new THREE.Vector3(rand(-1,1), rand(-0.2,0.2), rand(-1,1)).normalize().multiplyScalar(spd*0.5),
    speed: spd,
    /* 航道状态：方向（±1 表示主要往左还是往右游）、航向角、俯仰趋势 */
    dirX: Math.random() < 0.5 ? -1 : 1,
    head: 0, headV: 0, wrapCool: 0,
    hideT: 0, hideSide: 1, hideSwap: true,
    /* 半个体长：判断「整条鱼都出画了」时要把尾巴算进去 */
    halfL: spec.kind === 'ray' ? spec.span*0.5
         : (spec.kind === 'fish' ? spec.len*0.5
         : (spec.kind === 'plant' ? (spec.hgt||1)*0.5 : spec.bell*1.3)),
    wander: rand(0, 1.4),
    dash: 0, dashT: rand(5, 13),
    yaw: rand(-Math.PI, Math.PI),
    pitch: isRay ? (-Math.PI*0.5 + 0.72) : 0,
    roll: 0, yawR: 0,
    phase: rand(0,TAU),
    hovering: false, hoverT: rand(0.5, 3.0),
    /* 步态：滑翔程度 / 滑翔计时 / 当前摆尾频率与摆尾增益 */
    glide: 0, gliding: false, glideT: rand(0.6, 3.0),
    flapSpd: spec.flapSpeed || 1, beatNow: 1,
    t: 0,
    st: 0,
    enter: 0,
    enterDur: (opts.instant || isPlant) ? 0 : rand(1.9, 2.8),
    fromX: opts.fromX != null ? opts.fromX
         : (startX < 0 ? -1 : 1) * (viewHalfW(startZ) + 12),
    fromY: startY + rand(-7, 7),
    flare: 0,
    scare: 0
  };
  if (c.mats[0]) c.mats[0].uniforms.uPhase.value = c.phase;
  /* 珊瑚不是同一种颜色：每一株随机挑粉 / 紫 / 橙三套配色之一 */
  if (isPlant && spec.plant === 'coral' && c.mats[0]){
    var hv = Math.random();
    c.mats[0].uniforms.uPattern.value = hv < 0.40 ? 19.2 : (hv < 0.74 ? 19.6 : 19.9);
  }
  model.rotation.order = 'YXZ';
  model.position.set(c.fromX, c.fromY, startZ);
  var sc = opts.scale || 1;
  model.scale.setScalar(sc);
  if (isRay) model.rotation.x = -Math.PI*0.5 + 0.72;
  else if (!isPlant) model.rotation.z = rand(-0.08,0.08);
  else model.rotation.y = rand(-Math.PI, Math.PI);
  scene.add(model);
  creatures.push(c);
  if (!opts.silent){
    var p = new THREE.Vector3(c.x, c.y, 0);
    spawnRing(p, spec.kind === 'ray' ? spec.span*3.4
                 : (isFish ? spec.len*2.6 : (isPlant ? (spec.hgt||1)*3.0 : spec.bell*5.2)));
    var bb = bubblePool[bubRef.i % bubblePool.length]; bubRef.i++;
    bb.userData.age = 0;
    bb.material.uniforms.uOrigin.value.copy(p);
    bb.material.uniforms.uSpread.value = 1.9;
    bb.visible = true;
  }
  updateStatus();
  return c;
}

function removeCreature(c){
  var i = creatures.indexOf(c);
  if (i >= 0) creatures.splice(i,1);
  scene.remove(c.group);
  /* 几何是缓存的（多只共用），材质是每只新建的，只释放材质 */
  var ms = c.group.userData.mats;
  if (ms) for (var m=0;m<ms.length;m++) ms[m].dispose();
  updateStatus();
}

function creatureCounts(){
  var r = 0, j = 0, f = 0;
  for (var i=0;i<creatures.length;i++){
    var k = creatures[i].spec.kind;
    if (k === 'ray') r++; else if (k === 'fish') f++; else j++;
  }
  return { rays: r, jellies: j, fish: f, total: creatures.length };
}

/* ============================================================
   3.5 近景掠过：大鱼从远处游来，掠过头顶 / 穿过脚下
   ------------------------------------------------------------
   与普通巡游不同，这条鱼不走 AI，而是沿一条穿过观众身边的
   直线航道匀速通过：远处只是个小黑点 → 越来越近 → 从画面顶上
   或底部扫出画外。全程按真实体长 1:1 呈现，不做任何放大。
   ============================================================ */
var FLY_TEAM = ['whaleshark', 'whaleshark', 'shark', 'dolphin'];
var flyCool = 14;                  // 自动掠影倒计时（秒）

function flyActive(){
  for (var i=0;i<creatures.length;i++) if (creatures[i].fly) return creatures[i];
  return null;
}

/* id 省略则从 FLY_TEAM 里随机挑；opts.side: 1 头顶 / -1 脚下 */
function startFlyby(id, opts){
  opts = opts || {};
  if (flyActive()) return null;
  var sp = SPEC_BY_ID[id] || SPEC_BY_ID[FLY_TEAM[(Math.random()*FLY_TEAM.length)|0]];
  if (!sp || sp.kind !== 'fish') return null;

  /* 观众自己贴着水面时让鱼从脚下过，贴着深渊时从头顶过 */
  var cy = camera.position.y;
  var side = opts.side != null ? opts.side
           : (cy > 9 ? -1 : (cy < -9 ? 1 : (Math.random() < 0.58 ? 1 : -1)));

  var pod  = sp.id === 'dolphin' ? 3 : 1;
  var dur  = 9.2 + sp.len*1.15;          // 越大的鱼越从容
  var cp   = camera.position;
  var lead = null;

  for (var k=0;k<pod;k++){
    var c = spawnCreature(sp, sp.band[0], { instant:true, silent:true, x: cp.x, z: cp.z-120 });
    if (!c) break;
    c.enter = 1;
    c.speed = 150/dur;
    c.yaw = Math.PI;                      // 迎面而来（鱼头朝 +Z）
    c.pitch = 0;
    c.fly = {
      u: (opts.u != null ? opts.u : 0) - k*0.05,
      dur: dur, side: side,
      z0: -126, z1: 24,
      x0: -13 + k*4.6, x1: 2.6 + k*2.4,
      yBase: 1.5 + (pod > 1 ? (k-1)*1.0 : 0),
      yRise: 5.2, ph: k*2.1, crab: 0.62,
      oz0: cp.z,
      isLead: k === 0, tag: false, whale: false,
      prev: new THREE.Vector3(c.pos.x, c.pos.y, c.pos.z)
    };
    if (k === 0) lead = c;
  }
  flyCool = lead ? rand(42, 72) : 20;
  return lead;
}

function updateFlyMotion(c, dt){
  var f = c.fly;
  f.prev.copy(c.pos);
  f.u += dt/f.dur;
  var k  = clamp(f.u, 0, 1);
  var dz = lerp(f.z0, f.z1, k);
  var ox = lerp(f.x0, f.x1, k) + Math.sin(k*Math.PI*1.6 + f.ph)*0.85;
  /* 前段贴着视线游（整条鱼看得清），最后才抬升掠过头顶 / 下潜穿过脚下 */
  var rise = Math.pow(clamp((k-0.60)/0.40, 0, 1), 2.4);
  var oy = f.side * (f.yBase + f.yRise*rise + Math.sin(k*Math.PI*1.25 + f.ph)*0.35);
  f.rise = rise;
  /* 横竖都以「观众眼睛」为基准，相机缓慢漂移时构图不会跑掉；
     纵深仍以入镜那一刻为准，观众自己前后移动时鱼不会被拖着走 */
  c.pos.set(camera.position.x + ox, clamp(camera.position.y + oy, -20.4, 20.4), f.oz0 + dz);
  c.vel.set(c.pos.x - f.prev.x, c.pos.y - f.prev.y, c.pos.z - f.prev.z);
  if (dt > 0.00001) c.vel.multiplyScalar(1/dt);

  /* 远处溶进水里，靠近时渐渐清晰 */
  var dd = c.pos.distanceTo(camera.position);
  var op = 1 - 0.55*clamp((dd-62)/95, 0, 1);
  if (f.u > 0.90) op *= clamp((1-f.u)/0.10, 0, 1);
  if (c.mats[0]) c.mats[0].uniforms.uOpacity.value = op;

  if (f.isLead && !f.tag && f.u > 0.62){ f.tag = true; addTag(c, c.spec); }
  if (!f.whale && f.u > 0.74){ f.whale = true; if (state.soundOn) Sound.whale(); }
}

/* 隔一段时间自己来一次；用户手动点按钮会重置倒计时 */
function updateFlybyTimer(dt){
  if (flyCool > 0) flyCool -= dt;
  /* 潜航时不再自动放大鱼：那一层住的是深海的鱼，鲸鲨不该出现 */
  if (dive && dive.on){ flyCool = Math.max(flyCool, 9); return; }
  if (flyCool <= 0 && state.time > 12 && !flyActive() && !document.hidden) startFlyby();
}

/* ---------- 缩略图渲染器 ---------- */
var thumbCanvas = document.createElement('canvas');
thumbCanvas.width = 300; thumbCanvas.height = 228;
var tRenderer = new THREE.WebGLRenderer({ canvas: thumbCanvas, antialias: true, alpha: true });
tRenderer.setPixelRatio(1);
tRenderer.setSize(300, 228, false);
tRenderer.setClearColor(0x000000, 0);
var tScene = new THREE.Scene();
var tCam = new THREE.PerspectiveCamera(34, 300/228, 0.1, 200);
tCam.position.set(0, 0, 13);
var thumbModels = {};
function buildThumbs(){
  for (var k in thumbModels) if (thumbModels[k]) disposeNode(thumbModels[k]);
  thumbModels = {};
  for (var i=0;i<SPECIES.length;i++){
    var sp = SPECIES[i];
    var g = buildCreatureModel(sp, 0, true);
    var sc;
    if (sp.kind === 'ray'){
      sc = 10.0/(sp.span*2.0);
      g.position.y = -0.15;
    } else if (sp.kind === 'fish'){
      sc = 8.6/sp.len * (sp.lure ? 0.72 : 1);
      g.position.y = sp.lure ? -0.45 : 0;
    } else if (sp.kind === 'plant'){
      /* 珊瑚 / 海藻是从 y=0 往上长的，先缩到画框里，再整体下移一半把它居中 */
      sc = 7.2/(sp.hgt || 1);
      g.position.y = -(sp.hgt || 1)*sc*0.5;
    } else {
      sc = 5.4/(sp.bell*2.35);
      g.position.y = sp.bell*sc*0.85;
    }
    g.scale.setScalar(sc*(sp.thumbScale||1));
    g.userData.baseRot = sp.kind === 'ray' ? sp.tilt*0.55 : 0;
    g.rotation.x = sp.kind === 'ray' ? -0.35 : 0;
    thumbModels[sp.id] = g;
  }
}
buildThumbs();

var thumbIdx = 0, thumbFrame = 0;
function renderThumb(i){
  var sp = SPECIES[i];
  var g = thumbModels[sp.id];
  while (tScene.children.length) tScene.remove(tScene.children[0]);
  tScene.add(g);
  var t = state.time;
  if (sp.kind === 'fish'){
    /* 鱼体前方为局部 -Z：转成左前方 3/4 侧脸，能同时看到背鳍与尾叉 */
    g.rotation.y = Math.PI*0.60 + Math.sin(t*0.42 + i)*0.10;
    g.rotation.x = -0.16 + Math.sin(t*0.6 + i)*0.05;
    g.rotation.z = Math.sin(t*0.33 + i)*0.05;
    tRenderer.clear();
    tRenderer.render(tScene, tCam);
    var ctx2 = cardCanvases[i].getContext('2d');
    ctx2.clearRect(0,0,150,114);
    ctx2.drawImage(thumbCanvas, 0, 0, 150, 114);
    return;
  }
  g.rotation.y = Math.sin(t*0.5 + i)*(sp.kind === 'ray' ? 0.28 : 0.55);
  if (sp.kind === 'ray'){
    var baseX = -0.16;
    g.rotation.x = baseX + Math.sin(t*0.7+i)*0.08;
    g.rotation.z = Math.sin(t*0.4+i*1.7)*0.10;
  } else {
    g.rotation.z = Math.sin(t*0.35+i)*0.08;
  }
  tRenderer.clear();
  tRenderer.render(tScene, tCam);
  var ctx = cardCanvases[i].getContext('2d');
  ctx.clearRect(0,0,150,114);
  ctx.drawImage(thumbCanvas, 0, 0, 150, 114);
}
function renderThumbStep(){
  thumbFrame++;
  if (thumbFrame % 9) return;   // 帧计数节流（不依赖时钟）
  renderThumb(thumbIdx % SPECIES.length);
  thumbIdx++;
}
// 初始化时立即渲染全部缩略图（不等待节流）
for (var _ti=0;_ti<SPECIES.length;_ti++) renderThumb(_ti);

/* ---------- 拖动卡片 ---------- */
var drag = null;
function onCardDown(e, sp, el){
  e.preventDefault();
  drag = { spec: sp, el: el, x0: e.clientX, y0: e.clientY, moved: false, depth: sp.depth };
  if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch(err){} }
}
window.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && (dx*dx+dy*dy) > 49) drag.moved = true;
  if (drag.moved){
    var wp = worldFromPointer(e.clientX, e.clientY);
    var d = yToDepth(wp.y);
    drag.depth = clamp(d, drag.spec.band[0], drag.spec.band[1]);
    ghostEl.textContent = drag.spec.cn + ' · ' + Math.round(drag.depth) + ' m';
    ghostEl.style.left = e.clientX+'px';
    ghostEl.style.top = (e.clientY - 28)+'px';
    ghostEl.classList.add('on');
    droplineEl.style.top = e.clientY+'px';
    droplineEl.classList.add('on');
  }
});
window.addEventListener('pointerup', function(e){
  if (!drag) return;
  var st = drag; drag = null;
  ghostEl.classList.remove('on');
  droplineEl.classList.remove('on');
  var made;
  if (st.moved){
    made = spawnCreature(st.spec, st.depth, { x: rand(-7,7) });
    playBubble();
  } else if (dive.on && (dive.depth < st.spec.band[0] || dive.depth > st.spec.band[1])){
    /* 它不住在这一层：点一下就直接潜到它住的那一层去看 */
    diveTo(clamp(st.spec.depth, st.spec.band[0], st.spec.band[1]), { force:true });
    playBubble();
    showDocent(st.spec);
    st.el.classList.add('flash');
    setTimeout(function(){ st.el.classList.remove('flash'); }, 460);
    return;
  } else {
    made = spawnCreature(st.spec,
      dive.on ? dive.depth : st.spec.depth + rand(-20,20),
      { x: rand(-8,8) });
    playBubble();
  }

var _tagV = new THREE.Vector3();
function updateTags(dt){
  for (var i=tags.length-1;i>=0;i--){

      if (t.el.parentNode) t.el.parentNode.removeChild(t.el);

/* ---------- 画布交互 ---------- */
var raycasterPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
var tmpVec = new THREE.Vector3();
function worldFromPointer(cx, cy){
  var ndcX = (cx/window.innerWidth)*2-1;
  var ndcY = -(cy/window.innerHeight)*2+1;
  tmpVec.set(ndcX, ndcY, 0.5).unproject(camera);
  var dir = tmpVec.sub(camera.position).normalize();
  var t = -camera.position.z / dir.z;
  return camera.position.clone().add(dir.multiplyScalar(t));
}

var vortexDrag = false;
var camDrag = null;
var pointers = {}, pinch = null;

function twoFinger(){
  var ids = [], i, p;
  for (var k in pointers) if (pointers.hasOwnProperty(k)) ids.push(pointers[k]);
  if (ids.length < 2) return null;
  p = ids[0]; var q = ids[1];
  return {
    dist: Math.sqrt((p.x-q.x)*(p.x-q.x) + (p.y-q.y)*(p.y-q.y)),
    cx: (p.x+q.x)*0.5, cy: (p.y+q.y)*0.5
  };
}

canvas.addEventListener('pointerdown', function(e){
  pointers[e.pointerId] = { x:e.clientX, y:e.clientY };
  var count = 0; for (var k in pointers) if (pointers.hasOwnProperty(k)) count++;
  try { canvas.setPointerCapture(e.pointerId); } catch(err){}

  if (count >= 2){ camDrag = null; pinch = twoFinger(); return; }

  // 旋涡开启 / Shift / 右键：拖动旋涡；否则拖动视角
  if (state.vortexOn || e.shiftKey || e.button === 2){
    vortexDrag = true;
    var p = worldFromPointer(e.clientX, e.clientY);
    moveVortex(p.x, p.y);
    return;
  }
  camDrag = { id:e.pointerId, x0:e.clientX, y0:e.clientY, cx:cam.tx, cy:cam.ty, moved:false };
});

canvas.addEventListener('pointermove', function(e){
  var rec = pointers[e.pointerId];
  if (rec){ rec.x = e.clientX; rec.y = e.clientY; }

  if (vortexDrag){
    var p = worldFromPointer(e.clientX, e.clientY);
    moveVortex(p.x, p.y);
  } else if (pinch){
    var st = twoFinger();
    if (st){
      var w = pxToWorld();
      camDolly(-(st.dist - pinch.dist) * 0.16);
      camNudge((st.cx - pinch.cx) * w, (st.cy - pinch.cy) * w);
      pinch = st;
    }
  } else if (camDrag && e.pointerId === camDrag.id){
    var dx = e.clientX - camDrag.x0, dy = e.clientY - camDrag.y0;
    if (!camDrag.moved && dx*dx + dy*dy > 28) camDrag.moved = true;
    if (camDrag.moved){
      var w2 = pxToWorld();
      cam.tx = camDrag.cx - dx*w2;
      cam.ty = camDrag.cy + dy*w2;
      camClamp();
      cam.held = true; cam.holdT = state.time;
    }
  }
  var dp = worldFromPointer(e.clientX, e.clientY);
  var d = yToDepth(dp.y);
  var ds = d < 10 ? d.toFixed(0) : Math.round(d/10)*10;
  /* 3 米一层楼，给孩子一个生活参照 */
  depthEl.innerHTML = '深度 ' + ds + ' m' +
    (d >= 9 ? '<em>约 ' + Math.round(d/3) + ' 层楼</em>' : '');
});

function endPointer(e){
  delete pointers[e.pointerId];
  var count = 0; for (var k in pointers) if (pointers.hasOwnProperty(k)) count++;
  if (count < 2) pinch = null;
  if (camDrag && e.pointerId === camDrag.id){
    if (!camDrag.moved){
      var p = worldFromPointer(e.clientX, e.clientY);
      spawnBiolum(p.x, p.y);
      if (docentEl.classList.contains('on')) hideDocent();
    }
    camDrag = null;
  }
  vortexDrag = false;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', function(){ vortexDrag = false; pinch = null; });
