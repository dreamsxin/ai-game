   5. 声音
   ============================================================ */
var Sound = {
  ctx: null, master: null, on: false, ready: false, whaleTimer: 8, noiseBuf: null,
  init: function(){
    if (this.ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    this.ctx = ctx;
    var master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    this.master = master;

    var len = Math.floor(ctx.sampleRate*3);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i=0;i<len;i++) data[i] = (Math.random()*2-1)*0.7;
    this.noiseBuf = buf;

    var src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200; lp.Q.value = 0.8;
    var g1 = ctx.createGain(); g1.gain.value = 0.36;
    src.connect(lp); lp.connect(g1); g1.connect(master);
    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.065;
    var lfoG = ctx.createGain(); lfoG.gain.value = 95;
    lfo.connect(lfoG); lfoG.connect(lp.frequency);
    lfo.start(); src.start();

    var freqs = [43.5, 65.2, 87.1];
    for (var k=0;k<freqs.length;k++){
      var o = ctx.createOscillator();
      o.type = k===2 ? 'triangle' : 'sine';
      o.frequency.value = freqs[k];
      var og = ctx.createGain(); og.gain.value = 0.085/(k+1);
      var olp = ctx.createBiquadFilter(); olp.type='lowpass'; olp.frequency.value = 300;
      o.connect(olp); olp.connect(og); og.connect(master);
      o.start();
    }
    this.ready = true;
  },
  setOn: function(v){
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.on = v;
    var t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.linearRampToValueAtTime(v ? 0.85 : 0.0, t + (v?0.9:0.5));
  },
  whale: function(){
    if (!this.ready || !this.on) return;
    var ctx = this.ctx, t = ctx.currentTime;
    var o = ctx.createOscillator(); o.type = 'sine';
    var base = rand(120, 165);
    o.frequency.setValueAtTime(base, t);
    o.frequency.exponentialRampToValueAtTime(base*0.44, t+2.4);
    var vib = ctx.createOscillator(); vib.frequency.value = 4.2;
    var vibG = ctx.createGain(); vibG.gain.value = 7;
    vib.connect(vibG); vibG.connect(o.frequency);
    var o2 = ctx.createOscillator(); o2.type='sine';
    o2.frequency.setValueAtTime(base*1.5, t);
    o2.frequency.exponentialRampToValueAtTime(base*0.66, t+2.2);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.10, t+0.55);
    g.gain.exponentialRampToValueAtTime(0.0008, t+3.4);
    var lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 520; lp.Q.value = 1.2;
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(this.master);
    o.start(t); o2.start(t); vib.start(t);
    o.stop(t+3.6); o2.stop(t+3.6); vib.stop(t+3.6);
  }
};

function playBubble(vol){
  if (!Sound.ready || !Sound.on) return;
  var ctx = Sound.ctx, t = ctx.currentTime;
  var v = vol==null ? 1 : vol;
  var o = ctx.createOscillator(); o.type='sine';
  var f0 = rand(240, 520);
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0*3.1, t+0.055);
  o.frequency.exponentialRampToValueAtTime(f0*1.2, t+0.16);
  var g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.09*v, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.20);
  var bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=1.6;
  o.connect(bp); bp.connect(g); g.connect(Sound.master);
  o.start(t); o.stop(t+0.24);
}

   8. 主循环
   ============================================================ */
var clock = new THREE.Clock();
var dummy = new THREE.Object3D();

/* ---------- 生物游动（自主巡游 / 水族馆） ---------- */
var CR_Z_LO = -19, CR_Z_HI = 7;
var _tv = new THREE.Vector3(), _sep = new THREE.Vector3(), _dir = new THREE.Vector3();

/* 同一个 x 坐标，在近处 z 上是画内、在远处 z 上早就出画了；
   所以「出画」必须按每条鱼自己的深度算，不能用一个固定的墙。 */
function viewHalfW(z){
  var d = Math.max(6, camera.position.z - z);
  return Math.tan(FOV*0.5*Math.PI/180) * camera.aspect * d;
}
/* 整条鱼（含尾巴）是否已经完全游出画面 */
function outOfView(c){
  return Math.abs(c.pos.x - camera.position.x) > viewHalfW(c.pos.z) + 1.6 + c.halfL*1.1;
}
function angleLerp(a, b, t){
  var d = b - a;
  while (d >  Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return a + d*t;
}

/* 瞬时推进系数（长期均值≈1）。
   动物的推力不是均匀的：翅膀下压、伞体收缩、尾鳍甩到底的那一瞬间才有推力，
   其余时间靠惯性滑行。位置若按匀速平移，看起来就像被海流冲着走。 */
function gaitThrust(c, sp, dtc){
  if (sp.kind === 'ray'){
    if ((sp.rayWave || 0) > 0.5){
      /* 魟式：体盘波动连续推进，只有小幅起伏 */
      var pr = state.time*sp.flapSpeed + c.phase;
      return 0.78 + 0.48*(0.5 + 0.5*Math.sin(pr));
    }
    /* 蝠鲼式 / 鹰鳐：扇几下 → 平翅滑翔一段（滑翔别太长，否则看着像被水冲走） */
    c.glideT -= dtc;
    if (c.glideT <= 0){
      c.gliding = !c.gliding;
      c.glideT = c.gliding ? rand(1.1, 2.0) : rand(3.4, 6.5);
    }
    c.glide = lerp(c.glide, c.gliding ? 1 : 0, Math.min(1, dtc*1.9));
    var pg = state.time*sp.flapSpeed + c.phase;
    var dn = -Math.cos(pg);                    /* 下压行程 */
    var t2 = dn > 0 ? Math.pow(dn, 1.7) : 0;
    return (1 - c.glide)*(0.58 + 1.70*t2) + c.glide*0.94;
  }
  if (sp.kind === 'jelly'){
    /* 伞体收缩喷水，舒张时几乎不前进 */
    var pj = state.time*sp.rate + c.phase;
    var sj = Math.sin(pj);
    var th = sj < 0 ? (-sj)*(-sj)*(-sj) : 0;
    return 0.46 + 2.55*th;
  }
  /* 鱼：尾鳍每摆一下给一次推力，冲—滑节律 */
  var pf = state.time*(c.flapSpd || sp.flapSpeed || 1)*5.0 + c.phase;
  var surge = 0.5 + 0.5*Math.sin(pf - 1.1);
  var bt = c.beatNow != null ? c.beatNow : 1;
  return 0.70 + 0.56*bt*(0.24 + 0.76*surge);
}

function updateCreatures(dt){
  var st = 1 - 0.74*state.still;
  var dtc = Math.max(0.0001, dt*st);
  var n = creatures.length;
  var i, j, c, sp, isRay;
  var dead = null;

  for (i=n-1;i>=0;i--){
    c = creatures[i]; sp = c.spec; isRay = sp.kind === 'ray';
    var isFish2 = sp.kind === 'fish';
    var swm = sp.swim || null;
    c.t += dtc;
    /* 珊瑚 / 海藻：长在礁石上，不巡游也不出水，只有身体随水轻摇 */
    if (sp.kind === 'plant'){
      c.pos.set(c.x, c.y, c.z);
      c.depth = yToDepth(c.pos.y);
      c.group.position.copy(c.pos);
      c.group.rotation.y = c.yaw;
      continue;
    }
    /* 潜航时水层边界放宽一点：屏幕上才铺得开，不然每层只有半屏有人 */
    var bandPad = dive.on ? 2.6 : 0;
    var yLo = depthToY(sp.band[1]) + 1.0 - bandPad;
    var yHi = Math.min(depthToY(sp.band[0]) - 1.0 + bandPad, 20.4);

    if (c.fly){
      /* 近景掠过：走固定航道，不受巡游 / 边界 / 静海影响 */
      updateFlyMotion(c, dt);
    } else if (c.enter < 1){
      /* 入场：从水柱外弧线游入所属水层 */
      c.enter = Math.min(1, c.enter + dt/Math.max(0.001, c.enterDur));
      var e = easeOutCubic(c.enter);
      c.pos.set(
        lerp(c.fromX, c.x, e),
        lerp(c.fromY, c.y, e) - Math.sin(e*Math.PI)*2.6,
        lerp(c.pos.z, c.z, e)
      );
      if (c.enter >= 1){
        c.dirX = c.pos.x <= camera.position.x ? 1 : -1;
        c.head = (c.dirX >= 0 ? 0 : Math.PI) + rand(-0.35, 0.35);
        c.headV = rand(-0.12, 0.12);
        c.vel.set(Math.cos(c.head), c.headV, Math.sin(c.head)).normalize().multiplyScalar(c.speed);
        c.wander = rand(1.2, 3.0);
      }
    } else {
      /* 1. 航道：一条长直线，几秒到十几秒才换一次航向。
             换向时如果还在画面里，只做小角度修正（继续往前游）；
             只有整条鱼已经游到画面外，才允许掉头往回游。
             所以看到的是：鱼从一侧游进来 → 穿过整个画面 → 从另一侧出去。 */
      c.wander -= dtc;
      if (c.wander <= 0){
        c.wander = isRay ? rand(7.0, 13.0) : (isFish2 ? rand(5.5, 10.5) : rand(10, 17));
        /* 礁区住户有一个「家」：游出这个范围就掉头回来。
           没有这条，一群小鱼二十秒后全飘到画外，礁台上只剩珊瑚。 */
        var dxh = c.homeR > 0 ? c.pos.x - c.homeX : 0;
        if (c.homeR > 0 && Math.abs(dxh) > c.homeR){
          c.dirX = dxh > 0 ? -1 : 1;
          c.wander = Math.min(c.wander, 1.6);
        } else if (outOfView(c) && Math.random() < 0.62){
          c.dirX = -c.dirX;
        }
        c.head  = (c.dirX >= 0 ? 0 : Math.PI) + rand(-0.50, 0.50);
        c.headV = rand(-0.16, 0.16) * (isRay ? 1.5 : 1);
      }

      /* 1.5 礁区住户有一个「家」：一出家门就掉头。每帧都查，
             不然一趟航道要游十几秒，鱼早就飘到画外去了。 */
      if (c.homeR > 0){
        var dxh0 = c.pos.x - c.homeX;
        if (dxh0 > c.homeR && c.dirX > 0){ c.dirX = -1; c.wander = Math.min(c.wander, 0.12); }
        else if (dxh0 < -c.homeR && c.dirX < 0){ c.dirX = 1; c.wander = Math.min(c.wander, 0.12); }
      }

      /* 2. 冲刺 / 受惊 */
      if (isRay || isFish2){
        c.dashT -= dtc;
        if (c.dashT <= 0){ c.dashT = rand(6, 15); c.dash = rand(0.7, 1.7); }
      }
      var mul = c.speed;
      if (c.dash > 0){ c.dash -= dtc; mul *= 2.1; }
      if (c.scare > 0){ c.scare -= dtc; mul *= 2.3; }

      /* 2.5 悬停型（神仙鱼这类主要靠胸鳍划水的鱼）：停停走走，
             停住的时候只扇胸鳍，尾巴几乎不动 */
      if (swm && swm.hover && c.dash <= 0 && c.scare <= 0){
        c.hoverT -= dtc;
        if (c.hoverT <= 0){
          c.hovering = !c.hovering;
          c.hoverT = c.hovering ? rand(1.8, 3.8) : rand(2.0, 4.4);
        }
        if (c.hovering){
          mul *= 0.15;
          c.wander = Math.max(c.wander, 0.8);
        }
      } else if (c.hovering && (c.dash > 0 || c.scare > 0)){
        c.hovering = false;
        c.hoverT = rand(1.0, 2.0);
      }

      /* 3. 期望速度：沿航道笔直往前，叠一点缓慢起伏和蛇行，不至于像轨道车 */
      var hv = c.headV + Math.sin(c.t*0.42 + c.phase)*0.085;
      var mean = Math.sin(c.t*(0.34 + 0.10*Math.cos(c.phase)) + c.phase)*0.26;
      _tv.set(
        Math.cos(c.head) - Math.sin(c.head)*mean,
        hv,
        Math.sin(c.head) + Math.cos(c.head)*mean
      ).normalize().multiplyScalar(mul);

      /* 4. 同伴分离（避免叠在一起） */
      _sep.set(0,0,0);
      for (j=0;j<n;j++){
        if (j === i) continue;
        var o = creatures[j];
        if (o.enter < 1) continue;
        var dxx = c.pos.x-o.pos.x, dyy = c.pos.y-o.pos.y, dzz = c.pos.z-o.pos.z;
        var d2 = dxx*dxx + dyy*dyy + dzz*dzz;
        var R = isRay ? Math.max(3.6, sp.span*0.62)
              : (isFish2 ? Math.max(1.8, sp.len*0.90) : Math.max(2.2, sp.bell*2.6));
        if (d2 < R*R && d2 > 0.0004){
          var dd = Math.sqrt(d2);
          var w = (1 - dd/R) * mul;
          _sep.x += dxx/dd*w; _sep.y += dyy/dd*w; _sep.z += dzz/dd*w;
        }
      }
      /* 挤在一起的一群小鱼，分离力会叠成一团把整群炸开，
         反过来盖住航向——必须封顶，不然鱼只会越漂越远 */
      var sl = _sep.length();
      if (sl > mul*0.55) _sep.multiplyScalar(mul*0.55/sl);
      _tv.add(_sep.multiplyScalar(0.9));

      /* 5. 水层与纵深回避（水平方向不设墙，鱼可以游出画面） */
      if (c.pos.z >  CR_Z_HI-3.0) _tv.z -= ((c.pos.z-(CR_Z_HI-3.0))/3.0)*mul*1.5;
      if (c.pos.z <  CR_Z_LO+3.0) _tv.z += (((CR_Z_LO+3.0)-c.pos.z)/3.0)*mul*1.5;
      /* 礁区里还有一道「家的纵深」：别越游越靠后，最后躲到礁石后面去 */
      if (c.homeR > 0 && c.homeZ != null) _tv.z += (c.homeZ - c.pos.z)*0.55;
      if (c.homeR > 0 && c.homeY != null) _tv.y += (c.homeY - c.pos.y)*0.30;
      if (c.pos.y >  yHi-1.6) _tv.y -= ((c.pos.y-(yHi-1.6))/1.6)*mul*1.3;
      if (c.pos.y <  yLo+1.6) _tv.y += (((yLo+1.6)-c.pos.y)/1.6)*mul*1.3;

      /* 6. 旋涡牵引（切向绕流 + 轻微向心） */
      if (state.vortexOn){
        var vx = U.uVortex.value.x, vy = U.uVortex.value.y;
        var rx = c.pos.x-vx, ry = c.pos.y-vy;
        var dv = Math.sqrt(rx*rx+ry*ry) + 0.001;
        var infl = 1 - clamp(dv/(U.uVortexR.value*2.0), 0, 1);
        infl = infl*infl;
        _tv.x += (-ry/dv*1.05 - rx/dv*0.5) * mul * 1.7 * infl;
        _tv.y += ( rx/dv*1.05 - ry/dv*0.5) * mul * 1.7 * infl;
      }

      /* 7. 方向单独平滑（转弯有惯性），速度大小交给推进节奏。
             注意这里必须用一个「存下来的」方向：每帧都从当前速度重新起算的话，
             上一步转出来的角度会被这一步丢掉，鱼就永远只会照着最初的方向直着走。 */
      var turn = isRay ? 2.0 : (isFish2 ? 1.6 : 0.9);
      var kf = Math.min(1, dtc*turn);
      if (!c.sdir) c.sdir = c.vel.clone();
      if (c.sdir.lengthSq() < 1e-6) c.sdir.set(1, 0, 0);
      _dir.copy(c.sdir).normalize();
      _tv.normalize();
      /* 鳐类随翅膀的下压上浮一点，像真的在水里「飞」 */
      if (isRay){
        var pb = state.time*sp.flapSpeed + c.phase;
        _tv.y += Math.sin(pb - 1.2)*0.16;
        _tv.normalize();
      }
      _dir.lerp(_tv, kf);
      if (_dir.lengthSq() < 1e-6) _dir.copy(_tv);
      if (_dir.lengthSq() < 1e-6) _dir.set(1, 0, 0);
      _dir.normalize();
      c.sdir.copy(_dir);

      /* 8. 推进节奏：扇翼 / 喷水 / 摆尾的那一下才加速，其余时间滑行 */
      var gm = gaitThrust(c, sp, dtc);
      var vDes = mul*gm;

      if (!isRay && !isFish2){
        /* 水母：收缩喷水（竖向为主），横向同样只在收缩时被推出去 */
        var ph = state.time*sp.rate + c.phase;
        var sn = Math.sin(ph);
        var thrust = sn < 0 ? (-sn)*(-sn)*(-sn) : 0;
        var vyT = thrust*sp.rate*2.9 - 0.62 + Math.sin(c.t*0.21+c.phase)*0.14;
        c.vel.y = lerp(c.vel.y, vyT, Math.min(1, dtc*3.4));
        var kh = Math.min(1, dtc*3.2);
        c.vel.x = lerp(c.vel.x, _dir.x*vDes*0.86, kh);
        c.vel.z = lerp(c.vel.z, _dir.z*vDes*0.86, kh);
      } else {
        var kv2 = Math.min(1, dtc*(isRay ? 4.2 : 6.0));
        c.vel.x = lerp(c.vel.x, _dir.x*vDes, kv2);
        c.vel.y = lerp(c.vel.y, _dir.y*vDes, kv2);
        c.vel.z = lerp(c.vel.z, _dir.z*vDes, kv2);
      }

      var vmax = mul*1.6*Math.max(1, gm);
      var vm = c.vel.length();
      if (vm > vmax) c.vel.multiplyScalar(vmax/vm);

      /* 9. 积分：横向不设墙。整条鱼游出画面后，先在画外待一两秒
             （这段时间谁都看不见它），再从另一侧或原路游回来。
             所以鱼是真的会「游出视线之外」，而不是贴着看不见的边框打转。 */
      if (c.hideT > 0){
        c.hideT -= dtc;
        if (c.hideT <= 0){
          var h2 = viewHalfW(c.pos.z) + 1.6 + c.halfL*1.1;
          if (c.hideSwap){
            /* 从对面重新进场，方向不变 */
            c.pos.x = camera.position.x - c.hideSide*h2;
            c.pos.y = clamp(c.pos.y + rand(-2.4, 2.4), yLo, yHi);
            c.dirX = c.hideSide;
          } else {
            /* 掉头，顺着原路游回来 */
            c.dirX = -c.hideSide;
          }
          c.head  = (c.dirX >= 0 ? 0 : Math.PI) + rand(-0.35, 0.35);
          c.headV = rand(-0.12, 0.12);
          c.vel.set(Math.cos(c.head), c.headV, Math.sin(c.head)).normalize().multiplyScalar(c.speed);
          if (c.sdir) c.sdir.copy(c.vel).normalize();
          c.wrapCool = 0.8;
        }
      } else {
        c.pos.addScaledVector(c.vel, dtc);
        if (c.wrapCool > 0) c.wrapCool -= dtc;
        var hwz = viewHalfW(c.pos.z) + 1.6 + c.halfL*1.1;
        var ndx = c.pos.x - camera.position.x;
        if (c.wrapCool <= 0 && (ndx > hwz || ndx < -hwz)){
          c.hideSide = ndx > 0 ? 1 : -1;
          c.hideSwap = Math.random() < 0.62;
          c.hideT    = rand(1.6, 4.2);
          /* 再往外挪一点：相机慢慢漂移时，不至于把「藏着」的鱼露出来 */
          c.pos.x += c.hideSide*2.5;
        }
        if (c.pos.z <  CR_Z_LO){ c.pos.z =  CR_Z_LO; c.vel.z = Math.abs(c.vel.z)*0.5; }
        if (c.pos.z >  CR_Z_HI){ c.pos.z =  CR_Z_HI; c.vel.z = -Math.abs(c.vel.z)*0.5; }
        if (c.pos.y <  yLo){ c.pos.y = yLo; c.vel.y = Math.abs(c.vel.y)*0.4; }
        if (c.pos.y >  yHi){ c.pos.y = yHi; c.vel.y = -Math.abs(c.vel.y)*0.4; }
      }
    }

    /* ---- 姿态：朝向速度方向 ---- */
    var yawT;
    if (isRay){
      var vl = Math.sqrt(c.vel.x*c.vel.x + c.vel.z*c.vel.z);
      var prev = c.yaw;
      var pitchT, rollT;
      /* 鳐类：前方为局部 +Y、背为局部 +Z
         用 YXZ 欧拉（Ry·Rx·Rz）令「背恒朝上、前方水平朝游动方向」：
         Rz(-PI/2) 把前方转到 +X，Rx(-PI/2) 把背转到 +Y，Ry 定水平朝向 */
      yawT = vl > 0.06 ? Math.atan2(-c.vel.z, c.vel.x) : c.yaw;
      c.yaw = angleLerp(c.yaw, yawT, Math.min(1, dtc*2.8));
      c.yawR = lerp(c.yawR, clamp((c.yaw-prev)/dtc, -1.7, 1.7), Math.min(1, dtc*3));
      pitchT = -Math.PI*0.5 + 0.72
             + clamp(-c.vel.y*0.18, -0.24, 0.34)
             + Math.sin(c.t*0.52+c.phase)*0.05;
      rollT  = clamp(-c.yawR*0.55, -0.62, 0.62) + Math.sin(c.t*0.36+c.phase*1.7)*0.08;
      c.pitch = lerp(c.pitch, pitchT, Math.min(1, dtc*3.0));
      c.roll  = lerp(c.roll, rollT, Math.min(1, dtc*2.4));
      if (c.mats[0]){
        var ur = c.mats[0].uniforms;
        var gld = c.fly ? 0 : c.glide;
        /* 滑翔：翅膀放平到 48% 幅度，翼尖略微上扬（真实的蝠鲼滑翔时仍在轻轻扇） */
        ur.uFlapAmp.value = sp.flapAmp * (1 - 0.52*gld);
        ur.uCurl.value =
          Math.sin(c.t*0.6+c.phase)*0.10*(1 - 0.6*gld)
          + clamp(c.vel.length()*0.05, 0, 0.14)
          - 0.09*gld;
      }
    } else if (isFish2){
      /* 鱼：前方为局部 -Z；俯仰跟随垂直速度，转弯侧倾，摆尾频率随游速 */
      var vl3 = Math.sqrt(c.vel.x*c.vel.x + c.vel.z*c.vel.z);
      var prev3 = c.yaw;
      yawT = vl3 > 0.05 ? Math.atan2(-c.vel.x, -c.vel.z) : c.yaw;
      if (c.fly) yawT += c.fly.crab*clamp((c.fly.u-0.30)/0.35, 0, 1);
      c.yaw = angleLerp(c.yaw, yawT, Math.min(1, dtc*2.2));
      c.yawR = lerp(c.yawR, clamp((c.yaw-prev3)/dtc, -1.6, 1.6), Math.min(1, dtc*2.6));
      var pT3 = clamp(Math.atan2(c.vel.y, Math.max(0.4, vl3)) * 0.85, -0.55, 0.55)
              + Math.sin(c.t*0.70 + c.phase)*0.045;
      var rT3 = clamp(-c.yawR*0.55, -0.55, 0.55) + Math.sin(c.t*0.50 + c.phase)*0.05;
      if (c.fly) rT3 += c.fly.side * 0.28 * clamp((c.fly.u-0.44)/0.34, 0, 1);  /* 掠过时侧倾，露出斑纹背脊 */
      c.pitch = lerp(c.pitch, pT3, Math.min(1, dtc*2.6));
      c.roll  = lerp(c.roll,  rT3, Math.min(1, dtc*2.2));
      if (c.mats[0]){
        var uni = c.mats[0].uniforms;
        var spdN = c.vel.length()/Math.max(0.5, c.speed);
        uni.uFlapSpeed.value = sp.flapSpeed*(0.72 + 0.50*Math.min(1.6, spdN));
        c.flapSpd = uni.uFlapSpeed.value;
        /* 摆尾节律：鲨鱼 / 鲸鲨 / 金枪鱼都是「摆几下→滑一段」，
           巡航时尾巴一直在动，冲刺或受惊时几乎连续摆尾 */
        var beatT = 1.0;
        if (swm && swm.glide){
          var bp = Math.sin(c.t*(0.62 + 0.55*swm.glide) + c.phase*1.7);
          beatT = lerp(1.0, 0.16 + 1.05*smoothstep(-0.35, 0.55, bp), swm.glide);
          if (c.dash > 0 || c.scare > 0) beatT = 1.25;
        }
        if (c.hovering) beatT *= 0.16;
        uni.uBeat.value = lerp(uni.uBeat.value, beatT, Math.min(1, dtc*4.5));
        c.beatNow = uni.uBeat.value;
        var rowT = (c.hovering ? 1.0 : (swm && swm.row != null ? swm.row : 0.12)) * (sp.len || 1);
        uni.uRow.value = lerp(uni.uRow.value, rowT, Math.min(1, dtc*3.0));
        /* 转弯时整条身体向弯内弯过去（而不是像块木板一样平移） */
        uni.uBend.value = lerp(uni.uBend.value, clamp(-c.yawR, -2.2, 2.2)*0.070*(sp.len||1), Math.min(1, dtc*2.6));
      }
    } else {
      var vl2 = Math.sqrt(c.vel.x*c.vel.x + c.vel.z*c.vel.z);
      yawT = vl2 > 0.05 ? Math.atan2(c.vel.x, c.vel.z) : c.yaw + dtc*0.25;
      c.yaw = angleLerp(c.yaw, yawT, Math.min(1, dtc*0.7));
      var pT = clamp(-c.vel.y*0.14, -0.20, 0.20) + Math.sin(c.t*0.3+c.phase)*0.05;
      var rT = Math.sin(c.t*0.24+c.phase)*0.11;
      c.pitch = lerp(c.pitch, pT, Math.min(1, dtc*1.6));
      c.roll  = lerp(c.roll, rT, Math.min(1, dtc*1.4));
    }

    c.x = c.pos.x; c.y = c.pos.y; c.z = c.pos.z;
    c.depth = yToDepth(c.pos.y);
    /* 鮟鱇的灯会一明一暗地晃，孩子才注意得到那根钓竿 */
    if (c.group.userData.lure){
      var lur = c.group.userData.lure;
      var lp = 0.62 + 0.38*Math.sin(state.time*1.9 + c.phase*1.3);
      lur.material.opacity = 0.55 + 0.45*lp;
      lur.scale.setScalar((c.group.userData.lureBase || 1.3) * (0.90 + 0.16*lp));
    }
    c.group.position.set(c.pos.x, c.pos.y, c.pos.z);
    c.group.rotation.y = c.yaw;
    c.group.rotation.x = c.pitch;
    c.group.rotation.z = c.roll;

    if (c.fly && c.fly.u >= 1){ (dead || (dead = [])).push(c); }
  }
  if (dead) for (var di=0;di<dead.length;di++) removeCreature(dead[di]);
}

/* 点击发光时惊扰附近生物：它们会加速散开 */
function scareCreatures(x, y, r){
  for (var i=0;i<creatures.length;i++){
    var c = creatures[i];
    if (c.enter < 1) continue;
    var dx = c.pos.x-x, dy = c.pos.y-y;
    var d = Math.sqrt(dx*dx+dy*dy);
    if (d < r){
      var k = d > 0.01 ? 1/d : 1;
      c.scare = rand(0.7, 1.5);
      /* 掉头往外跑：横向离开惊扰源，纵向也躲开一点 */
      c.dirX = dx >= 0 ? 1 : -1;
      c.head = (c.dirX >= 0 ? 0 : Math.PI) + rand(-0.45, 0.45);
      c.headV = clamp(dy*k*1.6, -0.42, 0.42);
      c.wander = rand(1.4, 2.6);
    }
  }
}

function updateBursts(dt){
  var i, p;
  for (i=0;i<bioPool.length;i++){
    p = bioPool[i];
    p.userData.age += dt;
    p.material.uniforms.uAge.value = p.userData.age;
    p.visible = p.userData.age < p.userData.dur;
  }
  for (i=0;i<bubblePool.length;i++){
    p = bubblePool[i];
    p.userData.age += dt;
    p.material.uniforms.uAge.value = p.userData.age;
    p.visible = p.userData.age < p.userData.dur;
  }
  for (i=0;i<ringPool.length;i++){
    var r = ringPool[i];
    if (!r.visible) continue;
    r.userData.age += dt;
    r.material.uniforms.uAge.value = r.userData.age;
    if (r.userData.age > r.material.uniforms.uDur.value) r.visible = false;
  }
}

function updateFish(dt){
  if (!fishMesh) return;
  var t = state.time;
  for (var k=0;k<schools.length;k++){
    var sc = schools[k];
    sc.x += sc.sp*dt*0.75;
    if (sc.x > 46) sc.x = -46;
    if (sc.x < -46) sc.x = 46;
  }
  for (var i=0;i<FISH_N;i++){
    var f = fishData[i];
    var sc2 = schools[f.s];
    var sway = Math.sin(t*0.55 + f.ph)*0.32;
    dummy.position.set(
      sc2.x + f.ox,
      sc2.y + f.oy + sway,
      sc2.z + Math.sin(f.ox*0.35)*1.2
    );
    dummy.rotation.set(0, 0, sc2.sp > 0 ? -Math.PI*0.5 : Math.PI*0.5);
    dummy.scale.setScalar(f.sc);
    dummy.updateMatrix();
    fishMesh.setMatrixAt(i, dummy.matrix);
  }
  fishMesh.instanceMatrix.needsUpdate = true;
}

function tick(){
  var dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;

  state.still = lerp(state.still, state.stillT, Math.min(1, dt*2.2));
  state.clear = lerp(state.clear, state.clearT, Math.min(1, dt*2.0));
  U.uStill.value = state.still;
  U.uClear.value = state.clear;

  /* ---- 潜航：镜头顺着水柱下沉到选定的一层 ---- */
  tickAuto(dt);
  dive.amount = lerp(dive.amount, dive.on ? 1 : 0, Math.min(1, dt*2.6));
  dive.curY   = lerp(dive.curY, dive.on ? diveBaseY() : 0, Math.min(1, dt*2.4));
  dive.zoom   = lerp(dive.zoom, dive.on ? stopZoomOf(dive.depth) : DIVE_ZOOM, Math.min(1, dt*2.2));
  var dAmt = dive.amount;

  var bobAmp = 0.55*(1-0.85*state.still)*(1-0.55*dAmt);
  state.bob = (Math.sin(state.time*0.23)*0.62 + Math.sin(state.time*0.112+1.7)*0.38)*bobAmp;
  /* ---- 视角：上下 / 左右 / 前后（只平移，绝不旋转） ---- */
  var kv = 15*dt, moved = false;
  if (keys['arrowleft'])  { cam.tx -= kv; moved = true; }
  if (keys['arrowright']) { cam.tx += kv; moved = true; }
  if (keys['arrowup'])    { cam.ty += kv; moved = true; }
  if (keys['arrowdown'])  { cam.ty -= kv; moved = true; }
  if (keys['q'])          { cam.tz -= kv*1.6; moved = true; }
  if (keys['e'])          { cam.tz += kv*1.6; moved = true; }
  if (moved){ camClamp(); cam.held = true; cam.holdT = state.time; }
  if (cam.held && state.time - cam.holdT > 2.6) cam.held = false;

  var ax = 0, ay = 0, az = 0;
  if (cam.roam){
    var bl = cam.held ? clamp(1 - (state.time - cam.holdT)/2.6, 0, 1) : 1;
    bl *= (1 - 0.85*state.still);
    var rk = bl*(1 - 0.52*dAmt);
    ax = (Math.sin(state.time*0.085)*5.0 + Math.sin(state.time*0.037+2.1)*2.4) * rk;
    ay = (Math.sin(state.time*0.062+1.3)*3.2) * rk;
    az = (Math.sin(state.time*0.043+0.7)*5.5) * rk;
  }
  cam.x = lerp(cam.x, cam.tx + ax, Math.min(1, dt*1.5));
  cam.y = lerp(cam.y, cam.ty + ay, Math.min(1, dt*1.5));
  cam.z = lerp(cam.z, cam.tz + az, Math.min(1, dt*1.2));
  /* 潜航时镜头拉近 1.9 倍，看的就是这一层 */
  var camY = clamp(state.bob + cam.y + dive.curY, -30, 27);
  camera.position.set(cam.x, camY, CAM_DIST*lerp(1, dive.zoom, dAmt) + cam.z);
  camera.rotation.set(0, 0, 0);

  U.uTime.value = state.time;
  /* 背景按镜头的真实深度上色；潜航时把整条色带压缩，屏幕只覆盖当前这一层 */
  var kz = CAM_DIST / Math.max(1, camera.position.z);
  U.uBgZoom.value = lerp(1, kz, dAmt);
  U.uBgBob.value = (Y_TOP - camY)/WORLD_H - 0.5;
  U.uLit.value = dAmt;
  /* 海底跟着一起暗下去：深处的岩壁不该比鱼还亮 */
  if (abyssMats.length && Math.abs(abyssK - (1 - 0.62*dAmt)) > 0.004){
    abyssK = 1 - 0.62*dAmt;
    for (var _ai=0;_ai<abyssMats.length;_ai++) abyssMats[_ai].color.setScalar(abyssK);
  }
  rulerBody.style.transform = 'translate3d(0,' +
    (camY/WORLD_H*window.innerHeight*kz).toFixed(2) + 'px,0) scaleY(' + kz.toFixed(4) + ')';
  /* 标尺被放大后，文字要反向缩回去，否则会被拉长 */
  if (Math.abs(kz - rulerKz) > 0.015){
    rulerKz = kz;
    var inv = 1/kz;
    for (var rl=0;rl<rulerLabels.length;rl++){
      var ro = rulerLabels[rl];
      ro[0].style.transform = (ro[1] === 2 ? 'translateY(-50%) ' : '') + 'scaleY(' + inv.toFixed(4) + ')';
    }
  }
  /* 深处没有阳光，光柱收掉 */
  var lit = 1 - smoothstep(120, 520, dive.depth)*dAmt;
  shaftGroup.visible = state.shaft > 0.02 && lit > 0.14;

  tempMesh.position.y = depthToY(470) + Math.sin(state.time*0.12)*1.6;
  vortexMesh.position.set(U.uVortex.value.x, U.uVortex.value.y, -2);
  vortexMesh.visible = state.vortexOn;

  updateCreatures(dt);
  updateFlybyTimer(dt);
  updateBursts(dt);
  updateFish(dt);

  if (state.soundOn){
    Sound.whaleTimer -= dt;
    if (Sound.whaleTimer < 0){ Sound.whale(); Sound.whaleTimer = rand(13, 28); }
  }

  renderer.clear();
  renderer.render(bgScene, bgCam);
  renderer.clearDepth();
  renderer.render(scene, camera);
  updateTags(dt);

  renderThumbStep();

  // 帧率统计
  state.frames++;
  if (state.time - state.lastT > 1.2){
    var fps = state.frames/(state.time - state.lastT);
    state.frames = 0; state.lastT = state.time;
    state.fps = fps;
    var q = state.q;
    if (fps < 44 && q > 0.55) q = Math.max(0.55, q - 0.12);
    else if (fps < 52 && q > 0.7) q = Math.max(0.7, q - 0.07);
    else if (fps > 58 && q < 1) q = Math.min(1, q + 0.05);
    if (Math.abs(q - state.q) > 0.02){ state.q = q; applyQuality(); }
  }

  requestAnimationFrame(tick);
}

   9. 初始化

applyQuality();

setShaft(1);

/* ============================================================
   8.7 深度导览：选一层深度，潜航下去看这一层的住户
   ------------------------------------------------------------
   展厅本来是一整根竖着的水柱。选中一个深度，镜头顺着水柱
   下沉、拉近，只留下那一层的居民；越往下光越少、长得越怪。
   ============================================================ */
var DIVE_ZOOM = 0.38;
var STOPS = [
  { d:45,   lab:'45',   cn:'珊瑚礁 · 阳光带',
    note:'阳光直接照进水里，海水是亮的。珊瑚把礁石盖成一座花园，小鱼躲在枝杈间。',
    zoom:0.17, spread:20, reef:true,
    cast:[['coral',7],['kelp',4],['zebrafish',8],['seahorse',2],['angelfish',1],['puffer',1]] },
  { d:120,  lab:'120',  cn:'透光层',
    note:'光还够看清方向，但红光和黄光已经被海水吃掉了。',
    spread:70,  cast:[['dolphin',2],['angelfish',3],['puffer',2],['moray',2],['eagle',2]] },
  { d:400,  lab:'400',  cn:'微光层',
    note:'太阳只剩下一丝蓝光。这里的许多动物开始自己发光。',
    spread:180, cast:[['shark',2],['whaleshark',1],['bluespot',3],['moon',2],['tuna',1]] },
  { d:900,  lab:'900',  cn:'微光层深处',
    note:'最后一点阳光在这里消失，再往下就是永远的黑暗。',
    spread:290, cast:[['bluespot',2],['moon',2],['oarfish',2],['viperfish',3],['pelican',1]] },
  { d:1800, lab:'1.8k', cn:'无光层',
    note:'一点阳光也没有了。这里的鱼自己点灯，用来找路和找吃的。',
    spread:520, cast:[['nettle',3],['viperfish',3],['pelican',2],['oarfish',2],['angler',1]] },
  { d:3200, lab:'3.2k', cn:'深渊',
    note:'水压能把钢铁压扁，动物长得像外星生物。',
    spread:700, cast:[['angler',4],['viperfish',3],['pelican',2],['nettle',2]] }
];

function zoneInfo(d){
  if (d < 200)  return { n:'透光层', range:'0–200 m' };
  if (d < 1000) return { n:'微光层', range:'200–1000 m' };
  return { n:'无光层', range:'1000–4000 m' };
}
/* 用「屏幕上的距离」找最近的展区：深度轴的深浅比例是不均匀的 */
function nearestStop(d){
  var bn = 1e9, bs = STOPS[0];
  for (var i=0;i<STOPS.length;i++){
    var k = Math.abs(depthToNorm(d) - depthToNorm(STOPS[i].d));
    if (k < bn){ bn = k; bs = STOPS[i]; }
  }
  return bs;
}
function diveBaseY(){
  /* 贴着所选深度，稍微往下一档，把海床和下层的水带进画面 */
  return clamp(depthToY(dive.depth) - 1.2, -18, 19.2);
}
/* 每个展区自己的镜头远近：珊瑚礁那块要贴近看，深水层才用默认的 0.38 */
function stopZoomOf(d){
  var z = nearestStop(d).zoom || DIVE_ZOOM;
  /* 竖屏能看到的横向宽度只有横屏的一半，贴近看的时候动物会大得像贴在脸上，
     所以手机上把镜头退回来一点 */
  if (window.innerWidth < 760) z = Math.max(z, 0.30) * 1.05;
  return z;
}

var dive = { on:false, depth:0, curY:0, amount:0, stop:null, zoom:DIVE_ZOOM };

var diveEl      = document.getElementById('dive');
var btnDiveEl   = document.getElementById('btnDive');
var diveDEl     = document.getElementById('diveD');
var diveZEl     = document.getElementById('diveZ');
var diveTipEl   = document.getElementById('diveTip');
var diveRangeEl = document.getElementById('diveRange');
var diveTicksEl = document.getElementById('diveTicks');
var envTEl = document.getElementById('envT'), envLEl = document.getElementById('envL'), envPEl = document.getElementById('envP');
var envTBEl = document.getElementById('envTB'), envLBEl = document.getElementById('envLB'), envPBEl = document.getElementById('envPB');
var diveUEl = document.getElementById('diveU');
var envWrapEl = document.querySelector('.dive-env');

/* 这一层的水有多冷、多黑、多压 —— 展板上最常被孩子问的三个数 */
function updateEnv(d, on){
  if (envWrapEl) envWrapEl.classList.toggle('off', !on);
  if (!on){
    envTEl.textContent = '—'; envLEl.textContent = '—'; envPEl.textContent = '—';
    envTBEl.style.width = '0%'; envLBEl.style.width = '0%'; envPBEl.style.width = '0%';
    return;
  }
  var t = d < 200  ? lerp(24.5, 15.0, d/200)
        : d < 1000 ? lerp(15.0, 4.2, (d-200)/800)
        :            lerp(4.2, 1.6, clamp((d-1000)/3000, 0, 1));
  var l = 100 * Math.exp(-d/120);          /* 光每下潜约 120 m 就衰减到 1/e */
  var p = 1 + d/10.06;                     /* 每 10 m 增加一个大气压 */

  envTEl.textContent = t.toFixed(1);
  envLEl.textContent = l >= 10 ? l.toFixed(0)
                     : l >= 0.1 ? l.toFixed(1)
                     : l > 0.005 ? l.toFixed(2) : '0';
  envPEl.textContent = p < 10 ? p.toFixed(1) : String(Math.round(p));

  envTBEl.style.width = clamp(t/25*100, 0, 100).toFixed(1) + '%';
  envLBEl.style.width = clamp(Math.log10(1 + l)/2*100, 0, 100).toFixed(1) + '%';
  envPBEl.style.width = clamp(p/400*100, 0, 100).toFixed(1) + '%';
}

/* 换一层：把不在这层的动物请走，换成本层的住户 */
function diveReseed(stop){
  for (var q=creatures.length-1;q>=0;q--) if (!creatures[q].fly) removeCreature(creatures[q]);
  /* 会游的动物单独数一遍：横向槽位只在它们之间均分，
     不然珊瑚海藻先占掉一半槽位，鱼就全被挤到画面右半边去了 */
  var total = 0, i, n;
  for (i=0;i<stop.cast.length;i++){
    var sp0 = SPEC_BY_ID[stop.cast[i][0]];
    if (sp0 && sp0.kind !== 'plant') total += stop.cast[i][1];
  }
  var plantK = 0, fishK = 0;
  /* 竖向按「一屏有多高」来铺：只按深度均分的话，
     深处的动物全被压在画面下半截，上半屏空得发慌 */
  var halfH = 22.9 * stopZoomOf(stop.d);
  var yC0 = diveBaseY();
  var pad = halfH*0.34;              /* 允许越出自己水层一点点，否则每层只有一半画面有人 */
  /* 横向留给「面板和卡片之间那条空带」：不然鱼都躲到玻璃板后面去了 */
  var halfW = halfH * Math.max(0.5, window.innerWidth/Math.max(1, window.innerHeight));
  var x0 = -halfW*0.42, x1 = halfW*0.62;
  /* 手机上深度面板横跨整个屏幕，动物整体往下挪一点，别全躲在玻璃板后面 */
  var yShift = window.innerWidth < 760 ? -halfH*0.26 : 0;
  for (i=0;i<stop.cast.length;i++){
    var sp = SPEC_BY_ID[stop.cast[i][0]];
    if (!sp) continue;
    for (n=0;n<stop.cast[i][1];n++){
      /* 先在这一屏的高度里随机取一个 y，再夹回这个物种自己的水层 */
      var ty = yC0 + yShift + rand(-0.92, 0.92)*halfH;
      ty = clamp(ty, depthToY(sp.band[1]) + 0.5 - pad, depthToY(sp.band[0]) - 0.5 + pad);
      ty = clamp(ty, -20.6, 20.4);          /* 别钻出水面，也别钻到海床底下 */
      /* 大块头（鲸鲨、皇带鱼）离上下边缘留出大半个身位，不然一进场就被切掉半截 */
      var em = Math.min(halfH*0.62, Math.max(1.2, (sp.span || sp.len || 1)*0.78));
      ty = clamp(ty, yC0 - halfH + em, yC0 + halfH - em);
      var dd = yToDepth(ty);
      var slot = (fishK + 0.5) / Math.max(1, total);
      /* 礁区是一整片横贯画面的礁台，小鱼散得比别的展区宽一点；
         但还是留在「深度面板左边、卡片列右边」那条看得见的海水里 */
      var px = stop.reef
        ? x0*1.35 + slot*(x1*1.15 - x0*1.35) + rand(-0.45, 0.45)
        : x0 + slot*(x1 - x0) + rand(-1.4, 1.4);
      if (sp.kind === 'plant'){
        /* 珊瑚和海藻不悬在水里：沿礁顶铺开，根扎在礁石上。
           用黄金分割间距撒点，珊瑚和海藻才会交替出现，而不是左一半右一半 */
        var gf = (plantK*0.6180339887) % 1;
        px = -halfW*1.50 + gf*halfW*3.00 + rand(-0.35, 0.35);
        plantK++;
        /* 珊瑚贴着礁顶长；巨藻根部埋进礁石一点，看着才像扎住的 */
        ty = reefTopY(px) - (sp.plant === 'kelp' ? 0.34 : 0.06);
        dd = yToDepth(ty);
      } else {
        fishK++;
        /* 礁区里的鱼都在礁石上方游，别贴着礁顶的轮廓线穿模 */
        if (stop.reef) ty = Math.max(ty, reefTopY(px) + 0.62);
      }
      /* 长条的大鱼别把身子探进两侧的玻璃板里（珊瑚海藻除外：它们本来就贴着礁顶铺开） */
      var pL = (sp.span || sp.len || 1)*0.5;
      if (sp.kind !== 'plant' && x1 - x0 > pL*2.2) px = clamp(px, x0 + pL, x1 - pL);
      /* 斑马鱼爱成群：两条一对贴着游，散开就没那味儿了 */
      if (sp.kind !== 'plant' && sp.id === 'zebrafish'){
        px += (n % 2 ? -0.62 : 0.62) + rand(-0.16, 0.16);
        ty += (n % 4 < 2 ? 0.30 : -0.26) + rand(0, 0.95);
        dd = yToDepth(ty);
      }
      var pz = sp.kind === 'plant' ? -10.2 : rand(-9, 3.2);
      var c = spawnCreature(sp, dd, { instant:true, silent:true, x: px, z: pz });
      if (!c) continue;
      c.enter = 1;
      c.pos.set(c.x, c.y, c.z);
      /* 礁区的鱼各游各的方向，不然十条一起朝同一边走，回头画面里一条都不剩 */
      c.dirX = stop.reef ? (Math.random() < 0.5 ? 1 : -1) : (px < 0 ? 1 : -1);
      c.head = (c.dirX >= 0 ? 0 : Math.PI) + rand(-0.40, 0.40);
      c.headV = rand(-0.10, 0.10);
      c.vel.set(Math.cos(c.head), c.headV, Math.sin(c.head)).normalize().multiplyScalar(c.speed);
      c.wander = rand(2.5, 7);
      /* 礁区是一块「礁盘」：住户各自守着自己那一小块来回游 */
      if (stop.reef){
        c.homeX = px;
        c.homeZ = pz;
        c.homeY = ty;
        c.homeR = 1.7 + rand(0, 1.2);
      }
    }
  }
}

function updateDiveUI(){
  var d = dive.depth, z = zoneInfo(d), st = nearestStop(d);
  /* 没在潜航时别把「3200 m」挂在那里：那会让人以为现在就在 3200 米 */
  diveDEl.textContent = dive.on ? Math.round(d) : '全柱';
  diveUEl.style.display = dive.on ? '' : 'none';
  diveZEl.textContent = dive.on ? (z.n + ' · ' + z.range) : '0–4000 m · 整个水柱';
  diveTipEl.textContent = dive.on ? st.note : '往下拖滑块，或者点一个刻度，就能潜到那一层去看。';
  diveEl.classList.toggle('on', dive.on);
  btnDiveEl.textContent = dive.on ? '返回全柱' : '开始潜航';
  btnDiveEl.classList.toggle('on', dive.on);
  if (document.activeElement !== diveRangeEl){
    diveRangeEl.value = Math.round(depthToNorm(d)*1000);
  }
  for (var i=0;i<STOPS.length;i++){
    if (STOPS[i].el) STOPS[i].el.classList.toggle('hot', dive.on && STOPS[i] === st);
  }
  /* 卡片：不属于这一层的淡下去，并且把本层的住客排到最上面 */
  var ids = {};
  if (dive.on) for (var q=0;q<st.cast.length;q++) ids[st.cast[q][0]] = 1;
  for (var c=0;c<cardEls.length;c++){
    var mine = !!ids[SPECIES[c].id];
    cardEls[c].classList.toggle('off', dive.on && !mine);
    cardEls[c].style.order = dive.on && mine ? 0 : 1;
  }
  updateEnv(d, dive.on);
}

function diveTo(d, opts){
  opts = opts || {};
  d = clamp(d, 0, DEPTH_MAX);
  dive.depth = d;
  var wasOn = dive.on;
  dive.on = true;
  var st = nearestStop(d);
  if (!wasOn || st !== dive.stop || opts.force){
    dive.stop = st;
    diveReseed(st);
  }
  updateDiveUI();
  updateStatus();
}

function setDive(on){
  if (on === dive.on){ updateDiveUI(); return; }
  stopAuto();
  dive.on = on;
  if (on){
    dive.stop = nearestStop(dive.depth);
    diveReseed(dive.stop);
  } else {
    dive.stop = null;
    seedColumn();
  }
  updateDiveUI();
  updateStatus();
}

function stepStop(dir){
  stopAuto();
  var cur = nearestStop(dive.depth), idx = 0;
  for (var i=0;i<STOPS.length;i++) if (STOPS[i] === cur) idx = i;
  idx = clamp(idx + dir, 0, STOPS.length - 1);
  diveTo(STOPS[idx].d, { force:true });
}

(function buildDiveTicks(){
  for (var i=0;i<STOPS.length;i++){
    (function(st){
      var el = document.createElement('b');
      el.style.left = (depthToNorm(st.d)*100).toFixed(2) + '%';
      el.innerHTML = '<s>' + st.lab + '</s>';
      el.title = st.cn + ' · ' + st.d + ' m';
      el.addEventListener('click', function(e){ e.stopPropagation(); stopAuto(); diveTo(st.d, { force:true }); });
      diveTicksEl.appendChild(el);
      st.el = el;
    })(STOPS[i]);
  }
})();

btnDiveEl.addEventListener('click', function(){ setDive(!dive.on); });
diveRangeEl.addEventListener('input', function(){
  stopAuto();
  diveTo(normToDepth(parseFloat(diveRangeEl.value)/1000));
});
updateDiveUI();

/* ---------- 自动导览：给展厅大屏用的循环漫游 ---------- */
var AUTO_DWELL = 11;                       /* 每站停留的秒数 */
var auto = { on:false, i:0, t:0 };

function syncAutoBtn(){
  if (!btnAuto) return;
  btnAuto.classList.toggle('on', auto.on);
  btnAuto.textContent = auto.on ? (auto.i + 1) + '/' + STOPS.length : '导览';
}
function setAuto(on){
  on = !!on;
  if (on === auto.on) return;
  auto.on = on;
  auto.t = 0;
  if (on){
    /* 从人现在待在的那一层接着逛，而不是每次从头开始 */
    auto.i = STOPS.indexOf(nearestStop(dive.depth));
    if (auto.i < 0) auto.i = 0;
    diveTo(STOPS[auto.i].d, { force:true });
    playBubble(0.5);
  }
  syncAutoBtn();
}
/* 手动一插手，导览就交还给人，不跟人抢镜头 */
function stopAuto(){ if (auto && auto.on) setAuto(false); }

function tickAuto(dt){
  if (!auto.on) return;
  auto.t += dt;
  if (auto.t < AUTO_DWELL) return;
  auto.t = 0;
  auto.i = (auto.i + 1) % STOPS.length;
  diveTo(STOPS[auto.i].d, { force:true });
  syncAutoBtn();
  playBubble(0.5);
}
if (btnAuto){
  btnAuto.addEventListener('click', function(){
    setAuto(!auto.on);
    if (!auto.on) playBubble(0.4);
  });
}

    c.head = (c.dirX >= 0 ? 0 : Math.PI) + rand(-0.45, 0.45);
    c.headV = rand(-0.13, 0.13);

seedColumn();

/* 支持以 URL 参数指定初始状态：
   ?species=shark  开局展示该物种的讲解卡
   ?panel=chart    开局展开体型对照表
   ?fly=1          开局就来一次近景掠过（可加 &side=-1 走脚下，&u=0.6 跳到中途）
   ?dive=1800      开局直接潜航到 1800 m */
(function(){
  var m = location.search.match(/species=([a-z]+)/);
  if (m && SPEC_BY_ID[m[1]]) showDocent(SPEC_BY_ID[m[1]]);
  if (/panel=chart/.test(location.search)) showChart();
  var dm = location.search.match(/dive=(\d+)/);
  if (dm) diveTo(parseInt(dm[1], 10), { force:true });
  if (/fly=/.test(location.search)){
    var fid = location.search.match(/fly=([a-z]+)/);
    var fu  = location.search.match(/u=([\d.]+)/);
    var fs  = location.search.match(/side=(-?\d)/);
    startFlyby((fid && fid[1] !== '1') ? fid[1] : 'whaleshark', {
      u: fu ? parseFloat(fu[1]) : null,
      side: fs ? parseInt(fs[1], 10) : null
    });
  }
})();
requestAnimationFrame(tick);
})();
