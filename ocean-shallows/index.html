const thumbs = {};
function renderThumbs() {
  const S = 240;
  const rt = new THREE.WebGLRenderTarget(S, S, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat });
  rt.texture.encoding = THREE.sRGBEncoding;
  const pScene = new THREE.Scene();
  const pCam = new THREE.PerspectiveCamera(32, 1, 0.05, 60);
  const prevClear = new THREE.Color();
  renderer.getClearColor(prevClear);
  const prevAlpha = renderer.getClearAlpha();
  const prevRT = renderer.getRenderTarget();
  const bgFor = { manta: 0xbfe6ea, eagle: 0xbfe6ea, sting: 0xc6e8e9, moon: 0x3f8492, nettle: 0x35707f,
                  shark: 0x9ed4dd, clown: 0x8bc9d6, puffer: 0xaadde4, turtle: 0x93ccd6 };
  renderer.setClearColor(0xbfe6ea, 1);
  const buf = new Uint8Array(S * S * 4);

  // `ext` ≈ the model's largest dimension: 2.0/ext is the fit scale, so it fills the frame
  const ext = { manta: 4.9, eagle: 5.0, sting: 2.7, moon: 3.0, nettle: 4.6,
                shark: 3.1, clown: 1.20, puffer: 1.12, turtle: 1.62 };
  const lift = { manta: 0.0, eagle: 0.0, sting: 0.0, moon: -0.15, nettle: -0.55,
                 shark: 0.0, clown: 0.0, puffer: -0.04, turtle: -0.06 };
  const rot = {
    manta: [0.30, 0.62, -0.10], eagle: [0.30, 0.62, -0.10], sting: [0.30, 0.62, -0.10],
    moon: [0.12, 0.50, 0], nettle: [0.12, 0.50, 0],
    shark: [0.22, 0.95, -0.10], clown: [0.34, 0.62, -0.06], puffer: [0.30, 0.55, 0], turtle: [0.30, 0.42, 0]
  };

  Object.keys(SPECIES).forEach(key => {
    renderer.setClearColor(bgFor[key] || 0xbfe6ea, 1);
    const rig = rigs[key];
    const e = ext[key] || 3;
    const ps = 2.0 / e;
    const mesh = new THREE.InstancedMesh(rig.geoU, rig.mat, 1);
    const m = new THREE.Matrix4();
    const rr = rot[key] || [0.30, 0.62, -0.10];
    const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rr[0], rr[1], rr[2], 'YXZ'));
    m.compose(new THREE.Vector3(0, 0, 0), q, new THREE.Vector3(ps, ps, ps));
    mesh.setMatrixAt(0, m);
    const gU = rig.geoU;
    gU.attributes.aPhase.array[0] = 0.9;
    if (gU.attributes.aAmp) gU.attributes.aAmp.array[0] = 0.55;
    gU.attributes.aHold.array[0] = 0;
    gU.attributes.aVel.array[0] = 0; gU.attributes.aVel.array[1] = 0; gU.attributes.aVel.array[2] = 0;
    gU.attributes.aPhase.needsUpdate = true;
    if (gU.attributes.aAmp) gU.attributes.aAmp.needsUpdate = true;
    gU.attributes.aHold.needsUpdate = true;
    mesh.layers.set(0);
    mesh.frustumCulled = false;
    pScene.add(mesh);

    const D = 1.22 / Math.tan(THREE.MathUtils.degToRad(16));
    pCam.position.set(D * 0.05, D * 0.80, D * 0.62);
    pCam.lookAt(0, lift[key] || 0, 0);
    pCam.updateMatrixWorld();

    renderer.setRenderTarget(rt);
    renderer.clear(true, true, true);
    renderer.render(pScene, pCam);
    renderer.readRenderTargetPixels(rt, 0, 0, S, S, buf);

    const cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(S, S);
    for (let y = 0; y < S; y++) {
      const src = (S - 1 - y) * S * 4;
      img.data.set(buf.subarray(src, src + S * 4), y * S * 4);
    }
    ctx.putImageData(img, 0, 0);
    thumbs[key] = cv;
    pScene.remove(mesh);
    mesh.dispose();
  });

  rt.dispose();
  renderer.setRenderTarget(prevRT);
  renderer.setClearColor(prevClear, prevAlpha);
}

// ==================================================================
//  AUDIO — synthesized surf tied to the swash cycle
// ==================================================================
const audio = { ctx: null, on: false, master: null, surfGain: null, surfFilt: null, ready: false };

function swashReachJS(t) {
  const T = 7.4;
  let ph = (t % T) / T; if (ph < 0) ph += 1;
  const rise = smooth(0, 0.20, ph);
  const fall = 1 - smooth(0.20, 0.93, ph);
  const f = rise * fall;
  const T2 = T * 0.71;
  let ph2 = ((t * 1.13 + 2.7) % T2) / T2; if (ph2 < 0) ph2 += 1;
  const f2 = smooth(0, 0.17, ph2) * (1 - smooth(0.17, 0.88, ph2));
  return (5.6 * f + 2.7 * f2) * 1.0;
}

function initAudio() {
  if (audio.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  audio.ctx = ctx;
  const master = ctx.createGain();
  master.gain.value = 0.0;
  master.connect(ctx.destination);
  audio.master = master;

  const len = ctx.sampleRate * 3;
  const nb = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = nb.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;
    d[i] = last * 3.2 + w * 0.15;
  }
  audio.noise = nb;

  const src = ctx.createBufferSource();
  src.buffer = nb; src.loop = true;
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = 700; filt.Q.value = 0.6;
  const g = ctx.createGain(); g.gain.value = 0.0;
  src.connect(filt); filt.connect(g); g.connect(master);
  src.start();
  audio.surfSrc = src; audio.surfGain = g; audio.surfFilt = filt;

  const src2 = ctx.createBufferSource();
  src2.buffer = nb; src2.loop = true; src2.playbackRate.value = 0.5;
  const filt2 = ctx.createBiquadFilter();
  filt2.type = 'bandpass'; filt2.frequency.value = 240; filt2.Q.value = 0.8;
  const g2 = ctx.createGain(); g2.gain.value = 0.0;
  src2.connect(filt2); filt2.connect(g2); g2.connect(master);
  src2.start();
  audio.rumble = g2;

  const src3 = ctx.createBufferSource();
  src3.buffer = nb; src3.loop = true; src3.playbackRate.value = 1.6;
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 2100;
  const g3 = ctx.createGain(); g3.gain.value = 0;
  src3.connect(hp); hp.connect(g3); g3.connect(master);
  src3.start();
  audio.rainGain = g3;

  audio.ready = true;
}

function updateAudio(time) {
  if (!audio.ready || !audio.on) return;
  const r = swashReachJS(time);
  const k = clamp(r / 7.0, 0, 1);
  const target = 0.035 + 0.30 * Math.pow(k, 1.5);
  audio.surfGain.gain.setTargetAtTime(target, audio.ctx.currentTime, 0.12);
  audio.surfFilt.frequency.setTargetAtTime(420 + 1500 * k * k, audio.ctx.currentTime, 0.15);
  audio.rumble.gain.setTargetAtTime(0.05 + 0.10 * k, audio.ctx.currentTime, 0.25);
  if (audio.rainGain) audio.rainGain.gain.setTargetAtTime(U.rain.value * 0.085, audio.ctx.currentTime, 0.35);
}

function playSplash(vol) {
  if (!audio.ready || !audio.on) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  const src = ctx.createBufferSource();
  src.buffer = audio.noise;
  src.playbackRate.value = rand(0.8, 1.35);
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(2600, t);
  bp.frequency.exponentialRampToValueAtTime(420, t + 0.45);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol * 0.9, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  src.connect(bp); bp.connect(g); g.connect(audio.master);
  src.start(t); src.stop(t + 0.62);
}

function playPlink(vol) {
  if (!audio.ready || !audio.on) return;
  const ctx = audio.ctx, t = ctx.currentTime;
  const o = ctx.createOscillator();
  o.type = 'sine';
  const f = rand(560, 1500);
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.45, t + 0.16);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(g); g.connect(audio.master);
  o.start(t); o.stop(t + 0.26);
}

const dock = document.getElementById('dock');
const cntEl = document.getElementById('cnt');
const toastEl = document.getElementById('toast');
const hintEl = document.getElementById('hint');
const CARD_ORDER = ['manta', 'eagle', 'sting', 'shark', 'clown', 'puffer', 'turtle', 'moon', 'nettle'];
const state = { rain: false, whirl: false, calm: false, clear: false, sound: false, hidden: false };

let toastT = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

function updateCounter() {
  const n = { ray: 0, jelly: 0, fish: 0, turtle: 0 };
  for (let i = 0; i < creatures.length; i++) n[creatures[i].rig.kind]++;
  cntEl.textContent = '鳐 ' + n.ray + ' · 水母 ' + n.jelly + ' · 鱼 ' + n.fish + ' · 龟 ' + n.turtle;
}

const ndc = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function pickWater(cx, cy, out) {
  ndc.x = (cx / window.innerWidth) * 2 - 1;
  ndc.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.intersectPlane(waterPlane, out);
}

let drag = null;

function throwArc(c) {
  let tx = 0, tz = 0, ok = false;
  for (let i = 0; i < 60 && !ok; i++) {
    tx = rand(-34, 62); tz = rand(-42, 24);
    if (shoreDist(tx, tz) > 14 && bedH(tx, tz) < -2.2) ok = true;
  }
  c.arcFrom = c.p.clone();
  c.arcTo = new THREE.Vector3(tx, 0.06, tz);
  const d = c.arcFrom.distanceTo(c.arcTo);
  c.arcDur = clamp(d / 16, 0.72, 1.5);
  c.arcH = 4.5 + d * 0.24;
  c.t = 0; c.spin = 0; c.state = 'arc';
  addRing(c.p.x, c.p.z, 1.6, 0.35, 1.0);
}

function dropCreature(c) {
  c.state = 'fall'; c.t = 0; c.spin = 0;
  c.v.set(rand(-0.2, 0.2), 0, rand(-0.2, 0.2));
}

function flee(c, from) {
  c.flee = rand(2.4, 3.8);
  const dx = c.p.x - from.x, dz = c.p.z - from.z;
  const l = Math.hypot(dx, dz) || 1;
  c.fleeDir = new THREE.Vector3(dx / l, 0, dz / l);
  c.v.x += c.fleeDir.x * 3.2;
  c.v.z += c.fleeDir.z * 3.2;
  if (c.rig.kind === 'ray' && c.kind === 'sting') puffSilt(c);
  c.amp = c.rig.cfg.amp * 2.0;
}

function bindCard(el, kind) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    if (drag) return;
    if (creatures.length >= CREATURE_CAP) { toast('海中最多容纳 48 只生物'); return; }
    const c = spawnCreature(kind, 0.0, 0.0, 3.4);
    if (!c) return;
    c.state = 'held'; c.holdY = 3.4; c.yaw = rand(0, TAU);
    const wp = new THREE.Vector3();
    if (pickWater(e.clientX, e.clientY, wp)) { c.p.x = wp.x; c.p.z = wp.z; }
    c.p.y = 3.4;
    c.lastX = c.p.x; c.lastZ = c.p.z;
    drag = { kind, c, sx: e.clientX, sy: e.clientY, t0: performance.now(), moved: false };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* synthetic / stale pointer */ }
  }, { passive: false });

  el.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 9) drag.moved = true;
    const wp = new THREE.Vector3();
    if (pickWater(e.clientX, e.clientY, wp)) {
      drag.c.p.x = lerp(drag.c.p.x, wp.x, 0.5);
      drag.c.p.z = lerp(drag.c.p.z, wp.z, 0.5);
    }
  });

  const end = e => {
    if (!drag) return;
    const c = drag.c;
    const moved = drag.moved;
    const el2 = performance.now() - drag.t0;
    drag = null;
    if (!moved && el2 < 420) throwArc(c); else dropCreature(c);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
}

function buildCards() {
  CARD_ORDER.forEach(k => {
    const sp = SPECIES[k];
    const b = document.createElement('button');
    b.className = 'card'; b.dataset.k = k; b.type = 'button';
    b.setAttribute('aria-label', sp.cn + ' · ' + sp.en + '，点击抛入海中，拖动放置');
    const th = document.createElement('div');
    th.className = 'thumb' + (SPECIES[k].R ? ' deep' : '');
    if (thumbs[k]) th.appendChild(thumbs[k]);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = sp.cn;
    const lt = document.createElement('div'); lt.className = 'lt'; lt.textContent = sp.en;
    b.appendChild(th); b.appendChild(nm); b.appendChild(lt);
    bindCard(b, k);
    dock.appendChild(b);
  });
}

// ---- canvas interactions
let whirlDrag = false;
canvas.addEventListener('pointerdown', e => {
  const wp = new THREE.Vector3();
  if (!pickWater(e.clientX, e.clientY, wp)) return;
  if (state.whirl) {
    whirlDrag = true;
    U.swirlPos.value.set(wp.x, wp.z);
    addRing(wp.x, wp.z, 5, 0.6, 1.8);
    return;
  }
  let hit = false;
  for (let i = 0; i < creatures.length; i++) {
    const c = creatures[i];
    if (Math.hypot(c.p.x - wp.x, c.p.z - wp.z) < 8) { flee(c, wp); hit = true; }
  }
  addRing(wp.x, wp.z, hit ? 3.4 : 2.2, hit ? 0.85 : 0.5, hit ? 1.8 : 1.2);
  if (!hit) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * TAU, sp = rand(0.2, 1.2);
      pAir.emit(wp.x, 0.05, wp.z, Math.cos(a) * sp, rand(1.0, 2.6), Math.sin(a) * sp, rand(0.3, 0.7), rand(0.04, 0.1), 0.95, 1, 1, 0);
    }
    playSplash(0.16);
  } else {
    playSplash(0.28);
  }
}, { passive: true });

let lastSkim = 0;
canvas.addEventListener('pointermove', e => {
  const wp = new THREE.Vector3();
  if (whirlDrag) {
    if (pickWater(e.clientX, e.clientY, wp)) U.swirlPos.value.set(wp.x, wp.z);
    return;
  }
  // brushing the cursor across the water leaves a faint ring — nothing more, this is a backdrop
  const now = performance.now();
  if (now - lastSkim < 220) return;
  lastSkim = now;
  if (pickWater(e.clientX, e.clientY, wp)) addRing(wp.x, wp.z, 0.85, 0.13, 2.8);
}, { passive: true });
window.addEventListener('pointerup', () => { whirlDrag = false; });

// ---- tools
const toolBtns = Array.from(document.querySelectorAll('.tool'));
function setTool(act, on) {
  const b = toolBtns.find(x => x.dataset.act === act);
  if (b) { b.classList.toggle('on', !!on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); }
}
toolBtns.forEach(b => b.setAttribute('aria-pressed', 'false'));
function toggle(act) {
  if (act === 'full') { toggleFullscreen(); return; }
  if (act === 'hide') {
    state.hidden = !state.hidden;
    document.body.classList.toggle('hideui', state.hidden);
    setTool('hide', state.hidden);
    return;
  }
  if (act === 'sound') {
    state.sound = !state.sound;
    if (state.sound) {
      initAudio();
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
      audio.on = true;
      audio.master.gain.setTargetAtTime(0.5, audio.ctx.currentTime, 0.4);
      playPlink(0.06);
    } else if (audio.ready) {
      audio.on = false;
      audio.master.gain.setTargetAtTime(0.0, audio.ctx.currentTime, 0.25);
    }
    setTool('sound', state.sound);
    return;
  }
  state[act] = !state[act];
  setTool(act, state[act]);
  if (act === 'whirl' && state.whirl) toast('拖动水面移动漩涡');
}
toolBtns.forEach(b => b.addEventListener('click', () => toggle(b.dataset.act)));

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') toggle('rain');
  else if (k === 'w') toggle('whirl');
  else if (k === 'c') toggle('calm');
  else if (k === 'm') toggle('clear');
  else if (k === 'h') toggle('hide');
  else if (k === 'f') toggleFullscreen();
  else if (k === 'p') togglePause();
});

// ==================================================================
//  FRAME UPDATE
// ==================================================================
function updatePalm(time) {
  for (let i = 0; i < fronds.length; i++) {
    const f = fronds[i];
    const u = f.userData;
    f.rotation.z = u.base + Math.sin(time * u.spd + u.ph) * u.amp;
    f.rotation.x = Math.sin(time * u.spd * 1.31 + u.ph * 1.7) * u.amp * 0.75;
  }
  palm.rotation.z = Math.sin(time * 0.42) * 0.008;
}

function drip(c) {
  const a = Math.random() * TAU, r = 0.15;
  pAir.emit(c.p.x + Math.cos(a) * r, c.p.y - 0.75, c.p.z + Math.sin(a) * r,
    rand(-0.1, 0.1), rand(-0.4, 0.1), rand(-0.1, 0.1), 1.6, 0.05, 0.82, 0.94, 0.98, 0);
  if (Math.random() < 0.5) playPlink(0.035);
}

window.__update = function (dt, time) {
  U.rain.value += ((state.rain ? 1 : 0) - U.rain.value) * Math.min(1, dt * 1.6);
  U.swirl.value += ((state.whirl ? 1 : 0) - U.swirl.value) * Math.min(1, dt * 1.3);
  U.swell.value += ((state.calm ? 0.10 : 1) - U.swell.value) * Math.min(1, dt * 0.9);
  U.foam.value += ((state.calm ? 0.30 : 1) - U.foam.value) * Math.min(1, dt * 0.9);
  U.clarity.value += ((state.clear ? 0.38 : 1) - U.clarity.value) * Math.min(1, dt * 0.9);
  if (state.calm) state.calmSink = 1;

  beginCreatureFrame();
  for (let i = 0; i < creatures.length; i++) {
    const c = creatures[i];
    updateCreature(c, dt, time);
    if (c.state === 'held') {
      c.dripCd -= dt;
      if (c.dripCd <= 0) { c.dripCd = rand(0.3, 0.7); drip(c); }
      // wet ring below the held creature when it hovers near the surface
      c.wetCd = (c.wetCd || 0) - dt;
      if (c.wetCd <= 0) { c.wetCd = rand(0.9, 1.6); addRing(c.p.x, c.p.z, 2.2, 0.20, 1.6); }
    }
    if (c.rig.kind === 'jelly' && c.state !== 'held' && c.p.y > -1.6 && Math.random() < dt * 0.25) playPlink(0.018);
  }
  endCreatureFrame();
  updateCreatureShadows();

  pAir.update(dt);
  pUnder.update(dt);
  updatePalm(time);
  updateAudio(time);

  // rain droplets hitting the surface
  if (U.rain.value > 0.2) {
    const n = Math.random() < dt * 14 ? 1 : 0;
    for (let i = 0; i < n; i++) {
      const x = rand(-45, 55), z = rand(-50, 28);
      addRing(x, z, rand(0.5, 1.1), 0.22, 0.9);
    }
  }
};

// ==================================================================
//  BOOT
// ==================================================================
renderThumbs();
buildCards();
seedLife();
updateCounter();
setTimeout(() => { hintEl.style.opacity = '0.28'; }, 9000);

/*__NEXT__*/

// ------------------------------------------------------------------ resize / quality
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const pr = DPR * QUALITY;
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, false);
  const aspect = w / h;
  camera.aspect = aspect;

  // keep the little beach in the top-left corner on every aspect ratio:
  // portrait screens need a wider lens, a little more distance and a target shifted toward the shore
  if (aspect >= 1.15) {
    camera.fov = 45;
    camera.position.set(0, 68, 34);
    camera.lookAt(0, 0, -5);
  } else {
    // portrait: aim at open water and lift the eye — the narrow FOV would otherwise fill
    // half the screen with sand
    const k = clamp(0.0, 1.0, (1.15 - aspect) / 0.75);
    const tx = lerp(-14, 6, k), tz = lerp(-16, 2, k);
    camera.fov = 47 + 12 * k;
    camera.position.set(tx, 68 + 12 * k, tz + 39 + 6 * k);
    camera.lookAt(tx, 0, tz);
  }
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();

  const dw = Math.max(2, Math.floor(w * pr));
  const dh = Math.max(2, Math.floor(h * pr));
  if (rtScene) rtScene.dispose();
  rtScene = makeSceneRT(dw, dh);
  waterMat.uniforms.uScene.value = rtScene.texture;
  waterMat.uniforms.uDepth.value = rtScene.depthTexture;
  waterMat.uniforms.uRes.value.set(dw, dh);
  quadMat.map = rtScene.texture;
  quadMat.needsUpdate = true;
  waterMat.uniforms.uNear.value = camera.near;
  waterMat.uniforms.uFar.value = camera.far;
}
window.addEventListener('resize', resize);

// ==================================================================
//  AMBIENT / WALLPAPER BEHAVIOUR
// ==================================================================
// The page is meant to sit on a desktop for hours. The interface fades away when nobody
// touches it, the renderer sleeps while the tab is hidden, and the frame rate can be capped.
const IDLE_MS = WALLPAPER ? 2800 : 6500;
let idleTimer = 0;
let pointerHeld = false;
let idleHinted = false;

const uiPanels = [document.getElementById('dock'), document.getElementById('tools')];
function setUIOffscreen(off) {
  uiPanels.forEach(el => { if (el && 'inert' in el) el.inert = off; });
}

function sleepUI() {
  if (pointerHeld) return;
  const a = document.activeElement;
  if (a && a.closest && a.closest('.dock, .tools')) return;   // keyboard focus is still inside the UI
  const wasAwake = !document.body.classList.contains('idle');
  document.body.classList.add('idle');
  setUIOffscreen(true);
  // one-time hint so the fade never reads as a broken page
  if (wasAwake && !idleHinted && !WALLPAPER) {
    idleHinted = true;
    setTimeout(() => { if (document.body.classList.contains('idle')) toast('界面已淡出 · 移动鼠标唤出'); }, 900);
  }
}
function wakeUI() {
  document.body.classList.remove('idle');
  setUIOffscreen(false);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(sleepUI, IDLE_MS);
}
['pointermove', 'pointerdown', 'wheel', 'touchstart', 'keydown', 'focus']
  .forEach(t => window.addEventListener(t, wakeUI, { passive: true }));
window.addEventListener('pointerdown', () => { pointerHeld = true; clearTimeout(idleTimer); }, { passive: true });
['pointerup', 'pointercancel'].forEach(t =>
  window.addEventListener(t, () => { pointerHeld = false; wakeUI(); }, { passive: true }));
document.addEventListener('blur', sleepUI);
window.addEventListener('focus', wakeUI);

// ---- pause
let paused = false;
function togglePause() {
  paused = !paused;
  if (paused) { stopLoop(); toast('已暂停 · 再按 P 继续'); }
  else { startLoop(); wakeUI(); }
}

// ---- fullscreen
function toggleFullscreen() {
  const el = document.documentElement;
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (fs) {
      const p = (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
      if (p && p.catch) p.catch(function () {});
    } else {
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!fn) { toast('当前浏览器不支持全屏'); return; }
      const p = fn.call(el);
      if (p && p.catch) p.catch(() => toast('浏览器阻止了全屏'));
    }
  } catch (err) { toast('浏览器阻止了全屏'); }
}
document.addEventListener('fullscreenchange', () => {
  setTool('full', !!document.fullscreenElement);
  wakeUI();
});
document.addEventListener('webkitfullscreenchange', () => {
  setTool('full', !!document.webkitFullscreenElement);
});

// ---- slow day cycle
// Default is a ±3.5 % breathing that nobody consciously notices but that keeps the light
// from looking frozen after an hour. ?cycle=1 opens it up into a visible warm / cool drift.
const CYCLE_S = QS.get('cycle') === '1' ? 240 : 420;
const CYCLE_AMP = QS.get('cycle') === '1' ? 0.34 : 0.035;
const SUN_BASE = sun.intensity, HEMI_BASE = hemi.intensity;
const SUN_NEUTRAL = new THREE.Color(0xfff1d6);
const SUN_WARM = new THREE.Color(0xffd2a0);
const SUN_COOL = new THREE.Color(0xe6f2ff);
const _sunTmp = new THREE.Color();
function applyDayCycle(t) {
  const ph = Math.sin(t * TAU / CYCLE_S);
  sun.intensity = SUN_BASE * (1 + ph * CYCLE_AMP * 0.9);
  hemi.intensity = HEMI_BASE * (1 + ph * CYCLE_AMP * 0.7);
  if (CYCLE_AMP > 0.1) {
    _sunTmp.copy(SUN_NEUTRAL).lerp(ph > 0 ? SUN_WARM : SUN_COOL, Math.abs(ph) * 0.6);
    sun.color.copy(_sunTmp);
    waterMat.uniforms.uSunCol.value.copy(_sunTmp).convertSRGBToLinear().multiplyScalar(1.45);
  }
}

if (WALLPAPER) sleepUI(); else wakeUI();

// ------------------------------------------------------------------ main loop
let last = performance.now();
let rafId = 0;

function startLoop() {
  if (rafId || paused) return;
  last = performance.now();
  rafId = requestAnimationFrame(renderFrame);
}
function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopLoop();                                   // a wall paper behind a maximised window costs nothing
    if (audio.ready && audio.on) audio.master.gain.setTargetAtTime(0.0, audio.ctx.currentTime, 0.12);
  } else {
    startLoop();
    wakeUI();
    if (audio.ready && audio.on) audio.master.gain.setTargetAtTime(0.5, audio.ctx.currentTime, 0.35);
  }
});
window.addEventListener('pagehide', stopLoop);
window.addEventListener('pageshow', e => { if (e.persisted) startLoop(); });

let simCur = 0;
let frames = 0, accum = 0, slowStreak = 0;

let frameNo = 0;
let firstFrameDone = false;

function renderFrame(now) {
  rafId = requestAnimationFrame(renderFrame);

  const raw = (now - last) / 1000;
  // frame cap: skipping a frame is far cheaper than drawing it
  if (FPS_CAP > 0 && raw < 1 / FPS_CAP - 0.002) return;

  // clamp to a strictly positive step: a negative dt would run every lerp backwards
  const dt = Math.max(0.0005, Math.min(0.05, raw));
  frameNo++;
  last = Math.max(last, now);
  U.time.value += dt;
  applyDayCycle(U.time.value);

  // ---- GPU ripple step
  simMat.uniforms.uState.value = simRT[simCur].texture;
  renderer.setRenderTarget(simRT[1 - simCur]);
  renderer.render(simScene, simCam);
  simCur = 1 - simCur;

  waterMat.uniforms.uState.value = simRT[simCur].texture;
  U.camPos.value.copy(camera.position);

  if (window.__update) window.__update(dt, U.time.value);

  // 2048² shadow map is the single most expensive pass — palm fronds sway slowly, half rate is invisible
  if ((frameNo & 1) === 0) renderer.shadowMap.needsUpdate = true;
  renderer.setClearColor(0x0a3c44, 1);

  // ---- pass 1 : underwater world -> target
  camera.layers.set(0);
  renderer.setRenderTarget(rtScene);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);

  // ---- pass 2 : backdrop + water + surface objects
  renderer.setRenderTarget(null);
  renderer.clear(true, true, true);
  camera.layers.set(1);
  renderer.render(quadScene, quadCam);
  renderer.render(scene, camera);

  if (!firstFrameDone) { firstFrameDone = true; document.body.classList.add('ready'); }

  // ---- adaptive quality
  frames++; accum += dt;
  if (frames >= 45) {
    const fps = frames / accum;
    if (fps < 42 && QUALITY > 0.62) { slowStreak++; if (slowStreak >= 2) { QUALITY = Math.max(0.62, QUALITY - 0.16); resize(); slowStreak = 0; } }
    else slowStreak = 0;
    frames = 0; accum = 0;
  }
}

resize();
(function warmUp(){
  for (let i = 0; i < 420; i++) {
    simMat.uniforms.uState.value = simRT[simCur].texture;
    renderer.setRenderTarget(simRT[1 - simCur]);
    renderer.render(simScene, simCam);
    simCur = 1 - simCur;
    U.time.value += 1 / 60;
  }
  waterMat.uniforms.uState.value = simRT[simCur].texture;
})();
// ?fps caps the loop; ?q=low starts below native resolution
startLoop();

})();
</script>
</body>
