<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#dff3f1" />
<title>Ocean Shallows · 浅海</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#062b31}
  body{
    font-family:'Nunito Sans',system-ui,-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    color:#0b3439;user-select:none;-webkit-user-select:none;
    opacity:0;transition:opacity .9s ease;
  }
  body.ready{opacity:1}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(125% 95% at 50% 42%, rgba(0,0,0,0) 52%, rgba(4,42,46,.21) 100%);
    mix-blend-mode:multiply;
  }
  .grain{
    position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.06;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.5'/></svg>");
  }

  /* ---------- top hud ---------- */
  .hud{position:fixed;z-index:7;pointer-events:none;transition:opacity .55s cubic-bezier(.4,0,.2,1), transform .55s cubic-bezier(.4,0,.2,1)}
  .brand{left:22px;top:18px;display:flex;flex-direction:column;gap:6px}
  .brand .cn{
    font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:30px;line-height:1;letter-spacing:.14em;
    color:#08343a;text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .brand .en{
    font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:300;font-size:12px;letter-spacing:.34em;
    text-transform:uppercase;color:#1a5a60;opacity:.85;
  }
  .brand .cnt{
    margin-top:4px;align-self:flex-start;
    font-size:11.5px;letter-spacing:.14em;font-weight:600;color:#0d454b;
    padding:5px 11px;border-radius:999px;
    background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);
    backdrop-filter:blur(14px) saturate(1.6);-webkit-backdrop-filter:blur(14px) saturate(1.6);
    box-shadow:0 6px 16px -12px rgba(0,40,46,.9);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- tools ---------- */
  .tools{
    position:fixed;z-index:8;right:18px;top:18px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:56vw;
    transition:opacity .55s cubic-bezier(.4,0,.2,1), transform .55s cubic-bezier(.4,0,.2,1);
  }
  .tool{
    -webkit-appearance:none;appearance:none;border:1px solid rgba(255,255,255,.68);cursor:pointer;
    display:flex;align-items:center;gap:7px;
    padding:8px 12px 8px 11px;border-radius:999px;
    background:rgba(255,255,255,.34);color:#0b3b41;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;
    backdrop-filter:blur(16px) saturate(1.7);-webkit-backdrop-filter:blur(16px) saturate(1.7);
    box-shadow:0 10px 22px -18px rgba(0,30,36,.9), 0 1px 0 rgba(255,255,255,.7) inset;
    transition:background .2s, color .2s, transform .18s, box-shadow .2s, border-color .2s;
  }
  .tool:hover{background:rgba(255,255,255,.56);transform:translateY(-1px)}
  .tool:active{transform:translateY(0) scale(.98)}
  .tool i{
    font-style:normal;font-size:9px;font-weight:700;letter-spacing:0;
    width:15px;height:15px;display:grid;place-items:center;border-radius:4px;
    background:rgba(9,60,66,.12);color:#0d4a50;
  }
  .tool.on{background:rgba(12,74,82,.9);color:#eafcfb;border-color:rgba(255,255,255,.24);box-shadow:0 10px 24px -14px rgba(0,30,36,.9)}
  .tool.on i{background:rgba(255,255,255,.18);color:#dff8f6}
  .tool:focus-visible,.card:focus-visible{outline:2px solid #0c4a52;outline-offset:3px}
  @media (prefers-reduced-motion: reduce){
    .tool,.card .thumb,.dock,.hud,.hint,.toast{transition-duration:.01ms !important}
  }

  /* ---------- dock ---------- */
  .dock{
    position:fixed;z-index:9;left:50%;bottom:max(16px, env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(0);
    display:flex;align-items:flex-end;gap:8px;padding:9px;border-radius:26px;
    background:rgba(255,255,255,.30);
    border:1px solid rgba(255,255,255,.58);
    backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);
    box-shadow:0 30px 60px -34px rgba(0,34,40,.95), 0 1px 0 rgba(255,255,255,.75) inset;
    transition:opacity .55s cubic-bezier(.4,0,.2,1), transform .55s cubic-bezier(.4,0,.2,1);
    max-width:calc(100vw - 24px);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  }
  .dock::-webkit-scrollbar{display:none}
  .card{
    -webkit-appearance:none;appearance:none;border:0;background:transparent;padding:0;cursor:grab;
    display:flex;flex-direction:column;align-items:center;gap:5px;width:96px;flex:0 0 auto;
    touch-action:none;
  }
  .card:active{cursor:grabbing}
  .thumb{
    width:96px;height:96px;border-radius:17px;position:relative;overflow:hidden;
    background:linear-gradient(170deg,#cdeef0 0%,#8fd6d9 45%,#5fb8c2 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 12px 20px -16px rgba(0,30,36,.95), 0 0 0 1px rgba(255,255,255,.55);
    transition:transform .22s cubic-bezier(.34,1.4,.5,1), box-shadow .22s;
  }
  .thumb canvas{width:100%;height:100%;display:block}
  .card:hover .thumb{transform:translateY(-3px) scale(1.035);box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 18px 26px -16px rgba(0,30,36,.95), 0 0 0 1px rgba(255,255,255,.7)}
  .card .nm{font-size:11px;font-weight:700;letter-spacing:.06em;color:#0a373d;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  .card .lt{font-family:'Fraunces',serif;font-style:italic;font-size:8.5px;color:#1c5d63;opacity:.8;margin-top:-3px;letter-spacing:.02em;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .thumb.deep{background:linear-gradient(170deg,#4c93a0 0%,#2c6c7b 48%,#1b4f5c 100%)}

  /* ---------- misc ---------- */
  .hint{
    position:fixed;z-index:7;left:50%;bottom:calc(max(16px, env(safe-area-inset-bottom)) + 122px);
    transform:translateX(-50%);
    font-size:11px;letter-spacing:.16em;color:#0d4a50;opacity:.62;white-space:nowrap;
    transition:opacity .5s;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.5);
  }
  .toast{
    position:fixed;z-index:20;left:50%;top:78px;transform:translate(-50%,-8px);
    background:rgba(10,52,58,.86);color:#eafbfa;padding:9px 16px;border-radius:999px;
    font-size:12px;letter-spacing:.1em;opacity:0;pointer-events:none;
    transition:opacity .3s, transform .3s;backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  body.hideui .hud, body.hideui .tools, body.hideui .dock, body.hideui .hint, body.hideui .vignette{
    opacity:0;pointer-events:none;
  }
  body.hideui .dock{transform:translateX(-50%) translateY(28px)}
  body.hideui .tools{transform:translateY(-14px)}

  /* ---------- ambient: the UI steps back when the sea is left alone ---------- */
  body.idle .hud, body.idle .tools, body.idle .dock, body.idle .hint{opacity:0;pointer-events:none}
  body.idle .dock{transform:translateX(-50%) translateY(24px)}
  body.idle .tools{transform:translateY(-14px)}
  body.idle, body.idle #c{cursor:none}
  /* while idling the vignette stays: it is part of the picture, not the interface */
  @media (prefers-reduced-motion: reduce){
    body.idle .hud, body.idle .tools, body.idle .dock, body.idle .hint{transition-duration:.01ms !important}
  }

  /* ---------- fatal fallback ---------- */
  .fatal{
    position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:28px;text-align:center;
    background:radial-gradient(120% 100% at 50% 38%, #e9f7f5 0%, #a9dbd7 52%, #4e9aa1 100%);
  }
  .fatal.show{display:grid}
  .fatal .box{max-width:420px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .fatal .t{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:27px;letter-spacing:.14em;color:#08343a}
  .fatal .d{font-size:13px;line-height:1.75;color:#0d454b;opacity:.84}
  .fatal .r{
    margin-top:4px;padding:8px 18px;border-radius:999px;border:1px solid rgba(8,52,58,.28);
    background:rgba(255,255,255,.5);color:#08343a;font-family:inherit;font-size:12px;font-weight:700;
    letter-spacing:.08em;cursor:pointer;
  }
  .fatal .r:hover{background:rgba(255,255,255,.82)}

  @media (max-width: 1180px){
    /* nine cards no longer fit at 96 px — shrink the deck before it has to scroll */
    .card{width:80px}
    .thumb{width:80px;height:80px;border-radius:15px}
    .card .lt{font-size:8px}
    .hint{bottom:calc(max(16px, env(safe-area-inset-bottom)) + 108px)}
  }
  @media (max-width: 760px){
    .brand{left:16px;top:14px}
    .brand .cn{font-size:23px;letter-spacing:.12em}
    .brand .en{font-size:9.5px;letter-spacing:.26em}
    .brand .cnt{font-size:10px;padding:4px 9px}
    .tools{right:12px;top:12px;gap:5px;max-width:calc(100vw - 24px)}
    .tool{padding:6px 9px;font-size:10.5px;gap:5px}
    .tool i{display:none}
    .tool[data-act="full"]{display:none}
    .dock{gap:6px;padding:7px;border-radius:22px;bottom:max(10px, env(safe-area-inset-bottom));
          max-width:calc(100vw - 20px);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;justify-content:flex-start}
    .dock::-webkit-scrollbar{display:none}
    .card{width:64px}
    .thumb{width:64px;height:64px;border-radius:13px}
    .card .nm{font-size:9.5px}
    .card .lt{display:none}
    .hint{bottom:calc(max(10px, env(safe-area-inset-bottom)) + 92px);font-size:9.5px;letter-spacing:.1em}
  }
  @media (max-width: 430px){
    .brand .cn{font-size:20px}
    .tools{top:10px;right:10px;gap:4px}
    .tool{padding:5px 7px;font-size:9px;letter-spacing:.02em}
    .dock{gap:5px;padding:6px;border-radius:20px}
    .card{width:56px}
    .thumb{width:56px;height:56px;border-radius:11px}
    .card .nm{font-size:8.5px}
    .hint{font-size:8.5px;bottom:calc(max(10px, env(safe-area-inset-bottom)) + 80px)}
  }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="浅海：俯视热带浅海三维场景"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<div class="hud brand">
  <div class="cn">浅海</div>
  <div class="en">Ocean Shallows</div>
  <div class="cnt" id="cnt" aria-live="polite">鳐 0 · 水母 0 · 鱼 0 · 龟 0</div>
</div>

<div class="tools" id="tools">
  <button class="tool" data-act="rain"><span>降雨</span><i>R</i></button>
  <button class="tool" data-act="whirl"><span>漩涡</span><i>W</i></button>
  <button class="tool" data-act="calm"><span>平静</span><i>C</i></button>
  <button class="tool" data-act="clear"><span>清澈</span><i>M</i></button>
  <button class="tool" data-act="sound"><span>声音</span><i>♪</i></button>
  <button class="tool" data-act="full"><span>全屏</span><i>F</i></button>
  <button class="tool" data-act="hide"><span>隐藏</span><i>H</i></button>
</div>

<div class="hint" id="hint">点击卡片抛入海中 · 拖动卡片把它放在水面</div>
<div class="dock" id="dock"></div>
<div class="toast" id="toast"></div>

<div class="fatal" id="fatal" role="alert">
  <div class="box">
    <div class="t">浅海</div>
    <div class="d" id="fatalMsg"></div>
    <button class="r" type="button" onclick="location.reload()">重新加载</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   OCEAN SHALLOWS — single file three.js r128 sketch
   ===================================================================== */
(function () {
'use strict';

// ------------------------------------------------------------------ boot guards
const fatalEl = document.getElementById('fatal');
const fatalMsg = document.getElementById('fatalMsg');
function fatal(title, detail) {
  if (fatalMsg) fatalMsg.textContent = title + (detail ? '：' + detail : '');
  if (fatalEl) fatalEl.classList.add('show');
  document.body.classList.add('ready');
}
// safety net: if anything throws before the first frame, the page still becomes visible
setTimeout(() => document.body.classList.add('ready'), 4000);
if (!window.THREE) {
  fatal('无法加载 three.js', '这个页面需要联网加载 three.js r128，请检查网络后刷新');
  return;
}

const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// ------------------------------------------------------------------ launch options
//   ?wallpaper=1   boot straight into ambient mode (UI fades out, wakes on input)
//   ?fps=30        cap the frame rate — the single best power saving for a wall paper
//   ?dpr=1.25      override the device pixel ratio cap
//   ?q=low         start at reduced internal resolution
//   ?cycle=1       visible slow warm/cool day cycle instead of the subtle breathing
const QS = new URLSearchParams(location.search);
const WALLPAPER = QS.get('wallpaper') === '1' || QS.get('mode') === 'wallpaper';
const FPS_CAP = (() => {
  const v = parseFloat(QS.get('fps'));
  if (isFinite(v) && v >= 5) return v;
  return WALLPAPER ? 30 : 0;          // a wall paper has no reason to run at 60 Hz
})();

// ------------------------------------------------------------------ math
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand  = (a, b) => a + Math.random() * (b - a);
const TAU   = Math.PI * 2;

// ------------------------------------------------------------------ world consts (mirrored in GLSL)
const BEACH = { cx: -84, cz: -84, r: 70 };
const WORLD = { min: -110, size: 220 };

function shoreDist(x, z) { return Math.hypot(x - BEACH.cx, z - BEACH.cz) - BEACH.r; }
function bedH(x, z) {
  const sd = shoreDist(x, z);
  const bar = 0.8 * Math.exp(-Math.pow((sd - 22) / 9, 2));
  const sea = -0.02 - 1.0 * smooth(0, 9, sd) - 3.4 * smooth(0, 45, sd) - 16.0 * smooth(40, 150, sd) + bar;
  const land = -0.02 + 3.4 * smooth(0, 24, -sd);
  return sd < 0 ? land : sea;
}

// ------------------------------------------------------------------ renderer
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance', stencil: false });
} catch (err) {
  fatal('无法初始化 WebGL', '当前浏览器或显卡未启用 WebGL，请换用新版 Chrome / Edge 并开启硬件加速');
  return;
}
// A wall paper may run for days; when Chrome recycles the GPU context a reload is the only
// path three r128 can guarantee, because every uploaded buffer is gone with it.
let ctxLost = false;
canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  ctxLost = true;
  if (typeof stopLoop === 'function') stopLoop();
  fatal('渲染已中断', '图形上下文被回收，正在自动恢复');
  setTimeout(() => { if (ctxLost) location.reload(); }, 3500);
}, false);
canvas.addEventListener('webglcontextrestored', () => {
  ctxLost = false;
  if (fatalEl) fatalEl.classList.remove('show');
}, false);
renderer.setClearColor(0x0a3c44, 1);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.toneMapping = THREE.NoToneMapping;
renderer.autoClear = false;

let DPR = Math.min(window.devicePixelRatio || 1, 2);
{
  const v = parseFloat(QS.get('dpr'));
  if (isFinite(v) && v > 0) DPR = clamp(v, 0.5, 3);
}
let QUALITY = QS.get('q') === 'low' ? 0.8 : 1;   // adaptive multiplier
renderer.setPixelRatio(DPR);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 1, 420);
camera.position.set(0, 68, 34);
camera.lookAt(0, 0, -5);
camera.layers.enableAll();
scene.add(camera);

const SUN_DIR = new THREE.Vector3(-0.6, 0.53, -0.6).normalize();
const PALM_POS = new THREE.Vector3(-41, 0, -37);
PALM_POS.y = bedH(PALM_POS.x, PALM_POS.z);

// ------------------------------------------------------------------ shared uniforms
const U = {
  time:     { value: 0 },
  swell:    { value: 1 },
  rain:     { value: 0 },
  swirl:    { value: 0 },
  swirlPos: { value: new THREE.Vector2(-30, -34) },
  clarity:  { value: 1 },
  foam:     { value: 1 },
  sun:      { value: SUN_DIR.clone() },
  camPos:   { value: new THREE.Vector3() }
};

// ------------------------------------------------------------------ lights
const sun = new THREE.DirectionalLight(0xfff1d6, 1.95);
sun.position.copy(SUN_DIR).multiplyScalar(150).add(new THREE.Vector3(-55, 0, -40));
sun.target.position.set(-52, 0, -40);
scene.add(sun.target);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 1, far: 340 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0016;
sun.shadow.normalBias = 0.09;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0xcdeef4, 0x7d6b4e, 0.85);
scene.add(hemi);
const fill = new THREE.DirectionalLight(0x9fd8e6, 0.32);
fill.position.set(60, 40, 70);
scene.add(fill);

// ------------------------------------------------------------------ GLSL common
const GLSL_COMMON = `
const vec2  BC = vec2(-84.0, -84.0);
const float BR = 70.0;

float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec2  hash22(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)), d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 11.7; a *= 0.5; }
  return s;
}
float shoreDist(vec2 p){ return length(p - BC) - BR; }

float bedH(vec2 p){
  float sd = shoreDist(p);
  float bar = 0.8 * exp(-pow((sd - 22.0) / 9.0, 2.0));
  float sea = -0.02 - 1.0 * smoothstep(0.0, 9.0, sd) - 3.2 * smoothstep(0.0, 45.0, sd)
              - 16.0 * smoothstep(40.0, 150.0, sd) + bar;
  float land = -0.02 + 3.4 * smoothstep(0.0, 24.0, -sd);
  return sd < 0.0 ? land : sea;
}

// swash reach in metres inland from the still water line
float swashFront(vec2 p, float t){
  float u = dot(p - BC, vec2(0.7071, -0.7071));
  float T = 7.4;
  float ph = fract((t - u * 0.05) / T);
  float rise = smoothstep(0.0, 0.20, ph);
  float fall = 1.0 - smoothstep(0.20, 0.93, ph);
  float f = rise * fall;
  float T2 = T * 0.71;
  float ph2 = fract((t * 1.13 + 2.7 - u * 0.075) / T2);
  float f2 = smoothstep(0.0, 0.17, ph2) * (1.0 - smoothstep(0.17, 0.88, ph2));
  float amp = 0.78 + 0.42 * sin(u * 0.10 + 1.3);
  return (5.6 * f + 2.7 * f2) * amp;
}
`;

// ------------------------------------------------------------------ offscreen scene target (refraction + depth)
let rtScene = null;
function makeSceneRT(w, h) {
  const rt = new THREE.WebGLRenderTarget(w, h, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, type: THREE.UnsignedByteType,
    depthBuffer: true, stencilBuffer: false
  });
  rt.texture.encoding = THREE.sRGBEncoding;
  const dt = new THREE.DepthTexture(w, h);
  dt.type = THREE.UnsignedIntType;
  rt.depthTexture = dt;
  return rt;
}

// ------------------------------------------------------------------ height-field simulation (GPU)
const SIM = 256;
const simRT = [];
for (let i = 0; i < 2; i++) {
  simRT.push(new THREE.WebGLRenderTarget(SIM, SIM, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, type: THREE.HalfFloatType,

function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>

  for (let i = 0; i < SEG; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();

  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, side: THREE.DoubleSide });
  m.onBeforeCompile = function (sh) {
    sh.uniforms.uTime = U.time;
    sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>',
      `#include <begin_vertex>
       #ifdef USE_INSTANCING
         vec2 ip = instanceMatrix[3].xz;
       #else
         vec2 ip = vec2(0.0);
       #endif
       float hh = max(transformed.y, 0.0) / 1.55;
       float sway = sin(uTime * 1.25 + ip.x * 0.55 + ip.y * 0.33) * 0.55
                  + sin(uTime * 2.35 + ip.x * 1.4 + 1.7) * 0.18;
       transformed.x += sway * hh * hh * 0.42;
       transformed.z += cos(uTime * 1.05 + ip.y * 0.7) * hh * hh * 0.14;`
    );
  };

  const N = 1700;
  const mesh = new THREE.InstancedMesh(g, m, N);
  const dummy = new THREE.Object3D();
  const c = new THREE.Color();
  let n = 0, guard = 0;
  while (n < N && guard < N * 40) {
    guard++;
    const x = rand(-30, 95), z = rand(-75, 60);
    const sd = shoreDist(x, z);
    if (sd < 2.5 || sd > 62) continue;
    if (vnoise(x * 0.12 + 3, z * 0.12) < 0.42) continue;
    const y = bedH(x, z);
    if (y > -0.9 || y < -7.5) continue;
    const s = rand(0.55, 1.5);
    dummy.position.set(x, y - 0.05, z);
    dummy.rotation.set(rand(-0.1, 0.1), rand(0, TAU), rand(-0.12, 0.12));
    dummy.scale.set(rand(0.8, 1.5), s, rand(0.8, 1.3));
    dummy.updateMatrix();
    mesh.setMatrixAt(n, dummy.matrix);
    c.setHSL(0.26 + rand(-0.05, 0.05), 0.52, 0.34 + rand(-0.07, 0.14));
    mesh.setColorAt(n, c);
    n++;
  }
  mesh.count = n;
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true;
  mesh.layers.set(0);
  scene.add(mesh);
})();

function mergeGeos(list) {
  const posA = [], norA = [], uvA = [];
  list.forEach(g0 => {
    const g = g0.index ? g0.toNonIndexed() : g0;
    const p = g.attributes.position.array, nr = g.attributes.normal.array;
    const uv = g.attributes.uv ? g.attributes.uv.array : null;
    for (let i = 0; i < p.length; i++) posA.push(p[i]);
    for (let i = 0; i < nr.length; i++) norA.push(nr[i]);
    if (uv) for (let i = 0; i < uv.length; i++) uvA.push(uv[i]);
    else for (let i = 0; i < p.length / 3 * 2; i++) uvA.push(0);
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(posA, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(norA, 3));
  out.setAttribute('uv', new THREE.Float32BufferAttribute(uvA, 2));
  return out;
}
function coralHead(seed, r) {
  const parts = [];
  const lobes = 4 + Math.floor(hash2(seed, 3) * 4);
  for (let i = 0; i < lobes; i++) {
    const g = new THREE.IcosahedronGeometry(r * rand(0.42, 0.72), 2);
    const p = g.attributes.position;
    const a = rand(0, TAU), rr = r * rand(0.1, 0.65);
    const cx = Math.cos(a) * rr, cz = Math.sin(a) * rr, cy = r * rand(0.05, 0.45);
    for (let k = 0; k < p.count; k++) {
      let x = p.getX(k), y = p.getY(k), z = p.getZ(k);
      const len = Math.hypot(x, y, z) || 1;
      const n = 0.78 + 0.42 * vnoise(x * 3.2 + seed, z * 3.2 + y * 2.1);
      x = x / len * len * n; y = y / len * len * n * 0.86; z = z / len * len * n;
      p.setXYZ(k, x + cx, y + cy, z + cz);
    }
    g.computeVertexNormals();
    parts.push(g);
  }
  const g = mergeGeos(parts);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    if (p.getY(i) < 0) p.setY(i, p.getY(i) * 0.12);
  }
  g.computeVertexNormals();
  return g;
}
function boulderGeo(seed, r) {
  const g = new THREE.IcosahedronGeometry(r, 2);
  const p = g.attributes.position;
  for (let k = 0; k < p.count; k++) {
    const x = p.getX(k), y = p.getY(k), z = p.getZ(k);
    const n = 0.72 + 0.5 * vnoise(x * 1.6 + seed, z * 1.6 + y * 1.3) + 0.12 * vnoise(x * 5 + seed, y * 5);
    p.setXYZ(k, x * n, y * n * 0.72, z * n);
  }
  g.computeVertexNormals();
  return g;
}

const fronds = [];
(function buildPalm() {
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0.30, 2.7, -0.25),
    new THREE.Vector3(1.30, 5.4, -0.55),
    new THREE.Vector3(2.75, 8.0, -0.95)
  ]);
  const TS = 18, RS = 8, RAD = 0.34;
  const tg = new THREE.TubeGeometry(curve, TS, RAD, RS, false);
  const tp = tg.attributes.position;
  for (let i = 0; i <= TS; i++) {
    const t = i / TS;
    const c0 = curve.getPointAt(t);
    const k = lerp(1.15, 0.58, t);
    for (let j = 0; j <= RS; j++) {
      const idx = i * (RS + 1) + j;
      tp.setXYZ(idx, c0.x + (tp.getX(idx) - c0.x) * k, c0.y + (tp.getY(idx) - c0.y) * k, c0.z + (tp.getZ(idx) - c0.z) * k);
    }
  }
  tg.computeVertexNormals();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a7660, roughness: 0.97, metalness: 0 });
  const trunk = new THREE.Mesh(tg, trunkMat);
  trunk.castShadow = true; trunk.receiveShadow = true;
  palm.add(trunk);

  const crown = new THREE.Group();
  crown.position.copy(curve.getPointAt(1));
  palm.add(crown);

  // frond geometry
  function frondGeo(len, wid, droop) {
    const N = 24;
    const pos = [], col = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = t * len;
      const y = -droop * t * t * len * 0.55 + 0.10 * Math.sin(t * 3.0);
      const serr = 0.80 + 0.34 * Math.abs(Math.sin(t * 26.0 + len));
      const w = wid * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.62)), 0.95) * 0.5 * serr;
      const fold = 0.13 * w;
      pos.push(x, y - fold, -w, x, y + fold * 0.8, 0, x, y - fold, w);
      const sh = 0.55 + 0.45 * t;
      col.push(0.19 * sh, 0.30 * sh, 0.14 * sh, 0.26 * sh, 0.40 * sh, 0.18 * sh, 0.19 * sh, 0.30 * sh, 0.14 * sh);
    }
    for (let i = 0; i < N; i++) {
      const a = i * 3;
      idx.push(a, a + 1, a + 3, a + 1, a + 4, a + 3);
      idx.push(a + 1, a + 2, a + 4, a + 2, a + 5, a + 4);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    return g;
  }

  const frondMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, side: THREE.DoubleSide });
  const NF = 9;
  for (let i = 0; i < NF; i++) {
    const a = i / NF * TAU + rand(-0.1, 0.1);
    const piv = new THREE.Group();
    piv.rotation.y = a;
    piv.rotation.z = rand(-0.16, 0.10);
    const len = rand(3.6, 4.9), wid = rand(1.05, 1.45), droop = rand(0.55, 0.95);
    const f = new THREE.Mesh(frondGeo(len, wid, droop), frondMat);
    f.castShadow = true;
    piv.add(f);
    piv.userData.base = piv.rotation.z;
    piv.userData.ph = rand(0, TAU);
    piv.userData.amp = rand(0.035, 0.075);
    piv.userData.spd = rand(0.5, 0.95);
    crown.add(piv);
    fronds.push(piv);
  }
  // a couple of drooping dead fronds
  for (let i = 0; i < 2; i++) {
    const piv = new THREE.Group();
    piv.rotation.y = rand(0, TAU);
    piv.rotation.z = -0.55;
    const f = new THREE.Mesh(frondGeo(3.2, 0.9, 1.25), new THREE.MeshStandardMaterial({ color: 0x7a6440, roughness: 0.95, side: THREE.DoubleSide }));
    f.castShadow = true;
    piv.add(f);
    piv.userData.base = -0.55;
    piv.userData.ph = rand(0, TAU);
    piv.userData.amp = 0.02;
    piv.userData.spd = 0.4;
    crown.add(piv);
    fronds.push(piv);
  }
  // coconuts
  const coMat = new THREE.MeshStandardMaterial({ color: 0x5f4a2e, roughness: 0.9 });
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.19, 10, 8), coMat);
    s.position.set(Math.cos(i * 1.7) * 0.32, -0.28 - i * 0.02, Math.sin(i * 1.7) * 0.32);
    s.castShadow = true;
    crown.add(s);
  }
})();

// ---------------------------------------------------------------- ray geometry
function buildRay(cfg) {
  const NU = 26, NV = 8;
  const P = [], UVs = [], PT = [], SH = [], IDX = [];
  const halfSpan = cfg.span, chord = cfg.chord;
  const chordAt = u => chord * Math.pow(1 - Math.pow(Math.abs(u), cfg.taper), cfg.tipPow);
  const zc = u => -cfg.sweep * u * u * chord;

  for (let sh = 0; sh < 2; sh++) {
    const base = P.length / 3;
    for (let j = 0; j <= NV; j++) {
      for (let i = 0; i <= NU; i++) {
        const u = -1 + 2 * i / NU;
        const v = j / NV;
        const c = Math.max(0, chordAt(u));
        const z = zc(u) - c * 0.5 + v * c;
        const x = u * halfSpan;
        const th = cfg.thick * Math.pow(Math.max(0, 1 - Math.abs(u)), 1.1) * (1 - 0.5 * Math.pow((v - 0.55) * 2, 2));
        const y = (sh ? -1 : 1) * th * 0.5;
        P.push(x, y, z); UVs.push(u, v); PT.push(0); SH.push(sh);
      }
    }
    for (let j = 0; j < NV; j++) {
      for (let i = 0; i < NU; i++) {
        const a = base + j * (NU + 1) + i;
        if (sh === 0) IDX.push(a, a + NU + 1, a + 1, a + 1, a + NU + 1, a + NU + 2);
        else IDX.push(a, a + 1, a + NU + 1, a + 1, a + NU + 2, a + NU + 1);
      }
    }
  }

  // tail
  {
    const TN = 14;
    const z0 = zc(0) - chordAt(0) * 0.5;
    const base = P.length / 3;
    for (let k = 0; k <= TN; k++) {
      const t = k / TN;
      const w = cfg.tailW * (1 - 0.88 * t) * (1 + 0.25 * Math.sin(t * 9));
      const z = z0 - t * cfg.tailLen;
      P.push(-w, 0.02, z, w, 0.02, z);
      UVs.push(0, t, 0, t); PT.push(1, 1); SH.push(0, 0);
    }
    for (let k = 0; k < TN; k++) {
      const a = base + k * 2;
      IDX.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }

  // cephalic fins
  if (cfg.horns) {
    for (const sgn of [-1, 1]) {
      const hx = sgn * 0.10 * halfSpan, hz = zc(0) + chordAt(0) * 0.5;
      const base = P.length / 3;
      P.push(hx - 0.075, 0.03, hz, hx + 0.075, 0.03, hz, hx - 0.035, 0.05, hz + 0.52, hx + 0.035, 0.05, hz + 0.52);
      UVs.push(0, 1, 0, 1, 0, 1, 0, 1); PT.push(2, 2, 2, 2); SH.push(0, 0, 0, 0);
      IDX.push(base, base + 2, base + 1, base + 1, base + 2, base + 3);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(UVs, 2));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(PT, 1));
  g.setAttribute('aSheet', new THREE.Float32BufferAttribute(SH, 1));
  g.setIndex(IDX);
  g.computeVertexNormals();
  return g;
}

// ---------------------------------------------------------------- jelly geometry
function buildJelly(cfg) {
  const P = [], UVs = [], PT = [], INF = [], SIDE = [], IDX = [];
  const NU = 44, NV = 9;
  for (let sh = 0; sh < 2; sh++) {
    const rr = sh ? 0.90 : 1.0, off = sh ? -0.035 : 0.0;
    const base = P.length / 3;
    for (let j = 0; j <= NV; j++) {
      for (let i = 0; i <= NU; i++) {
        const rho = j / NV, th = i / NU;
        const phi = rho * cfg.phiMax;
        const scal = 1 + 0.045 * Math.sin(th * TAU * 11);
        const r = cfg.R * rr * Math.sin(phi) * scal;
        const y = cfg.H * (Math.cos(phi) - 0.42) + off;
        P.push(Math.cos(th * TAU) * r, y, Math.sin(th * TAU) * r);
        UVs.push(rho, th); PT.push(0); INF.push(0, 0, th * TAU, 0); SIDE.push(0);
      }
    }
    for (let j = 0; j < NV; j++) {
      for (let i = 0; i < NU; i++) {
        const a = base + j * (NU + 1) + i;
        IDX.push(a, a + NU + 1, a + 1, a + 1, a + NU + 1, a + NU + 2);
      }
    }
  }
  // tentacles
  const NT = cfg.tentacles, MT = 9;
  for (let k = 0; k < NT; k++) {
    const ang = (k / NT) * TAU + k * 0.7;
    const len = cfg.tentLen * (0.72 + 0.5 * hash2(k * 3.1, 7.7));
    const wid = cfg.tentW * (0.7 + 0.6 * hash2(k * 1.7, 2.3));
    const base = P.length / 3;
    for (let s = 0; s <= MT; s++) {
      const t = s / MT;
      P.push(Math.cos(ang) * cfg.R, -cfg.H * 0.42, Math.sin(ang) * cfg.R);
      P.push(Math.cos(ang) * cfg.R, -cfg.H * 0.42, Math.sin(ang) * cfg.R);
      UVs.push(ang / TAU, t); UVs.push(ang / TAU, t);
      PT.push(1, 1); INF.push(t, wid, ang, len, t, wid, ang, len); SIDE.push(-1, 1);
    }
    for (let s = 0; s < MT; s++) {
      const a = base + s * 2;
      IDX.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  // oral arms
  const NA = cfg.arms, MA = 8;
  for (let k = 0; k < NA; k++) {
    const ang = (k / NA) * TAU + 0.6;
    const len = cfg.armLen;
    const wid = cfg.armW;
    const base = P.length / 3;
    for (let s = 0; s <= MA; s++) {
      const t = s / MA;
      P.push(Math.cos(ang) * cfg.R * 0.35, -cfg.H * 0.42, Math.sin(ang) * cfg.R * 0.35);
      P.push(Math.cos(ang) * cfg.R * 0.35, -cfg.H * 0.42, Math.sin(ang) * cfg.R * 0.35);
      UVs.push(ang / TAU, t); UVs.push(ang / TAU, t);
      PT.push(2, 2); INF.push(t, wid, ang, len, t, wid, ang, len); SIDE.push(-1, 1);
    }
    for (let s = 0; s < MA; s++) {
      const a = base + s * 2;
      IDX.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(UVs, 2));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(PT, 1));
  g.setAttribute('aInfo', new THREE.Float32BufferAttribute(INF, 4));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(SIDE, 1));
  g.setIndex(IDX);
  g.computeVertexNormals();
  return g;
}

// ---------------------------------------------------------------- fish geometry
// One lofted tube for every swimmer (shark / clownfish / puffer). Nose points +z,
// the same convention as the rays, so yaw = atan2(vx, vz) works unchanged.
//   aPart 0 = body, 1 = pectorals, 2 = dorsal + caudal, 3 = spikes
//   aUV   u = lateral (-1 left .. 1 right),  v = 0 tail base .. 1 nose
function buildFish(cfg) {
  const P = [], UVs = [], PT = [], IDX = [];
  const NU = 24, NV = 18;
  const L = cfg.L, W = cfg.W, H = cfg.H;
  const zBase = -L * 0.5;
  const prof = cfg.round
    // puffer: a barrel that fills out in the middle and pinches into the tail peduncle
    ? v => Math.max(0.03, Math.pow(Math.sin(Math.PI * clamp(v, 0.02, 0.99)), 0.52))
    : v => {
      const head = Math.sin(Math.min(1, v / 0.52) * Math.PI * 0.5);
      const tail = 0.26 + 0.74 * smooth(0, 0.30, v);
      const snout = 1 - 0.82 * smooth(0.74, 1.0, v);
      return Math.max(0.02, head * tail * snout);
    };

  // ---- body : closed tube, no seam duplicates (u = sin(angle) stays continuous)
  for (let i = 0; i <= NU; i++) {
    const v = i / NU, r = prof(v), z = zBase + v * L;
    for (let j = 0; j < NV; j++) {
      const a = (j / NV) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      P.push(sa * W * r, ca * H * r * (ca > 0 ? 1.0 : 0.82), z);
      UVs.push(sa, v); PT.push(0);
    }
  }
  for (let i = 0; i < NU; i++) {
    for (let j = 0; j < NV; j++) {
      const a = i * NV + j, b = i * NV + ((j + 1) % NV);
      IDX.push(a, a + NV, b, b, a + NV, b + NV);
    }
  }
  // nose + tail caps
  for (let end = 0; end < 2; end++) {
    const ringBase = end ? 0 : NU * NV;
    const zc = end ? zBase : zBase + L;
    const centre = P.length / 3;
    P.push(0, 0, zc); UVs.push(0, end ? 0 : 1); PT.push(0);
    for (let j = 0; j < NV; j++) {
      const a = ringBase + j, b = ringBase + ((j + 1) % NV);
      if (end) IDX.push(centre, b, a); else IDX.push(centre, a, b);
    }
  }

  const tri = (p1, p2, p3, uv, part) => {
    const b = P.length / 3;
    P.push(p1[0], p1[1], p1[2], p2[0], p2[1], p2[2], p3[0], p3[1], p3[2]);
    UVs.push(uv[0], uv[1], uv[2], uv[3], uv[4], uv[5]);
    PT.push(part, part, part);
    IDX.push(b, b + 1, b + 2);
  };

  // ---- pectoral fins : flat paddles, swept back and tilted down a touch
  if (cfg.pect && cfg.pect[1] > 0.001) {
    const [at, len, sweep] = cfg.pect;
    const v = clamp(at, 0.05, 0.95), z0 = zBase + v * L, rx = W * prof(v) * 0.80;
    for (const s of [-1, 1]) {
      const tx = s * (W + len), tz = z0 - sweep;
      const r0 = [s * rx, -0.01, z0 + L * 0.10];
      const r1 = [s * rx, -0.01, z0 - L * 0.10];
      const t0 = [tx, -0.05, tz + L * 0.05];
      const t1 = [tx, -0.05, tz - L * 0.07];
      tri(r0, t0, r1, [0, 0.5, 1, 0.5, 0, 0.5], 1);
      tri(r1, t0, t1, [0, 0.5, 1, 0.5, 1, 0.5], 1);
    }
  }

  // ---- dorsal fin : vertical sheet on the spine (invisible for the puffer)
  if (cfg.dorsal && cfg.dorsal[2] > 0.001) {
    const [at, len, h] = cfg.dorsal;
    const v0 = clamp(at, 0.10, 0.92);
    const zs = zBase + v0 * L, ze = zs - len;
    const yS = H * prof(v0) * 0.92, yE = H * prof(clamp(v0 - len / L, 0.05, 0.95)) * 0.92;
    const zt = zs - len * 0.34, yt = yS + h;
    tri([0, yS, zs], [0, yt, zt], [0, yS, ze], [0, 0.5, 1.0, 0.5, 0, 0.5], 2);
    tri([0, yt, zt], [0, yE + h * 0.10, ze], [0, yS, ze], [1.0, 0.5, 0.45, 0.5, 0, 0.5], 2);
  }

  // ---- caudal fin : two lobes, spread horizontally so the fork reads from above
  if (cfg.caudal) {
    const [len, spread] = cfg.caudal;
    for (const s of [-1, 1]) {
      const tip = [s * spread, s * len * 0.11, zBase - len];
      const notch = [0, s * len * 0.03, zBase - len * 0.42];
      tri([0, 0, zBase], tip, notch, [0, 0.5, 1, 0.5, 0.3, 0.5], 2);
    }
  }

  // ---- spikes : porcupine puffer, distributed over the barrel body
  if (cfg.spikes) {
    const n = cfg.spikes, ez = L * 0.46;
    for (let k = 0; k < n; k++) {
      const lat = Math.asin(clamp(-0.62 + 1.24 * ((k + 0.5) / n), -1, 1));
      const lon = k * 2.39996;
      const nx = Math.cos(lat) * Math.cos(lon), ny = Math.sin(lat), nz = Math.cos(lat) * Math.sin(lon);
      const px = nx * W * 0.94, py = ny * H * 0.94, pz = nz * ez * 0.94;
      const sl = W * (0.22 + 0.13 * Math.abs(ny));
      const ax = px + nx * sl, ay = py + ny * sl, az = pz + nz * sl;
      const rad = 0.042 * L;
      // tangent basis around the normal
      const tx = -ny, ty = nx, tz = 0;
      const bx = ny * tz - nz * ty, by = nz * tx - nx * tz, bz = nx * ty - ny * tx;
      const uvY = (pz - zBase) / L;
      for (let s = 0; s < 3; s++) {
        const a1 = (s / 3) * TAU, a2 = ((s + 1) / 3) * TAU;
        const p1 = [px + (tx * Math.cos(a1) + bx * Math.sin(a1)) * rad,
                    py + (ty * Math.cos(a1) + by * Math.sin(a1)) * rad,
                    pz + (tz * Math.cos(a1) + bz * Math.sin(a1)) * rad];
        const p2 = [px + (tx * Math.cos(a2) + bx * Math.sin(a2)) * rad,
                    py + (ty * Math.cos(a2) + by * Math.sin(a2)) * rad,
                    pz + (tz * Math.cos(a2) + bz * Math.sin(a2)) * rad];
        tri(p1, [ax, ay, az], p2, [0, uvY, 1, uvY, 0, uvY], 3);
      }
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(UVs, 2));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(PT, 1));
  g.setIndex(IDX);
  g.computeVertexNormals();
  return g;
}

// ---------------------------------------------------------------- turtle geometry
// Carapace = two sheets (dome + plastron) like the rays, plus four paddles and a head.
//   aPart 0 = shell, 1 = front flippers, 2 = rear flippers, 3 = head
//   aUV   u = -1 left .. 1 right (0..1 across a flipper),  v = 0 tail .. 1 head
function buildTurtle(cfg) {
  const P = [], UVs = [], PT = [], SH = [], IDX = [];
  const NU = 26, NV = 9;
  const L = cfg.L, W = cfg.W, H = cfg.H;
  const halfW = v => W * Math.sqrt(Math.max(0, 1 - Math.pow((v - 0.56) / 0.60, 2))) * (0.82 + 0.18 * smooth(0, 0.45, v));

  for (let sh = 0; sh < 2; sh++) {
    const base = P.length / 3;
    for (let j = 0; j <= NV; j++) {
      for (let i = 0; i <= NU; i++) {
        const u = -1 + 2 * i / NU, v = j / NV;
        const hw = Math.max(0.02, halfW(v));
        const dome = Math.pow(Math.max(0, 1 - u * u), 0.62) * Math.pow(Math.sin(Math.PI * clamp(v, 0, 1)), 0.42);
        const y = sh ? -H * 0.30 : H * dome - H * 0.10;
        P.push(u * hw, y, (v - 0.5) * L);
        UVs.push(u, v); PT.push(0); SH.push(sh);
      }
    }
    for (let j = 0; j < NV; j++) {
      for (let i = 0; i < NU; i++) {
        const a = base + j * (NU + 1) + i;
        if (sh === 0) IDX.push(a, a + NU + 1, a + 1, a + 1, a + NU + 1, a + NU + 2);
        else IDX.push(a, a + 1, a + NU + 1, a + 1, a + NU + 2, a + NU + 1);
      }
    }
  }

  // ---- flippers : paddle sheets, narrow at the root, widest two-thirds out
  //      aUV.x runs 0 at the root to 1 at the tip
  const paddle = (rootX, rootZ, len, wid, dirZ, part) => {
    const sx = Math.sign(rootX) || 1;
    const tipX = rootX + sx * len, tipZ = rootZ + dirZ;
    const midX = rootX + sx * len * 0.58, midZ = rootZ + dirZ * 0.48;
    const b = P.length / 3;
    const V = [
      [rootX, 0.012, rootZ + wid * 0.20, 0, 0.5],
      [rootX, 0.012, rootZ - wid * 0.16, 0, 0.5],
      [midX, -0.004, midZ + wid * 0.50, 0.58, 0.5],
      [midX, -0.004, midZ - wid * 0.46, 0.58, 0.5],
      [tipX, -0.030, tipZ, 1, 0.5]
    ];
    V.forEach(vv => { P.push(vv[0], vv[1], vv[2]); UVs.push(vv[3], vv[4]); PT.push(part); SH.push(0); });
    IDX.push(b, b + 2, b + 1, b + 1, b + 2, b + 3, b + 2, b + 4, b + 3);
  };
  for (const s of [-1, 1]) {
    paddle(s * halfW(0.70) * 0.76, (0.70 - 0.5) * L, L * 0.55, L * 0.22, -L * 0.30, 1);
    paddle(s * halfW(0.16) * 0.74, (0.16 - 0.5) * L, L * 0.21, L * 0.13, -L * 0.26, 2);
  }

  // ---- head : blunt wedge in front of the shell
  {
    const b = P.length / 3;
    const z0 = L * 0.46, z1 = L * 0.5 + L * 0.22, hw = W * 0.23;
    const V = [
      [-hw, -0.035, z0, -1, 0.25], [hw, -0.035, z0, 1, 0.25],
      [-hw * 0.92, 0.080, z0, -0.92, 0.25], [hw * 0.92, 0.080, z0, 0.92, 0.25],
      [-hw * 0.52, 0.010, z1, -0.52, 1.0], [hw * 0.52, 0.010, z1, 0.52, 1.0]
    ];
    V.forEach(vv => { P.push(vv[0], vv[1], vv[2]); UVs.push(vv[3], vv[4]); PT.push(3); SH.push(0); });
    IDX.push(b + 2, b + 3, b + 5, b + 2, b + 5, b + 4,
             b + 0, b + 4, b + 5, b + 0, b + 5, b + 1,
             b + 0, b + 2, b + 4, b + 1, b + 5, b + 3);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setAttribute('aUV', new THREE.Float32BufferAttribute(UVs, 2));
  g.setAttribute('aPart', new THREE.Float32BufferAttribute(PT, 1));
  g.setAttribute('aSheet', new THREE.Float32BufferAttribute(SH, 1));
  g.setIndex(IDX);
  g.computeVertexNormals();
  return g;
}

// ---------------------------------------------------------------- shaders
const RAY_VS = `
  uniform float uTime, uRate, uAmpScale;
  attribute vec2 aUV;
  attribute float aPart, aSheet, aPhase, aAmp, aHold;
  attribute vec3 aVel;
  varying vec2 vUv;
  varying float vPart, vSheet, vHold;
  varying vec3 vWP, vN;
  void main(){
    vec3 pos = position;
    vec3 nrm = normal;
    float u = aUV.x;
    float sp = clamp(abs(u), 0.0, 1.0);
    float ph = uTime * uRate + aPhase;
    float amp = aAmp * uAmpScale;
    #ifdef FLAP
      pos.y += sin(ph) * amp * pow(sp, 1.75);
      pos.y -= (aUV.y - 0.55) * cos(ph) * amp * pow(sp, 2.3) * 0.55;
    #endif
    #ifdef UNDULATE
      pos.y += sin(u * 3.6 - ph) * amp * sp * 1.15;
      pos.y += sin(u * 6.0 - ph * 1.4) * amp * sp * sp * 0.35;
    #endif
    if (aPart > 0.5 && aPart < 1.5) {
      float t = aUV.y;
      pos.x += sin(uTime * 2.3 + aPhase - t * 3.8) * t * t * 0.42;
      pos.y -= t * 0.10 + sin(uTime * 1.7 + aPhase - t * 2.2) * t * 0.05;
    } else if (aPart > 1.5) {
      pos.y += sin(uTime * 5.0 + aPhase + aUV.x * 9.0) * 0.05 * aAmp;
    }
    vec4 wp = modelMatrix * instanceMatrix * vec4(pos, 1.0);
    vWP = wp.xyz;
    vN = normalize(mat3(instanceMatrix) * nrm);
    vUv = aUV; vPart = aPart; vSheet = aSheet; vHold = aHold;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const JELLY_VS = `
  uniform float uTime, uRate, uR, uH;
  attribute vec2 aUV;
  attribute vec4 aInfo;
  attribute float aPart, aSide, aPhase, aHold;
  attribute vec3 aVel;
  varying vec2 vUv;
  varying float vPart, vT, vHold, vPulse;
  varying vec3 vWP, vN;

  void main(){
    vec3 pos = position;
    vec3 nrm = normal;
    float aT = aInfo.x, aWidth = aInfo.y, aAng = aInfo.z, aLen = aInfo.w;
    float p = fract((uTime * uRate + aPhase) / 6.2831853);
    float pulse = exp(-p * 4.6) * smoothstep(0.0, 0.055, p) * 1.35;
    vPulse = pulse;

    if (aPart < 0.5) {
      float rho = aUV.x;
      float k = 1.0 - 0.20 * pulse * smoothstep(0.0, 0.95, rho);
      pos.xz *= k;
      pos.y += 0.13 * pulse * rho * rho * uH;
      pos.y += 0.012 * sin(aUV.y * 62.0 + uTime * 1.5) * rho;
    } else {
      float t = aT;
      vec3 rim = vec3(cos(aAng), 0.0, sin(aAng)) * uR;
      vec3 vLocal = aVel;
      float sp = length(vLocal);
      vec3 trail = normalize(vLocal + vec3(0.0, 0.001, 0.0));
      vec3 dir = normalize(mix(vec3(0.0, -1.0, 0.0), trail, clamp(sp * 1.6, 0.0, 0.72)));
      vec3 base = rim * (aPart > 1.5 ? 0.36 : 1.0);
      vec3 lp = base + dir * (t * aLen);
      float w1 = sin(uTime * 1.9 + aPhase + t * 4.2 + aAng * 1.7);
      float w2 = cos(uTime * 1.45 + aPhase + t * 3.1);
      lp.x += w1 * t * t * aLen * 0.20;
      lp.z += w2 * t * t * aLen * 0.16;
      lp.y -= t * t * 0.10;
      vec3 held = vec3(base.x * 0.55, -t * aLen * 1.06, base.z * 0.55);
      lp = mix(lp, held, aHold);
      pos = lp;
      nrm = normalize(vec3(0.0, 0.0, 1.0));
    }

    vec4 wp = modelMatrix * instanceMatrix * vec4(pos, 1.0);
    if (aPart > 0.5) {
      vec3 camRight = normalize(vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]));
      float w = aWidth * (1.0 + (aPart > 1.5 ? 0.5 * sin(aT * 9.0 + aAng * 3.0) : 0.0));
      wp.xyz += camRight * aSide * w * 0.5;
    }
    vWP = wp.xyz;
    vN = normalize(mat3(instanceMatrix) * nrm);
    vUv = aUV; vPart = aPart; vT = aT; vHold = aHold;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

// ---------------------------------------------------------------- swimmer + turtle vertex shaders
// Fish: a lateral wave runs nose→tail, growing toward the tail; fins flutter on top.
const FISH_VS = `
  uniform float uTime, uRate, uAmpScale, uLen, uSway;
  attribute vec2 aUV;
  attribute float aPart, aPhase, aAmp, aHold;
  attribute vec3 aVel;
  varying vec2 vUv;
  varying float vPart, vSheet, vHold;
  varying vec3 vWP, vN;

  void main(){
    vec3 pos = position;
    vec3 nrm = normal;
    float ph = uTime * uRate + aPhase;
    float v = aUV.y;                                  // 0 tail base .. 1 nose
    float k = pow(1.0 - v, 1.7);                      // the wave dies out at the head
    float sway = uLen * uSway * aAmp * uAmpScale;
    pos.x += sin(ph - v * 4.6) * k * sway;
    pos.y += sin(ph * 0.5 + 1.7) * 0.010 * uLen;
    if (aPart > 0.5 && aPart < 1.5) {                 // pectoral flutter
      pos.y += sin(uTime * uRate * 2.4 + aPhase + aUV.x * 2.2) * 0.028 * uLen;
    }
    // a held fish wriggles harder
    pos.x += sin(uTime * 8.5 + aPhase + v * 6.0) * aHold * uLen * 0.045;

    vec4 wp = modelMatrix * instanceMatrix * vec4(pos, 1.0);
    vWP = wp.xyz;
    vN = normalize(mat3(instanceMatrix) * nrm);
    vUv = aUV; vPart = aPart; vSheet = 0.0; vHold = aHold;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

// Turtle: the two front paddles row together, the rear pair only trims, the head looks around.
const TURTLE_VS = `
  uniform float uTime, uRate, uAmpScale, uLen;
  attribute vec2 aUV;
  attribute float aPart, aSheet, aPhase, aAmp, aHold;
  attribute vec3 aVel;
  varying vec2 vUv;
  varying float vPart, vSheet, vHold;
  varying vec3 vWP, vN;

  void main(){
    vec3 pos = position;
    vec3 nrm = normal;
    float ph = uTime * uRate + aPhase;
    float amp = aAmp * uAmpScale * (1.0 + aHold * 1.6);
    if (aPart > 0.5 && aPart < 1.5) {                 // front flippers row
      float t = aUV.x;
      pos.y += sin(ph) * amp * 0.34 * pow(t, 1.35);
      pos.z += cos(ph) * amp * 0.09 * pow(t, 1.7);
    } else if (aPart > 1.5 && aPart < 2.5) {           // rear flippers trim
      pos.y += sin(ph * 0.85 + 1.2) * amp * 0.09 * aUV.x;
    } else if (aPart > 2.5) {                          // head
      pos.x += sin(uTime * 0.62 + aPhase) * 0.05 * aUV.x;
      pos.y += sin(uTime * 0.88 + aPhase) * 0.012;
    }
    pos.y += sin(ph * 0.42) * 0.006 * uLen;

    vec4 wp = modelMatrix * instanceMatrix * vec4(pos, 1.0);
    vWP = wp.xyz;
    vN = normalize(mat3(instanceMatrix) * nrm);
    vUv = aUV; vPart = aPart; vSheet = aSheet; vHold = aHold;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

// shared creature lighting / water column — keep exactly one copy of these
const CREATURE_LIGHT = `
  uniform float uTime;
  uniform vec3 uSun;

  float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }

  vec3 shade(vec3 base, vec3 N, vec3 V, float gloss){
    float ndl = max(dot(N, uSun), 0.0);
    float ndv = max(dot(N, V), 0.0);
    float fres = pow(1.0 - ndv, 2.4);
    vec3 col = base * (0.34 + 0.86 * ndl);
    // uSun is a DIRECTION, so the highlight needs its own colour — adding uSun here
    // painted a green blob on every broad, smooth surface (puffer, turtle shell).
    col += vec3(1.0, 0.97, 0.90) * pow(max(dot(reflect(-uSun, N), V), 0.0), 26.0) * gloss;
    col += vec3(0.30, 0.52, 0.60) * fres * 0.30;
    col += base * fres * 0.30;
    return col;
  }

  // everything under the surface is viewed through the water column
  vec3 throughWater(vec3 c, float y){
    float d = max(-y, 0.0);
    vec3 ab = exp(-vec3(0.155, 0.042, 0.030) * d * 1.7);
    float sc = (1.0 - exp(-d * 0.085)) * 0.32;
    return c * ab + vec3(0.030, 0.150, 0.170) * sc;
  }
`;

`;

const JELLY_FS = `
  precision highp float;
  uniform float uTime;
  uniform vec3 uSun;
  uniform vec3 uTint, uAccent;
  uniform float uKind;
  varying vec2 vUv;
  varying float vPart, vT, vHold, vPulse;
  varying vec3 vWP, vN;

  void main(){
    vec3 N = normalize(vN);
    if (!gl_FrontFacing) N = -N;
    vec3 V = normalize(cameraPosition - vWP);
    float ndv = abs(dot(N, V));
    float fres = pow(1.0 - ndv, 2.0);

    vec3 base = uTint;
    float alpha = 0.30 + 0.55 * fres;
    float glow = 0.0;

    if (vPart < 0.5) {
      float rho = vUv.x, th = vUv.y;
      float ang = th * 6.2831853;
      if (uKind < 0.5) {
        // moon jelly : four pink gonad horseshoes + radial canals
        float da = mod(ang + 0.7853981, 1.5707963) - 0.7853981;
        vec2 gp = vec2((rho - 0.52) * 2.1, da * 1.25);
        float ringD = abs(length(gp) - 0.26);
        float horse = smoothstep(0.075, 0.0, ringD) * (1.0 - smoothstep(0.10, 0.42, abs(da)));
        base = mix(base, vec3(0.93, 0.52, 0.62), horse * 0.85);
        float canal = smoothstep(0.012, 0.0, abs(fract(th * 16.0) - 0.5) * 0.12) ;
        base = mix(base, vec3(0.72, 0.60, 0.68), canal * smoothstep(0.15, 0.6, rho) * 0.7);
        float rim = smoothstep(0.90, 1.0, rho);
        base = mix(base, vec3(0.86, 0.80, 0.90), rim * 0.55);
        alpha = 0.24 + 0.62 * fres + rim * 0.25;
        glow = 0.04;
      } else {
        // sea nettle : amber bell with rust stripes
        float stripe = smoothstep(0.55, 0.95, sin(ang * 13.0 + 1.0));
        base = mix(vec3(0.92, 0.62, 0.28), vec3(0.55, 0.24, 0.12), stripe * 0.75);
        base = mix(base, vec3(0.98, 0.80, 0.55), smoothstep(0.55, 0.95, rho) * 0.55);
        base *= 0.85 + 0.3 * smoothstep(0.0, 0.5, rho);
        alpha = 0.34 + 0.55 * fres;
        glow = 0.05;
      }
    } else if (vPart > 0.5 && vPart < 1.5) {
      base = mix(vec3(0.93, 0.94, 0.97), uAccent, 0.25);
      alpha = (1.0 - vT) * 0.55 * (0.4 + 0.6 * fres) + 0.05;
      alpha *= 1.0 - smoothstep(0.75, 1.0, vT) * 0.7;
    } else {
      // oral arms : frilly cream
      base = uKind < 0.5 ? vec3(0.88, 0.82, 0.88) : vec3(0.98, 0.91, 0.76);
      float frill = 0.6 + 0.4 * sin(vT * 22.0);
      alpha = (0.55 + 0.35 * fres) * (1.0 - vT * 0.55) * frill;
      glow = 0.03;
    }

    float ndl = max(dot(N, uSun), 0.0);
    vec3 col = base * (0.45 + 0.55 * ndl) + vec3(glow) * (0.6 + 0.6 * vPulse);
    col += vec3(0.55, 0.75, 0.85) * fres * 0.35;
    {
      float wd = max(-vWP.y, 0.0);
      vec3 ab = exp(-vec3(0.145, 0.040, 0.028) * wd * 1.7);
      col = col * ab + vec3(0.030, 0.150, 0.170) * (1.0 - exp(-wd * 0.085)) * 0.28;
    }
    col *= 1.0 - 0.18 * smoothstep(0.0, 1.0, vT) * step(1.5, vPart);

    gl_FragColor = vec4(pow(max(col, 0.0), vec3(1.0 / 2.2)), clamp(alpha, 0.0, 0.95));
  }
`;

function instMaterial(vs, fs, extra, opts) {
  const m = new THREE.ShaderMaterial(Object.assign({
    uniforms: Object.assign({
      uTime: U.time,
      uSun: { value: new THREE.Vector3().copy(SUN_DIR).normalize() },
      uRate: { value: 2.5 },
      uAmpScale: { value: 1.0 }
    }, extra || {}),
    vertexShader: vs,
    fragmentShader: fs
  }, opts || {}));
  return m;
}

SPECIES.manta.phiMax = 0;

function makeRayRig(key) {
  const cfg = SPECIES[key];
  const geo = buildRay(cfg);
  const cap = 16;
  const fsSrc = key === 'manta' ? MANTA_FS : (key === 'eagle' ? EAGLE_FS : STING_FS);
  const mkMat = under => {
    const m = instMaterial(RAY_VS, fsSrc, {
      uRate: { value: cfg.flapRate },
      uAmpScale: { value: 1 }
    }, { side: THREE.DoubleSide, transparent: false });
    m.defines = key === 'sting' ? { UNDULATE: '' } : { FLAP: '' };
    if (under) { m.depthTest = true; m.depthWrite = true; }    // water writes no depth, so the body occludes its own belly
    return m;
  };
  const attach = (g, layer, mat) => {
    g.setAttribute('aPhase', new THREE.InstancedBufferAttribute(new Float32Array(cap), 1));
    g.setAttribute('aAmp', new THREE.InstancedBufferAttribute(new Float32Array(cap), 1));
    g.setAttribute('aHold', new THREE.InstancedBufferAttribute(new Float32Array(cap), 1));
    g.setAttribute('aVel', new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3));
    const mesh = new THREE.InstancedMesh(g, mat, cap);
    mesh.items = [];
    mesh.frustumCulled = false;
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.count = 0;
    mesh.layers.set(layer);
    return mesh;
  };
  const gU = geo, gA = geo.clone();
  const matU = mkMat(true), matA = mkMat(false);
  const mUnder = attach(gU, 1, matU);
  mUnder.renderOrder = 4;
  const mAir = attach(gA, 1, matA);
  mAir.renderOrder = 8;
  scene.add(mUnder); scene.add(mAir);
  rigs[key] = { cfg, geoU: gU, geoA: gA, mat: matA, matU, matA, under: mUnder, air: mAir, cap, items: [], kind: 'ray' };
}

// ---------------------------------------------------------------- creature state
const creatures = [];
let creatureUid = 1;

function spawnCreature(kind, x, z, y, opts) {
  const rig = rigs[kind];
  if (!rig) return null;
  if (creatures.length >= CREATURE_CAP) { toast('海中最多容纳 48 只生物'); return null; }
  const cfg = rig.cfg;
  const c = {
    id: creatureUid++, kind, rig,
    p: new THREE.Vector3(x, y !== undefined ? y : -2, z),
    v: new THREE.Vector3(rand(-0.4, 0.4), 0, rand(-0.4, 0.4)),
    yaw: rand(0, TAU), roll: 0, pitch: 0,
    phase: rand(0, TAU), amp: cfg.amp, size: rand(0.9, 1.12),
    state: 'swim', t: 0, age: 0,
    target: new THREE.Vector3(),
    wander: 0, flee: 0, breachCd: rand(6, 24), wakeCd: 0,
    depthPref: rand(cfg.dep[0], cfg.dep[1]),
    scale: 1, opacity: 1,
    arcFrom: null, arcTo: null, arcT: 0, arcDur: 1,
    spin: 0, dripCd: 0, sunk: false,
    puff: 1, surfCd: rand(16, 40), surfCd2: 0
  };
  // start position above the seabed
  c.p.y = Math.max(c.p.y, bedH(c.p.x, c.p.z) + 0.8);
  pickWander(c);
  creatures.push(c);
  rig.items.push(c);
  updateCounter();
  return c;
}

function pickWander(c) {
  const deep = c.rig.cfg.deep;
  for (let i = 0; i < 24; i++) {
    const x = rand(-42, 72), z = rand(-56, 34);
    if (shoreDist(x, z) < 6) continue;
    if (bedH(x, z) > (deep ? -2.2 : -0.9)) continue;   // big fish keep to open water
    c.target.set(x, 0, z);
    return;
  }
  c.target.set(10, 0, 0);
}

const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const _quat = new THREE.Quaternion();
const _mat4 = new THREE.Matrix4();
const _sc = new THREE.Vector3();
const _tmpV = new THREE.Vector3();

function currentAt(p, t, out) {
  out.set(
    0.30 * Math.sin(p.z * 0.045 + t * 0.07) + 0.16 * Math.cos(p.x * 0.031 + 1.3),
    0,
    0.30 * Math.cos(p.x * 0.041 - t * 0.06) + 0.14 * Math.sin(p.z * 0.037)
  );
  return out;
}

function updateCreature(c, dt, time) {
  const cfg = c.rig.cfg;
  c.age += dt;
  const kind = c.rig.kind;
  const isJelly = kind === 'jelly';
  const isTurtle = kind === 'turtle';
  const isFish = kind === 'fish';

  if (c.state === 'held') {
    c.t += dt;
    c.p.y = lerp(c.p.y, c.holdY, 1 - Math.pow(0.001, dt));
    c.v.set(0, 0, 0);
  } else if (c.state === 'arc' || c.state === 'fall') {
    c.t += dt;
    if (c.state === 'arc') {
      const k = clamp(c.t / c.arcDur, 0, 1);
      c.p.lerpVectors(c.arcFrom, c.arcTo, k);
      c.p.y += Math.sin(k * Math.PI) * c.arcH;
      c.spin += dt * (REDUCED ? 1.6 : 6.5);
      c.pitch = -c.spin;
      c.roll = Math.sin(c.spin * 0.7) * (REDUCED ? 0.12 : 0.4);
      if (k >= 1) { c.state = 'swim'; c.pitch = 0; c.roll = 0; c.spin = 0; splash(c); }
    } else {
      c.v.y -= 12 * dt;
      c.p.addScaledVector(c.v, dt);
      c.pitch = clamp(-c.v.y * 0.10, -0.9, 0.9);
      c.spin += dt * (REDUCED ? 0.8 : 2.0);
      c.roll = Math.sin(c.spin) * (REDUCED ? 0.1 : 0.3);
      if (c.p.y <= 0.05) { c.p.y = 0.05; c.state = 'swim'; c.pitch = 0; c.roll = 0; splash(c); }
    }
  } else if (c.state === 'breach') {
    c.t += dt;
    c.v.y -= 11 * dt;
    c.p.addScaledVector(c.v, dt);
    c.spin += dt * 5.2;
    c.pitch = c.spin;
    c.roll = Math.sin(c.spin * 0.8) * 0.55;
    if (c.p.y < 0.1 && c.t > 0.15) {
      c.p.y = 0.1; c.state = 'swim'; c.pitch = 0; c.roll = 0; c.spin = 0;
      splash(c, 1.4); c.breachCd = rand(14, 40);
    }
  } else if (c.state === 'surf') {
    // turtle taking a breath: rise, hang at the surface, then sink back to its depth
    c.t += dt;
    if (c.t < 0.85) { c.p.y += 1.5 * dt; c.pitch = lerp(c.pitch, 0.27, Math.min(1, dt * 3)); }
    else if (c.t < 1.9) { c.p.y = lerp(c.p.y, -0.02, Math.min(1, dt * 4)); c.pitch = lerp(c.pitch, 0.05, Math.min(1, dt * 3)); }
    else { c.p.y -= 0.95 * dt; c.pitch = lerp(c.pitch, -0.17, Math.min(1, dt * 2.5)); }
    c.p.x += c.v.x * dt * 0.5; c.p.z += c.v.z * dt * 0.5;
    c.v.multiplyScalar(1 - Math.min(1, dt * 1.1));
    if (!c.gasped && c.p.y > -0.14) {
      c.gasped = true;
      addRing(c.p.x, c.p.z, cfg.rad * 1.7, 0.30, 1.9);
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * TAU;
        pAir.emit(c.p.x + Math.cos(a) * 0.25, 0.06, c.p.z + Math.sin(a) * 0.25,
          Math.cos(a) * 0.3, rand(0.5, 1.1), Math.sin(a) * 0.3, 0.8, rand(0.04, 0.08), 0.96, 0.99, 1.0, 0);
      }
      playPlink(0.03);
    }
    if (c.t > 2.4 && c.p.y <= c.depthPref + 0.12) { c.state = 'swim'; c.pitch = 0; }
  } else {
    const cur = currentAt(c.p, time, _tmpV);
    const toT = _tmpV2.copy(c.target).sub(c.p); toT.y = 0;
    const dist = toT.length();
    if (dist < 3.5 || c.wander <= 0) { pickWander(c); c.wander = rand(6, 14); }
    c.wander -= dt;
    toT.normalize();

    // schooling: little fish drift toward their own kind so a tank of clownfish clumps
    if (cfg.school) {
      let sx = 0, sz = 0, sn = 0;
      for (let i = 0; i < creatures.length; i++) {
        const o = creatures[i];
        if (o === c || o.kind !== c.kind) continue;
        const dx = o.p.x - c.p.x, dz = o.p.z - c.p.z;
        if (dx * dx + dz * dz < cfg.school * cfg.school) { sx += dx; sz += dz; sn++; }
      }
      if (sn) {
        const l = Math.hypot(sx, sz) || 1;
        toT.x = toT.x * 0.55 + (sx / l) * 0.45;
        toT.z = toT.z * 0.55 + (sz / l) * 0.45;
        const l2 = Math.hypot(toT.x, toT.z) || 1;
        toT.x /= l2; toT.z /= l2;
      }
    }

    let ax = toT.x, az = toT.z, accel = isJelly ? 0.55 : 1.5;
    if (c.flee > 0) {
      c.flee -= dt;
      ax = c.fleeDir.x; az = c.fleeDir.z;
      accel = isJelly ? 1.6 : 4.2;
    }
    c.v.x += ax * accel * dt + cur.x * dt * 0.55;
    c.v.z += az * accel * dt + cur.z * dt * 0.55;

    // whirlpool
    if (U.swirl.value > 0.05) {
      const dx = c.p.x - U.swirlPos.value.x, dz = c.p.z - U.swirlPos.value.y;
      const r = Math.hypot(dx, dz) + 0.01;
      if (r < 26) {
        const f = (1 - r / 26) * U.swirl.value;
        c.v.x += (-dz / r * 3.2 - dx / r * 1.4) * f * dt * 2.2;
        c.v.z += (dx / r * 3.2 - dz / r * 1.4) * f * dt * 2.2;
      }
    }

    // land avoidance
    const sd = shoreDist(c.p.x, c.p.z);
    if (sd < 5) {
      const nx = c.p.x - BEACH.cx, nz = c.p.z - BEACH.cz;
      const l = Math.hypot(nx, nz) || 1;
      c.v.x += nx / l * 3.6 * dt * (1 - sd / 5) * 4;
      c.v.z += nz / l * 3.6 * dt * (1 - sd / 5) * 4;
    }
    // soft bounds
    if (c.p.x < -55) c.v.x += 2.2 * dt * 3;
    if (c.p.x > 88) c.v.x -= 2.2 * dt * 3;
    if (c.p.z < -70) c.v.z += 2.2 * dt * 3;
    if (c.p.z > 48) c.v.z -= 2.2 * dt * 3;

    const maxSp = (c.flee > 0 ? cfg.speed * 2.3 : cfg.speed) * (isJelly ? 1.0 : 1.0);
    const sp = Math.hypot(c.v.x, c.v.z);
    if (sp > maxSp) { c.v.x *= maxSp / sp; c.v.z *= maxSp / sp; }
    c.v.x *= 1 - 0.6 * dt; c.v.z *= 1 - 0.6 * dt;

    // depth keeping
    const bed = bedH(c.p.x, c.p.z);
    let wantY = c.depthPref;
    if (cfg.dep[0] > -1.2) wantY = bed + 0.55;                       // stingrays hug the floor
    wantY = Math.max(wantY, bed + (isJelly ? 0.8 : 0.55));
    wantY = Math.min(wantY, -0.55);
    c.p.y += (wantY - c.p.y) * Math.min(1, dt * 0.55);

    c.p.x += c.v.x * dt;
    c.p.z += c.v.z * dt;

    const tgtYaw = Math.atan2(c.v.x, c.v.z);
    let d = ((tgtYaw - c.yaw + Math.PI * 3) % TAU) - Math.PI;
    const turn = d * Math.min(1, dt * (isJelly ? 2.0 : 3.4));
    c.yaw += turn;
    c.roll = lerp(c.roll, clamp(-turn * 9.0, -0.55, 0.55), Math.min(1, dt * 6));
    c.pitch = lerp(c.pitch, isJelly ? 0 : clamp(-c.v.y * 0.4, -0.35, 0.35), Math.min(1, dt * 4));

    // breach: only the rays somersault out of the water
    if (kind === 'ray') {
      c.breachCd -= dt;
      if (!REDUCED && c.breachCd <= 0 && c.p.y > -2.4 && c.flee <= 0) {
        c.breachCd = rand(16, 46);
        if (Math.random() < 0.5) {
          c.state = 'breach'; c.t = 0; c.spin = 0;
          c.v.y = rand(6.2, 9.0);
          c.v.x *= 2.4; c.v.z *= 2.4;
        }
      }
    }
    // turtles come up for air every so often
    if (cfg.surf) {
      c.surfCd -= dt;
      if (c.surfCd <= 0) {
        c.surfCd = rand(24, 52);
        if (c.flee <= 0 && c.p.y < -0.4) { c.state = 'surf'; c.t = 0; c.gasped = false; }
      }
    }
    c.amp = lerp(c.amp, cfg.amp * (c.flee > 0 ? 1.9 : 1.0), Math.min(1, dt * 3));

    // wake rings near the surface (small fish barely disturb it)
    c.wakeCd -= dt;
    if (!isJelly && c.p.y > -1.5 && c.wakeCd < 0) {
      c.wakeCd = rand(0.45, 0.9) * (kind === 'fish' ? 2.6 : 1);
      addRing(c.p.x, c.p.z, cfg.rad * (0.7 + Math.random() * 0.5), kind === 'fish' ? 0.28 : 0.55, 1.9);
    }
  }

  // a startled puffer inflates and deflates again
  if (cfg.puff) {
    const want = (c.flee > 0 || c.state === 'held') ? cfg.puff : 1;
    c.puff = lerp(c.puff, want, Math.min(1, dt * 2.0));
  }

  // ------- instance write
  const above = c.p.y > 0.02 || c.state === 'held' || c.state === 'arc' || c.state === 'breach'
             || (c.state === 'surf' && c.p.y > -0.25);
  const rig = c.rig;
  const bucket = above ? 'air' : 'under';
  c.bucket = bucket;
  const arr = rig[bucket].items;
  if (arr.indexOf(c) < 0) arr.push(c);
  const idx = arr.indexOf(c);
  if (idx < 0 || idx >= rig.cap) return;

  const s = c.size * (c.puff || 1);
  _euler.set(c.pitch, c.yaw, c.roll, 'YXZ');
  _quat.setFromEuler(_euler);
  _sc.set(s, s, s);
  _mat4.compose(c.p, _quat, _sc);
  const mesh = rig[bucket];
  mesh.setMatrixAt(idx, _mat4);

  const gGeo = bucket === 'under' ? rig.geoU : rig.geoA;
  const ph = gGeo.attributes.aPhase, am = gGeo.attributes.aAmp;
  const hd = gGeo.attributes.aHold, vl = gGeo.attributes.aVel;
  if (ph) { ph.array[idx] = c.phase; ph.needsUpdate = true; }
  if (am) {
    const ampNow = rig.kind === 'jelly' ? 1.0 : c.amp;
    am.array[idx] = ampNow; am.needsUpdate = true;
  }
  if (hd) { hd.array[idx] = c.state === 'held' ? 1 : 0; hd.needsUpdate = true; }
  if (vl) {
    // velocity in local space for ribbon trailing
    const cs = Math.cos(-c.yaw), sn = Math.sin(-c.yaw);
    vl.array[idx * 3] = c.v.x * cs - c.v.z * sn;
    vl.array[idx * 3 + 1] = c.v.y;
    vl.array[idx * 3 + 2] = c.v.x * sn + c.v.z * cs;
    vl.needsUpdate = true;
  }
}

const _tmpV2 = new THREE.Vector3();

// ---------------------------------------------------------------- creature shadow decals
const cShadow = (function () {
  const g = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  const m = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.5, color: 0x0b2a22 });
  const im = new THREE.InstancedMesh(g, m, CREATURE_CAP);
  im.frustumCulled = false;
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  im.count = 0;
  im.layers.set(0);
  im.renderOrder = 1;
  scene.add(im);
  return im;
})();

function updateCreatureShadows() {
  const d = new THREE.Object3D();
  let n = 0;
  for (let i = 0; i < creatures.length; i++) {
    const c = creatures[i];
    if (c.state === 'held' || c.p.y > 0.2) continue;
    if (c.bucket !== 'under') continue;
    const bed = bedH(c.p.x, c.p.z);
    const hgt = clamp(-c.p.y, 0, 12);
    const spread = 1 + hgt * 0.09;
    const r = (c.rig.cfg.rad || 1) * c.size * 2.0 * spread;
    d.position.set(c.p.x + hgt * 0.35, bed + 0.08, c.p.z + hgt * 0.35);
    d.rotation.set(0, c.yaw, 0);
    d.scale.set(r * 1.25, 1, r);
    d.updateMatrix();
    cShadow.setMatrixAt(n++, d.matrix);
  }
  cShadow.count = n;
  cShadow.instanceMatrix.needsUpdate = true;
}

// ---------------------------------------------------------------- ambient population
function seedLife() {
  const starts = [
    ['manta', 12, -14], ['manta', 30, 6], ['eagle', -6, 6], ['eagle', 22, -24],
    ['moon', 2, -2], ['moon', 16, 14], ['moon', -12, -8],
    ['nettle', 26, -4], ['nettle', 8, 18],
    ['shark', 44, -26], ['turtle', 4, 10], ['turtle', 26, 20],
    ['puffer', -2, 2], ['puffer', 18, -6]
  ];
  starts.forEach(([k, x, z]) => {
    const c = spawnCreature(k, x + rand(-1.5, 1.5), z + rand(-1.5, 1.5), rand(-4, -1.5));
    if (c) c.phase = rand(0, TAU);
  });
  // a little school of clownfish, plus the stingrays that hug the sand
  for (let i = 0; i < 5; i++) {
    const sx = 8 + rand(-2.4, 2.4), sz = 6 + rand(-2.4, 2.4);
    if (spawnCreature('clown', sx, sz, rand(-1.4, -0.8))) { /* clustered by cfg.school */ }
  }
  for (let i = 0; i < 3; i++) {
    const sx = rand(-8, 30), sz = rand(-18, 10);
    spawnCreature('sting', sx, sz, bedH(sx, sz) + 0.45);
  }
}

function beginCreatureFrame() {
  for (const k in rigs) { rigs[k].under.items.length = 0; rigs[k].air.items.length = 0; }
}
function endCreatureFrame() {
  for (const k in rigs) {
    const r = rigs[k];
    r.under.count = Math.min(r.cap, r.under.items.length);
    r.air.count = Math.min(r.cap, r.air.items.length);
    r.under.instanceMatrix.needsUpdate = true;
    r.air.instanceMatrix.needsUpdate = true;
  }
}

// ==================================================================
//  FOAM RINGS
// ==================================================================
const RING_MAX = 72;
const ringGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
ringGeo.setAttribute('aStart', new THREE.InstancedBufferAttribute(new Float32Array(RING_MAX), 1));
ringGeo.setAttribute('aLife', new THREE.InstancedBufferAttribute(new Float32Array(RING_MAX), 1));
ringGeo.setAttribute('aStr', new THREE.InstancedBufferAttribute(new Float32Array(RING_MAX), 1));
const ringMat = new THREE.ShaderMaterial({
  uniforms: { uTime: U.time },
  vertexShader: `
    uniform float uTime;
    attribute float aStart, aLife, aStr;
    varying vec2 vUv; varying float vAge, vStr;
    void main(){
      vUv = uv;
      vAge = (uTime - aStart) / max(aLife, 0.001);
      vStr = aStr;
      gl_Position = projectionMatrix * viewMatrix * modelMatrix * instanceMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv; varying float vAge, vStr;
    void main(){
      if (vAge < 0.0 || vAge > 1.0) discard;
      vec2 p = vUv * 2.0 - 1.0;
      float r = length(p);
      float rad = mix(0.10, 0.94, pow(vAge, 0.62));
      float ring = smoothstep(0.075, 0.0, abs(r - rad));
      float inner = smoothstep(0.95, 0.32, r) * 0.10;
      float ang = atan(p.y, p.x);
      float lace = 0.62 + 0.38 * sin(ang * 9.0 + vAge * 6.0);
      float a = (ring * lace + inner) * (1.0 - vAge) * vStr;
      gl_FragColor = vec4(vec3(0.96, 0.99, 1.0), clamp(a, 0.0, 0.9));
    }
  `,
  transparent: true, depthWrite: false, side: THREE.DoubleSide
});
const ringMesh = new THREE.InstancedMesh(ringGeo, ringMat, RING_MAX);
ringMesh.layers.set(1);
ringMesh.frustumCulled = false;
ringMesh.renderOrder = 6;
ringMesh.count = RING_MAX;
scene.add(ringMesh);
const ringSlots = [];
for (let i = 0; i < RING_MAX; i++) ringSlots.push({ start: -999, life: 1, size: 1 });
let ringCursor = 0;
const _ringObj = new THREE.Object3D();
(function initRings() {
  for (let i = 0; i < RING_MAX; i++) {
    _ringObj.position.set(0, -50, 0); _ringObj.scale.set(0.001, 1, 0.001);
    _ringObj.updateMatrix(); ringMesh.setMatrixAt(i, _ringObj.matrix);
  }
  ringMesh.instanceMatrix.needsUpdate = true;
})();

function addRing(x, z, size, strength, life) {
  const i = ringCursor++ % RING_MAX;
  ringSlots[i] = { start: U.time.value, life: life, size: size };
  _ringObj.position.set(x, 0.06, z);
  _ringObj.scale.set(size, 1, size);
  _ringObj.rotation.set(0, Math.random() * TAU, 0);
  _ringObj.updateMatrix();
  ringMesh.setMatrixAt(i, _ringObj.matrix);
  ringMesh.instanceMatrix.needsUpdate = true;
  ringGeo.attributes.aStart.array[i] = U.time.value;
  ringGeo.attributes.aLife.array[i] = life;
  ringGeo.attributes.aStr.array[i] = strength;
  ringGeo.attributes.aStart.needsUpdate = true;
  ringGeo.attributes.aLife.needsUpdate = true;
  ringGeo.attributes.aStr.needsUpdate = true;
}

function makeParticles(count, layer, additive, gravity, drag) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const colA = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  const alp = new Float32Array(count);
  for (let i = 0; i < count; i++) { pos[i * 3 + 1] = -999; alp[i] = 0; siz[i] = 0; }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aColor', new THREE.BufferAttribute(colA, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1).setUsage(THREE.DynamicDrawUsage));

  const mat = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
      attribute vec3 aColor; attribute float aSize, aAlpha;
      varying vec3 vC; varying float vA;
      void main(){
        vC = aColor; vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * 620.0 / max(-mv.z, 0.5);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      precision highp float;
      varying vec3 vC; varying float vA;
      void main(){
        vec2 d = gl_PointCoord - 0.5;
        float m = smoothstep(0.5, 0.12, length(d));
        if (m < 0.01) discard;
        gl_FragColor = vec4(pow(vC, vec3(1.0/2.2)), m * vA);
      }
    `,
    transparent: true, depthWrite: false,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  pts.layers.set(layer);
  pts.renderOrder = additive ? 8 : 7;
  scene.add(pts);

  const P = [];
  for (let i = 0; i < count; i++) P.push({ life: 0, max: 1, x: 0, y: -999, z: 0, vx: 0, vy: 0, vz: 0, sz: 1, r: 1, g: 1, b: 1, g2: gravity, drag: drag, mode: 0 });
  let cursor = 0;
  return {
    P, geo,
    emit(x, y, z, vx, vy, vz, life, size, r, g, b, mode) {
      const p = P[cursor++ % count];
      p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz;
      p.life = life; p.max = life; p.sz = size; p.r = r; p.g = g; p.b = b; p.mode = mode || 0;
      return p;
    },
    update(dt) {
      for (let i = 0; i < count; i++) {
        const p = P[i];
        if (p.life > 0) {
          p.life -= dt;
          if (p.life <= 0) { p.y = -999; alp[i] = 0; siz[i] = 0; continue; }
          if (p.mode === 0) {
            p.vy -= p.g2 * dt;
            p.vx *= 1 - p.drag * dt; p.vz *= 1 - p.drag * dt;
          } else {
            p.vy += 0.12 * dt;
            p.vx *= 1 - 1.8 * dt; p.vz *= 1 - 1.8 * dt;
          }
          p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
          if (p.mode === 0 && p.y < 0.02 && p.vy < 0) { p.life = Math.min(p.life, 0.12); p.y = 0.02; }
          const k = clamp(p.life / p.max, 0, 1);
          pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
          colA[i * 3] = p.r; colA[i * 3 + 1] = p.g; colA[i * 3 + 2] = p.b;
          alp[i] = p.mode === 0 ? Math.pow(k, 0.6) : Math.min(1, k * 1.6) * 0.7;
          siz[i] = p.sz * (p.mode === 0 ? (0.55 + 0.45 * k) : (1.6 - k * 0.6));
        }
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aColor.needsUpdate = true;
      geo.attributes.aAlpha.needsUpdate = true;
      geo.attributes.aSize.needsUpdate = true;
    }
  };
}

const pAir = makeParticles(900, 1, false, 11.0, 0.6);
const pUnder = makeParticles(500, 0, false, -0.4, 1.6);

function splash(c, scale) {
  const s = scale || 1;
  const R = (c.rig.cfg.rad || 1);
  const n = Math.floor(26 * s);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rand(0.6, 3.4) * s;
    pAir.emit(c.p.x + Math.cos(a) * 0.2, 0.08, c.p.z + Math.sin(a) * 0.2,
      Math.cos(a) * sp, rand(2.4, 5.6) * s, Math.sin(a) * sp,
      rand(0.5, 1.2), rand(0.05, 0.16), 0.94, 0.99, 1.0, 0);
  }
  addRing(c.p.x, c.p.z, R * 1.8, 0.95, 1.9);
  addRing(c.p.x, c.p.z, R * 3.2, 0.55, 2.8);
  addRing(c.p.x, c.p.z, R * 0.9, 0.8, 1.2);
  playSplash(clamp(0.5 * s, 0.2, 0.85));
}

function puffSilt(c) {
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * TAU, sp = rand(0.3, 1.4);
    pUnder.emit(c.p.x + Math.cos(a) * 0.3, c.p.y - 0.15, c.p.z + Math.sin(a) * 0.3,
      Math.cos(a) * sp, rand(0.15, 0.7), Math.sin(a) * sp,
      rand(1.4, 2.8), rand(0.28, 0.7), 0.62, 0.55, 0.42, 1);
  }
}
