<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>行星环卫星特效测试</title><style>body{margin:0;background:#061113;display:flex;flex-direction:column;align-items:center;font-family:monospace;color:#eafff9}canvas{display:block}#hud{padding:10px;display:flex;gap:20px;align-items:center}input[type=range]{width:300px}#label{font-size:14px}</style></head>
<body>
<div id="hud"><label>质量: <input type="range" id="mass" min="0" max="90" value="0" step="0.1"><span id="label">0</span></label></div>
<script type="module">
import * as THREE from 'three';
import { PLANETARY_RINGS, satelliteOrbitState, ringMotionState, stageChargeProgress } from './src/game/progression.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x061113);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 4, 6);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight - 60);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa7fff0, 0x071018, 2.5));
const keyLight = new THREE.DirectionalLight(0xffb78b, 4);
keyLight.position.set(-5, 10, 5);
scene.add(keyLight);

const cssColor = (v) => new THREE.Color(v);
const glowMaterial = (color, opacity=1) => new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 1.5, roughness: 0.25, metalness: 0.2, transparent: opacity<1, opacity});

// Body
const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 4), glowMaterial(0x71ffe0));
scene.add(body);
const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.08, 2), new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:0.25}));
scene.add(shell);

// Rings
const ringGroup = new THREE.Group();
const ringMaterials = [];
const ringMeshes = [];
for (const rd of PLANETARY_RINGS) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {uProgress:{value:0},uTrackColor:{value:cssColor(rd.trackColor)},uStartColor:{value:cssColor(rd.gradientStart)},uEndColor:{value:cssColor(rd.gradientEnd)},uOpacity:{value:0},uOffset:{value:0},uPulse:{value:0},uFlowPhase:{value:0},uFlowDirection:{value:1},uComplete:{value:0}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uProgress;uniform vec3 uTrackColor;uniform vec3 uStartColor;uniform vec3 uEndColor;uniform float uOpacity;uniform float uOffset;uniform float uPulse;uniform float uFlowPhase;uniform float uFlowDirection;uniform float uComplete;varying vec2 vUv;
      void main(){float phase=fract(vUv.x+uOffset);float edge=fwidth(phase)*1.5;float complete=step(0.9995,uComplete);float partialFill=step(0.0001,uProgress)*(1.0-smoothstep(uProgress-edge,uProgress+edge,phase));float filled=mix(partialFill,1.0,complete);float linG=clamp(phase/max(uProgress,0.0001),0.0,1.0);float loopG=0.5-0.5*cos(phase*6.28318530718);float gPos=mix(linG,loopG,complete);vec3 energy=mix(uStartColor,uEndColor,gPos);float flowPos=fract(uFlowPhase*uFlowDirection);float flowDist=abs(phase-flowPos);flowDist=min(flowDist,1.0-flowDist);float flow=exp(-flowDist*flowDist*420.0)*filled;vec3 finalColor=mix(uTrackColor,energy*(1.0+uPulse),filled);finalColor+=flow*vec3(0.9,0.95,1.0)*(0.65+uPulse);gl_FragColor=vec4(finalColor,uOpacity);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const ring = new THREE.Mesh(new THREE.TorusGeometry(rd.radius, 0.045, 10, 96), mat);
  ring.rotation.x = Math.PI/2;
  ring.visible = false;
  ringGroup.add(ring);
  ringMaterials.push(mat);
  ringMeshes.push(ring);
}
scene.add(ringGroup);

// Satellites
const satelliteGroup = new THREE.Group();
const satelliteVisuals = new Map();
for (const def of satelliteOrbitState(90, 0)) {
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(def.size, 2), glowMaterial(def.color));
  const halo = new THREE.Mesh(new THREE.SphereGeometry(def.size*2.1, 12, 8), new THREE.MeshBasicMaterial({color:def.color,transparent:true,opacity:0.14,blending:THREE.AdditiveBlending,depthWrite:false}));
  const g = new THREE.Group();
  g.add(core, halo);
  const trailCount = 64;
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(trailCount*3), 3));
  const prog = new Float32Array(trailCount);
  for (let i=0;i<trailCount;i++) prog[i] = i/(trailCount-1);
  trailGeo.setAttribute('aProgress', new THREE.BufferAttribute(prog, 1));
  const trailMat = new THREE.ShaderMaterial({
    uniforms:{uColor:{value:cssColor(def.color)}},
    vertexShader:`attribute float aProgress;varying float vProgress;void main(){vProgress=aProgress;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform vec3 uColor;varying float vProgress;void main(){float fade=vProgress*vProgress;vec3 col=mix(uColor*0.1,uColor*2.4,vProgress);gl_FragColor=vec4(col,fade);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  const trail = new THREE.Line(trailGeo, trailMat);
  g.visible = false;
  trail.visible = false;
  satelliteGroup.add(g, trail);
  satelliteVisuals.set(def.id, {group:g, core, halo, trail, trailCount});
}
scene.add(satelliteGroup);

const ringEuler = new THREE.Euler();
const ringQuat = new THREE.Quaternion();
const tmpVec = new THREE.Vector3();
function orbitalPoint(orbit, angle) {
  tmpVec.set(Math.cos(angle)*orbit.radius, Math.sin(angle)*orbit.radius, 0);
  ringEuler.set(orbit.tiltX ?? Math.PI/2, orbit.tiltY ?? 0, 0, 'XYZ');
  ringQuat.setFromEuler(ringEuler);
  tmpVec.applyQuaternion(ringQuat);
  return tmpVec;
}
function updateSatellite(vis, orbit, time) {
  const p = orbitalPoint(orbit, orbit.angle);
  vis.group.position.copy(p);
  vis.core.rotation.x = time * orbit.speed * 1.4;
  vis.core.rotation.y = time * orbit.speed * orbit.direction;
  vis.halo.scale.setScalar(1 + Math.sin(time*4 + orbit.phase) * 0.16);
  const positions = vis.trail.geometry.attributes.position.array;
  for (let i=0; i<vis.trailCount; i++) {
    const amt = i/(vis.trailCount-1);
    const a = orbit.angle - orbit.direction * orbit.trailArc * (1-amt);
    const pt = orbitalPoint(orbit, a);
    const wob = Math.sin(time*6 + i*0.7 + orbit.phase) * 0.035 * (1-amt);
    positions[i*3] = pt.x + Math.cos(time*3+i)*wob;
    positions[i*3+1] = pt.y + Math.sin(time*4+i*1.3)*wob;
    positions[i*3+2] = pt.z;
  }
  vis.trail.geometry.attributes.position.needsUpdate = true;
}

const massSlider = document.getElementById('mass');
const label = document.getElementById('label');
let mass = 0;
massSlider.addEventListener('input', () => { mass = parseFloat(massSlider.value); label.textContent = mass.toFixed(1); });

function animate(time) {
  requestAnimationFrame(animate);
  const t = time / 1000;
  const charge = stageChargeProgress(mass);
  const ascProgress = 0;
  body.scale.setScalar(1.0);
  const ringMotion = ringMotionState('playing', ascProgress, t);
  const sats = satelliteOrbitState(mass, t, 'playing', ascProgress);
  const satByRing = new Map();
  for (const s of sats) satByRing.set(s.ringId, s);
  ringMeshes.forEach((ring, i) => {
    const rd = PLANETARY_RINGS[i];
    const ringData = { progress: Math.min(1, (mass - rd.unlockMass) / (rd.completeMass - rd.unlockMass)) };
    ringData.progress = Math.max(0, ringData.progress);
    const motion = ringMotion[i];
    ring.visible = mass >= rd.unlockMass;
    if (!ring.visible) return;
    const mat = ringMaterials[i];
    mat.uniforms.uProgress.value = ringData.progress >= 1 ? 1 : ringData.progress;
    mat.uniforms.uOpacity.value = Math.min(0.85, 0.45 + ringData.progress * 0.3);
    mat.uniforms.uOffset.value = ringData.progress >= 1 ? motion.spin / (Math.PI*2) : 0;
    mat.uniforms.uPulse.value = ringData.progress >= 0.7 ? Math.sin(t*5.5)*0.3 : 0;
    mat.uniforms.uFlowPhase.value = motion.flowPhase;
    mat.uniforms.uFlowDirection.value = motion.direction;
    mat.uniforms.uComplete.value = ringData.progress >= 1 ? 1 : 0;
    ring.rotation.set(motion.tiltX, motion.tiltY, motion.spin);
  });
  const activeIds = new Set(sats.map(s=>s.id));
  satelliteVisuals.forEach((vis, id) => {
    const v = activeIds.has(id);
    vis.group.visible = v;
    vis.trail.visible = v;
  });
  for (const orbit of sats) {
    const vis = satelliteVisuals.get(orbit.id);
    if (vis) updateSatellite(vis, orbit, t);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
window.addEventListener('resize', () => { camera.aspect=innerWidth/(innerHeight-60); camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight-60); });
</script>
</body></html>
